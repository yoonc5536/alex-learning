<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alex Voca — Vocabulary from Your Reading</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#f6f7fb;color:#1e293b;line-height:1.6}
.wrap{max-width:1150px;margin:0 auto;padding:28px 20px 60px}
header h1{font-size:30px;margin:0 0 4px;letter-spacing:-.3px}
header p{color:#64748b;margin:0 0 20px;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
@media(max-width:700px){.stats{grid-template-columns:1fr}}
.stat{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:18px 20px}
.stat .num{font-size:32px;font-weight:800;line-height:1.1}
.stat .lbl{font-size:13px;color:#64748b}
.search{width:100%;font-size:15px;border:2px solid #e2e8f0;border-radius:12px;padding:12px 14px;font-family:inherit;margin-bottom:18px}
#sessions{display:grid;gap:10px}
.sesscard{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px 18px;cursor:pointer}
.sesscard:hover{border-color:#a5b4fc}
.sesscard b{font-size:15px}
.sessmeta{font-size:13px;color:#64748b}
.sessdone{font-size:13px;color:#166534;font-weight:700;margin-top:2px}
.badge{display:inline-block;background:#fef3c7;color:#92400e;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;margin-left:6px;vertical-align:2px}
.go{font-weight:700;color:#4f46e5;white-space:nowrap;font-size:14px}
.back{background:none;border:0;color:#4f46e5;font-weight:700;font-size:15px;cursor:pointer;padding:0;margin-bottom:14px;font-family:inherit}
.back:hover{text-decoration:underline}
.quiztitle{font-size:22px;font-weight:800;margin:0 0 16px}
.progress{height:10px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-bottom:6px}
.progress i{display:block;height:100%;background:#4f46e5;border-radius:999px;transition:width .3s}
.progtext{font-size:13px;color:#64748b;margin-bottom:18px}
.layout{display:grid;grid-template-columns:370px 1fr;gap:20px;align-items:start}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:22px}
.passage h2{font-size:18px;margin:0 0 8px}
.passage .tag{display:inline-block;background:#eef2ff;color:#4f46e5;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;margin-bottom:10px}
.passage p{font-size:16px;margin:0 0 12px}
.passage .w{border-radius:4px;padding:0 1px}
.passage.tapmode .w{cursor:pointer}
.passage.tapmode .w:hover{background:#fef08a}
.passage .w.wsel{background:#fde68a;outline:2px solid #f59e0b}
.hint{font-size:13px;color:#64748b;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:10px;padding:10px 12px;margin-top:12px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.qhead h2{font-size:18px;margin:0}
.qtype{font-size:12px;font-weight:700;color:#fff;background:#0ea5e9;padding:3px 11px;border-radius:999px;white-space:nowrap}
.qtext{font-size:17px;margin:14px 0}
.qtext .sent{font-style:italic;color:#334155}
.opts{display:grid;gap:10px}
.opts button{text-align:left;background:#f8fafc;border:2px solid #e2e8f0;border-radius:12px;padding:12px 14px;font-size:15px;cursor:pointer;color:#1e293b}
.opts button:hover{border-color:#a5b4fc}
.opts button.sel{background:#e0e7ff;border-color:#4f46e5}
input[type=text],textarea{width:100%;font-size:15px;border:2px solid #e2e8f0;border-radius:12px;padding:12px 14px;font-family:inherit}
textarea{min-height:90px;resize:vertical}
.btn{background:#4f46e5;color:#fff;border:0;font-weight:700;font-size:15px;padding:11px 22px;border-radius:999px;cursor:pointer}
.btn.secondary{background:#e2e8f0;color:#334155}
.btnrow{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:15px;display:none}
.fb.info{background:#eef2ff;display:block}
.confirm{margin-top:14px;padding:14px 16px;border-radius:12px;font-size:15px;background:#fffbeb;border:2px solid #f59e0b}
.example{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:12px 14px;margin:12px 0;font-size:15px}
.dots{display:flex;gap:7px;margin-top:18px;flex-wrap:wrap}
.dots i{width:26px;height:26px;border-radius:50%;background:#e2e8f0;color:#64748b;font-style:normal;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer}
.dots i.done{background:#c7d2fe;color:#3730a3}
.dots i.cur{outline:2px solid #4f46e5;outline-offset:2px}
.results h2{font-size:22px;margin:0 0 6px}
.big{font-size:44px;font-weight:800;margin:6px 0}
.review{margin-top:14px}
.review>div{padding:10px 0;border-top:1px solid #f1f5f9;font-size:15px}
.review>div>div{margin-top:4px}
.bank{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:14px}
.bank .card{padding:16px 18px}
.bank b{font-size:16px}
.pos{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;margin-left:6px;vertical-align:middle;background:#e2e8f0;color:#475569}
.pos-noun{background:#2563eb;color:#fff}
.pos-pronoun{background:#22d3ee;color:#164e63}
.pos-verb{background:#dc2626;color:#fff}
.pos-adjective{background:#16a34a;color:#fff}
.pos-adverb{background:#ea580c;color:#fff}
.pos-preposition{background:#7c3aed;color:#fff}
.pos-conjunction{background:#ec4899;color:#fff}
.pos-interjection{background:#eab308;color:#713f12}
.bank p{margin:6px 0 0;font-size:14px;color:#475569}
footer{color:#94a3b8;font-size:13px;margin-top:30px}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>📖 Alex Voca</h1>
<p>Vocabulary from your reading homework · 10 questions a session</p>
</header>

<div id="landing">
<div class="stats" id="stats"></div>
<input class="search" id="search" placeholder="Search sessions or words…" oninput="setFilter(this.value)">
<div id="sessions"></div>
</div>

<div id="quizview" style="display:none">
<button class="back" onclick="goBack()">← All sessions</button>
<h2 class="quiztitle" id="quiztitle"></h2>
<div class="progress"><i id="bar" style="width:0%"></i></div>
<div class="progtext" id="progtext"></div>
<div id="main"></div>
<div class="card" style="margin-top:20px" id="bankcard">
<h2 style="font-size:18px;margin:0 0 4px">Word Bank</h2>
<p style="color:#64748b;font-size:14px;margin:0" id="banknote"></p>
<div class="bank" id="bank"></div>
</div>
</div>

<footer>New passages arrive each week from your reading homework. Questions live in the question bank and grow every week.</footer>
</div>

<script>
var DATA = {"meta":{"app":"alex-voca","version":2,"note":"Flat session list (no week indexing). Sessions are listed newest first. Each session records its release date. Completion dates are tracked in the browser (localStorage) and shown on the landing page."},"sessions":[{"id":"s2","title":"Trick-or-Treat","author":"Kimber Krochmal","passage":["Did you ever wonder where the idea of Trick-or-Treat comes from? Well, it all started with an old Irish tradition.","The Irish believed that on Halloween night the veil between our world and the spirit world was thin. On that night, ghosts could come back to visit their loved ones.","But they also believed that some ghosts were unhappy and used Halloween to frighten people. The Irish people would put out bowls of milk and fruit on their doorstep. If the spirits were happy with their treats, they would go somewhere else to make their mischief.","Everyone tried to stay inside on Halloween night where it was safe. But anyone who had to go out for some reason would wear a costume and a mask. If the costume was good enough it would confuse the spirits and they wouldn't bother you.","Over time these traditions changed. During the Middle Ages, teenagers and young adults took the place of the spirits. They would dress up and go door to door saying \"trick-or-treat.\" If they were given a treat, they went on to the next house. But if not, they played a trick on that person. These were harmless tricks and no one ever got hurt from them. Still, it was better to just give them a treat.","When the Irish came to America during the Great Potato Famine, they brought the tradition of \"trick-or-treat\" with them. Soon everyone was joining in and who can blame them? What could be more fun than dressing up and going from house to house getting candy and treats?"],"words":[{"w":"tradition","pos":"noun","def":"A custom or belief passed down over time.","ex":"Trick-or-treat started as an old Irish tradition.","parts":"trad (hand over) → something handed down over time"},{"w":"veil","pos":"noun","def":"A thin curtain or barrier.","ex":"The veil between our world and the spirit world was thin.","parts":"vel (cover) → a thin covering"},{"w":"mischief","pos":"noun","def":"Playful trouble or naughty behavior.","ex":"The spirits would go somewhere else to make their mischief.","parts":"mis- (wrongly, badly) → trouble from doing something wrong"},{"w":"confuse","pos":"verb","def":"To make someone unable to think clearly; to mix up.","ex":"A good costume would confuse the spirits.","parts":"con- (together) + fus (pour) → poured together, mixed up"},{"w":"harmless","pos":"adjective","def":"Unable to cause hurt or harm.","ex":"These were harmless tricks.","parts":"harm + -less (without) → without harm"},{"w":"frighten","pos":"verb","def":"To scare someone.","ex":"Some ghosts used Halloween to frighten people.","parts":"fright (fear) + -en (make) → to make afraid"}],"questions":[{"id":"s2-q01","type":"mcq","kind":"Meaning from context","word":"veil","q":"Read this sentence from the passage:","sent":"The Irish believed that on Halloween night the veil between our world and the spirit world was thin.","ask":"What does “veil” mean here?","opts":["A thin curtain or barrier","A kind of ghost","A Halloween costume","A loud noise"],"ans":0,"why":"A veil is a thin covering. Here it means the thin barrier between our world and the spirit world."},{"id":"s2-q02","type":"mcq","kind":"Thesaurus · synonym","word":"mischief","q":"Which word means almost the same as “mischief”?","opts":["kindness","playful trouble","a sweet treat","a costume"],"ans":1,"why":"Mischief means playful trouble or naughty behavior."},{"id":"s2-q03","type":"mcq","kind":"Thesaurus · antonym","word":"harmless","q":"Which word is the opposite of “harmless”?","opts":["dangerous","funny","small","quiet"],"ans":0,"why":"Harmless means unable to cause hurt. Dangerous means able to cause hurt."},{"id":"s2-q04","type":"mcq","kind":"Word parts","word":"harmless","q":"harm + -less = harmless. What does the ending “-less” mean?","opts":["full of","without","again","before"],"ans":1,"why":"The suffix -less means “without”: harmless = without harm."},{"id":"s2-q05","type":"tap","kind":"Word detective","word":"frighten","q":"Tap the word in the passage that means “to scare someone”.","target":"frighten","why":"“Frighten” means to scare someone."},{"id":"s2-q06","type":"mcq","kind":"Correct usage","word":"tradition","q":"Which sentence uses “tradition” correctly?","opts":["We tradition the candy every year.","Trick-or-treating is an old Irish tradition.","The tradition ran fast down the street.","She traditionly wore a scary mask."],"ans":1,"why":"Here “tradition” is a noun: a custom passed down over time."},{"id":"s2-q07","type":"blank","kind":"Fill in the blank","word":"confuse","q":"Fill in the blank with a word from the passage:","sent":"If the costume was good enough it would ______ the spirits.","accept":["confuse"],"hint":"Look at paragraph 4 of the passage."},{"id":"s2-q08","type":"mcq","kind":"Shades of meaning","word":"frighten","q":"Which word shows the STRONGEST fear?","opts":["nervous","scared","frightened","terrified"],"ans":3,"why":"Nervous is mild, scared and frightened are stronger, and terrified is the strongest fear of all."},{"id":"s2-q09","type":"write","kind":"Sentence writing","word":"tradition","q":"Here is an example sentence. Now write your own sentence using “tradition”.","example":"It is a family tradition to eat noodles on birthdays.","model":"Example of a good sentence: “In our family, it is a tradition to go hiking every fall.” A good sentence shows a custom that repeats."},{"id":"s2-q10","type":"mcq","kind":"Thesaurus · odd one out","word":null,"q":"Which word is most different in meaning from the others?","opts":["frighten","scare","terrify","confuse"],"ans":3,"why":"Frighten, scare, and terrify all mean to make someone afraid. Confuse means to mix someone up."}],"released":"2026-10-28"}]};
var state={session:0,qi:0,ans:{},tap:{},typed:{},self:{},filter:"",notice:"",confirming:false,results:null,attemptIdx:-1};
function el(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}
function sessions(){return DATA.sessions||[];}
function session(){return sessions()[state.session];}
function qs(){var s=session();return s?s.questions:[];}
function resetSessionState(){
 state.qi=0;state.ans={};state.tap={};state.typed={};state.self={};state.notice="";state.confirming=false;state.results=null;state.attemptIdx=-1;
}
function todayISO(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
var MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDate(iso){var p=iso.split("-");return MONTHS[parseInt(p[1],10)-1]+" "+parseInt(p[2],10)+", "+p[0];}
function getDone(){try{return JSON.parse(localStorage.getItem("alexvoca_done")||"{}");}catch(e){return {};}}
function saveDone(){try{var d=getDone();d[session().id]=todayISO();localStorage.setItem("alexvoca_done",JSON.stringify(d));}catch(e){}}
function getAttempts(){try{return JSON.parse(localStorage.getItem("alexvoca_attempts")||"{}");}catch(e){return {};}}
function saveAttemptsMap(m){try{localStorage.setItem("alexvoca_attempts",JSON.stringify(m));}catch(e){}}
function sessionAttempts(sid){var m=getAttempts();return m[sid]||[];}
function totals(){
 var s=0,w=0,q=0;
 sessions().forEach(function(sn){s++;w+=(sn.words||[]).length;q+=(sn.questions||[]).length;});
 return {sessions:s,words:w,questions:q};
}
function renderLanding(){
 var t=totals();
 el("stats").innerHTML=
  '<div class="stat"><div class="num">'+t.sessions+'</div><div class="lbl">sessions</div></div>'+
  '<div class="stat"><div class="num">'+t.words+'</div><div class="lbl">words in the bank</div></div>'+
  '<div class="stat"><div class="num">'+t.questions+'</div><div class="lbl">questions</div></div>';
 var done=getDone();
 var att=getAttempts();
 var html="";
 for(var si=sessions().length-1;si>=0;si--){
  var s=sessions()[si];
  if(state.filter){
   var f=state.filter.toLowerCase();
   var match=s.title.toLowerCase().indexOf(f)>=0||(s.words||[]).some(function(w){return w.w.toLowerCase().indexOf(f)>=0;});
   if(!match)continue;
  }
  var list=att[s.id]||[];
  var d=list.length?list[list.length-1].date:done[s.id];
  var attText="";
  if(list.length)attText=" · "+list.length+" attempt"+(list.length>1?"s":"")+" · Last score "+list[list.length-1].auto+"/"+list[list.length-1].total;
  html+='<div class="sesscard" onclick="openSession('+si+')"><div><b>Session '+(si+1)+' · '+esc(s.title)+'</b>'+(s.sample?'<span class="badge">Sample</span>':'')+'<div class="sessmeta">'+(s.words||[]).length+' words · '+s.questions.length+' questions · Released '+fmtDate(s.released)+'</div>'+(d?'<div class="sessdone">✓ Completed '+fmtDate(d)+attText+'</div>':'')+'</div>'+(d?'<button class="btn secondary" onclick="event.stopPropagation();openSession('+si+')">Try again</button>':'<span class="go">Start →</span>')+'</div>';
 }
 el("sessions").innerHTML=html||'<div class="card">No sessions yet. New sessions appear here when they are created.</div>';
}
function setFilter(v){state.filter=v.trim();renderLanding();}
function openSession(si){
 state.session=si;resetSessionState();
 el("landing").style.display="none";el("quizview").style.display="block";
 el("quiztitle").textContent="Session "+(si+1)+" · "+session().title;
 renderStudy();
}
function goBack(){el("quizview").style.display="none";el("landing").style.display="block";renderLanding();}
function passageHTML(){
 var d=session();
 var cur=qs()[state.qi];
 var sel=(cur&&cur.type==="tap")?state.tap[cur.id]:null;
 var html='<div class="card passage" id="passage"><span class="tag">Passage · Session '+(state.session+1)+'</span><h2>'+esc(d.title)+'</h2>'+(d.author?'<p style="color:#64748b;font-size:13px;margin:-4px 0 10px">By '+esc(d.author)+'</p>':'');
 d.passage.forEach(function(p){
  var words=p.split(" ");
  html+="<p>"+words.map(function(w){
   var clean=w.replace(/[^a-zA-Z]/g,"").toLowerCase();
   var cls="w"+(sel&&clean===sel?" wsel":"");
   return '<span class="'+cls+'" data-w="'+clean+'" onclick="tapWord(this)">'+esc(w)+"</span>";
  }).join(" ")+"</p>";
 });
 html+='<div class="hint">Tip: for the Word detective question, tap a word right in the passage.</div></div>';
 return html;
}
function tapWord(span){
 var q=qs()[state.qi];
 if(!q||q.type!=="tap")return;
 state.tap[q.id]=span.getAttribute("data-w");
 state.notice="";state.confirming=false;
 renderQuiz();
}
function attemptsHTML(sid){
 var list=sessionAttempts(sid);
 if(!list.length)return "";
 var html='<div class="card" style="margin-top:20px"><h2 style="font-size:18px;margin:0 0 10px">Past attempts ('+list.length+')</h2>';
 for(var i=list.length-1;i>=0;i--){
  var a=list[i];
  html+='<div style="padding:10px 0;border-top:1px solid #f1f5f9"><b>'+fmtDate(a.date)+'</b> · Score '+a.auto+'/'+a.total;
  if(a.wrong.length){
   html+='<div style="font-size:14px;color:#b91c1c;margin-top:4px">Wrong ('+a.wrong.length+'): '+a.wrong.map(function(w){return 'Q'+w.n+' '+esc(w.kind)+' ('+esc(w.word)+'): “'+esc(w.yours)+'” → “'+esc(w.correct)+'”';}).join('<br>')+'</div>';
  }else{
   html+='<div style="font-size:14px;color:#166534;margin-top:4px">All auto-graded questions correct!</div>';
  }
  a.writes.forEach(function(w){
   var rating=w.rating?(w.rating==="got"?"Got it":w.rating==="almost"?"Almost":"Not yet"):"not rated";
   html+='<div style="font-size:14px;color:#475569;margin-top:2px">Writing ('+esc(w.word)+'): '+rating+'</div>';
  });
  html+='</div>';
 }
 html+='</div>';
 return html;
}
function renderStudy(){
 var s=session();
 var html='<p style="color:#475569;font-size:15px;margin:0 0 16px">First, read the passage and study the words. When you are ready, press Start quiz.</p><div class="layout">';
 html+='<div class="card passage"><span class="tag">Passage · Session '+(state.session+1)+'</span><h2>'+esc(s.title)+'</h2>'+(s.author?'<p style="color:#64748b;font-size:13px;margin:-4px 0 10px">By '+esc(s.author)+'</p>':'');
 s.passage.forEach(function(p){html+='<p>'+esc(p)+'</p>';});
 html+='</div>';
 html+='<div><div class="card"><h2 style="font-size:18px;margin:0 0 6px">Words to learn ('+(s.words||[]).length+')</h2><p style="color:#64748b;font-size:14px;margin:0 0 6px">These are the words in the quiz. Study each meaning first.</p>';
 (s.words||[]).forEach(function(w){
  html+='<div style="padding:10px 0;border-top:1px solid #f1f5f9"><b>'+esc(w.w)+'</b><span class="pos pos-'+w.pos+'">'+w.pos+'</span><p style="margin:4px 0 0;font-size:15px">'+esc(w.def)+'</p>'+(w.parts?'<p style="margin:4px 0 0;font-size:14px;color:#6d28d9">Stem &amp; word parts: '+esc(w.parts)+'</p>':'')+'<p style="margin:2px 0 0;font-size:14px;color:#64748b">“'+esc(w.ex)+'”</p></div>';
 });
 html+='<div class="btnrow"><button class="btn" onclick="startQuiz()">Start quiz →</button></div></div></div></div>';
 html+=attemptsHTML(s.id);
 el("main").innerHTML=html;
 el("bankcard").style.display="none";
 el("bar").style.width="0%";
 el("progtext").textContent="Read the passage and study the words, then start the quiz.";
}
function startQuiz(){renderQuiz();renderBank();}
function isAnswered(q){
 if(q.type==="mcq")return state.ans[q.id]!==undefined;
 if(q.type==="tap")return state.tap[q.id]!==undefined;
 return (state.typed[q.id]||"").trim().length>0;
}
function answeredCount(){var n=0;qs().forEach(function(q){if(isAnswered(q))n++;});return n;}
function renderQuiz(){
 el("bankcard").style.display="block";
 var q=qs()[state.qi];
 var total=qs().length;
 var html='<div class="layout">'+passageHTML()+'<div>';
 html+='<div class="card"><div class="qhead"><h2>Question '+(state.qi+1)+' of '+total+'</h2><span class="qtype">'+q.kind+'</span></div>';
 if(state.notice)html+='<div class="fb info" id="notice" style="display:block">'+esc(state.notice)+'</div>';
 html+='<div class="qtext">'+q.q+'</div>';
 if(q.sent)html+='<div class="qtext"><span class="sent">“'+esc(q.sent)+'”</span></div>';
 if(q.example)html+='<div class="example">Example: “'+esc(q.example)+'”</div>';
 if(q.type==="mcq"){
  html+='<div class="opts" id="opts">';
  q.opts.forEach(function(o,i){
   html+='<button class="'+(state.ans[q.id]===i?"sel":"")+'" onclick="pickOpt('+i+')">'+esc(o)+"</button>";
  });
  html+="</div>";
 }else if(q.type==="blank"){
  html+='<input type="text" id="answer" placeholder="Type the missing word…" value="'+esc(state.typed[q.id]||"")+'" oninput="typeAnswer(this.value)">';
 }else if(q.type==="tap"){
  var sel=state.tap[q.id];
  html+='<div class="fb info" style="display:block">'+(sel?'You picked: <b>'+esc(sel)+'</b>. Tap another word to change it.':'Tap a word in the passage on the left.')+'</div>';
 }else if(q.type==="write"){
  html+='<textarea id="answer" placeholder="Type your sentence here…" oninput="typeAnswer(this.value)">'+esc(state.typed[q.id]||"")+'</textarea>';
 }
 html+='<div class="btnrow">';
 if(state.qi>0)html+='<button class="btn secondary" onclick="prevQ()">← Back</button>';
 if(state.qi<total-1)html+='<button class="btn secondary" onclick="nextQ()">Next →</button>';
 html+='<button class="btn" style="margin-left:auto" onclick="askSubmit()">Submit answers</button></div>';
 if(state.confirming)html+='<div class="confirm"><b>Submit your answers?</b><br>You answered '+answeredCount()+' of '+total+' questions. After submitting, you will see your score and review, and you can no longer change your answers.<div class="btnrow"><button class="btn" onclick="confirmSubmit()">Yes, submit</button><button class="btn secondary" onclick="cancelSubmit()">Keep solving</button></div></div>';
 html+='<div class="dots" id="dots"></div></div></div></div>';
 el("main").innerHTML=html;
 var pas=el("passage");
 if(q.type==="tap")pas.classList.add("tapmode");
 renderDots();renderProgress();
 var inp=el("answer");if(inp)inp.focus();
}
function renderDots(){
 var html="";
 for(var i=0;i<qs().length;i++){
  var cls=isAnswered(qs()[i])?"done":"";if(i===state.qi)cls+=" cur";
  html+='<i class="'+cls+'" onclick="jumpQ('+i+')">'+(i+1)+"</i>";
 }
 el("dots").innerHTML=html;
}
function renderProgress(){
 var done=answeredCount();
 var total=qs().length;
 el("bar").style.width=(total?done/total*100:0)+"%";
 el("progtext").textContent="Question "+(state.qi+1)+" of "+total+" · Answered "+done+" of "+total;
}
function pickOpt(i){
 var q=qs()[state.qi];
 state.ans[q.id]=i;
 state.notice="";state.confirming=false;
 renderQuiz();
}
function typeAnswer(v){
 var q=qs()[state.qi];
 state.typed[q.id]=v;
 state.notice="";state.confirming=false;
 var n=el("notice");if(n)n.style.display="none";
 var c=document.querySelector(".confirm");if(c)c.remove();
 renderDots();renderProgress();
}
function prevQ(){if(state.qi>0){state.qi--;state.notice="";state.confirming=false;renderQuiz();}}
function nextQ(){if(state.qi<qs().length-1){state.qi++;state.notice="";state.confirming=false;renderQuiz();}}
function jumpQ(i){state.qi=i;state.notice="";state.confirming=false;renderQuiz();}
function askSubmit(){
 var missing=[];
 qs().forEach(function(q,i){if(!isAnswered(q))missing.push(i+1);});
 if(missing.length){
  state.notice="Questions "+missing.join(", ")+" are not answered yet. Answer them first!";
  for(var i=0;i<qs().length;i++){if(!isAnswered(qs()[i])){state.qi=i;break;}}
  renderQuiz();
  return;
 }
 state.confirming=true;
 renderQuiz();
}
function confirmSubmit(){
 state.confirming=false;
 gradeAndSave();
 renderResults();
}
function cancelSubmit(){
 state.confirming=false;
 renderQuiz();
}
function gradeAndSave(){
 var results=[];
 var auto=0,autoTotal=0;
 qs().forEach(function(q,i){
  var r={n:i+1,q:q,yours:"",correct:"",ok:null,why:q.why||"",rating:null};
  if(q.type==="mcq"){
   autoTotal++;
   r.yours=q.opts[state.ans[q.id]];
   r.correct=q.opts[q.ans];
   r.ok=(state.ans[q.id]===q.ans);
   if(r.ok)auto++;
  }else if(q.type==="tap"){
   autoTotal++;
   r.yours=state.tap[q.id];
   r.correct=q.target;
   r.ok=(state.tap[q.id]===q.target);
   if(r.ok)auto++;
  }else if(q.type==="blank"){
   autoTotal++;
   var v=(state.typed[q.id]||"").trim().toLowerCase();
   r.yours=(state.typed[q.id]||"").trim();
   r.correct=q.accept[0];
   r.ok=(q.accept.indexOf(v)>=0);
   if(r.ok)auto++;
  }else if(q.type==="write"){
   r.yours=(state.typed[q.id]||"").trim();
   r.correct=q.model;
   r.rating=state.self[q.id]||null;
  }
  results.push(r);
 });
 state.results={auto:auto,autoTotal:autoTotal,list:results};
 var wrong=results.filter(function(r){return r.ok===false;}).map(function(r){return {n:r.n,kind:r.q.kind,word:r.q.word,q:r.q.q,yours:r.yours,correct:r.correct};});
 var writes=results.filter(function(r){return r.q.type==="write";}).map(function(r){return {qid:r.q.id,word:r.q.word,yours:r.yours,rating:r.rating};});
 var m=getAttempts();
 var sid=session().id;
 if(!m[sid])m[sid]=[];
 m[sid].push({date:todayISO(),auto:auto,total:autoTotal,wrong:wrong,writes:writes});
 saveAttemptsMap(m);
 state.attemptIdx=m[sid].length-1;
 saveDone();
}
function renderResults(){
 var R=state.results;
 var writeCount=R.list.filter(function(r){return r.q.type==="write";}).length;
 var html='<div class="card results"><h2>🎉 Session complete!</h2><div class="big">'+R.auto+' / '+R.autoTotal+'</div>';
 html+='<p>Auto-graded questions: '+R.auto+' of '+R.autoTotal+' correct.'+(writeCount?' Sentence writing is self-rated below.':'')+'</p>';
 html+='<p style="color:#166534;font-weight:700">✓ Saved on '+fmtDate(todayISO())+' — this attempt is added to your history.</p>';
 html+='<div class="review"><b>Review — every question:</b>';
 R.list.forEach(function(r){
  html+='<div><b>Q'+r.n+' · '+esc(r.q.kind)+'</b> '+(r.ok===true?'✅':r.ok===false?'❌':'✏️ Self-check');
  html+='<div>'+esc(r.q.q)+'</div>';
  if(r.q.sent)html+='<div><span class="sent">“'+esc(r.q.sent)+'”</span></div>';
  if(r.q.example)html+='<div>Example: “'+esc(r.q.example)+'”</div>';
  html+='<div>Your answer: <b>'+esc(r.yours||"(no answer)")+'</b></div>';
  if(r.ok!==null){
   html+='<div>Correct answer: <b>'+esc(r.correct)+'</b></div>';
   if(r.why)html+='<div style="color:#475569">'+esc(r.why)+'</div>';
  }else{
   html+='<div>Model answer: <b>'+esc(r.correct)+'</b></div>';
   html+='<div class="btnrow" style="margin-top:8px"><span style="font-size:14px;color:#475569">How did yours do?</span><button class="btn'+(r.rating==="got"?"":" secondary")+'" onclick="rateReview('+r.n+',\'got\')">✓ Got it</button><button class="btn'+(r.rating==="almost"?"":" secondary")+'" onclick="rateReview('+r.n+',\'almost\')">~ Almost</button><button class="btn'+(r.rating==="missed"?"":" secondary")+'" onclick="rateReview('+r.n+',\'missed\')">✗ Not yet</button></div>';
  }
  html+='</div>';
 });
 html+='</div>';
 var list=sessionAttempts(session().id);
 if(list.length>1){
  html+='<div style="margin-top:20px"><b>Previous attempts:</b>';
  for(var i=list.length-2;i>=0;i--){
   var a=list[i];
   html+='<div style="font-size:14px;padding:6px 0;border-top:1px solid #f1f5f9">'+fmtDate(a.date)+' · Score '+a.auto+'/'+a.total+(a.wrong.length?' · Wrong: '+a.wrong.map(function(w){return esc(w.word);}).join(', '):' · All correct!')+'</div>';
  }
  html+='</div>';
 }
 html+='<div class="btnrow"><button class="btn" onclick="resetQuiz()">Practice again</button><button class="btn secondary" onclick="goBack()">← All sessions</button></div></div>';
 el("main").innerHTML=html;
 el("bar").style.width="100%";
 el("progtext").textContent="Complete · Score: "+R.auto+" / "+R.autoTotal;
}
function rateReview(n,rating){
 var r=state.results.list[n-1];
 r.rating=rating;
 state.self[r.q.id]=rating;
 var m=getAttempts();
 var list=m[session().id];
 if(list&&state.attemptIdx>=0&&list[state.attemptIdx]){
  var w=list[state.attemptIdx].writes.filter(function(x){return x.qid===r.q.id;})[0];
  if(w)w.rating=rating;
  saveAttemptsMap(m);
 }
 renderResults();
}
function resetQuiz(){resetSessionState();renderStudy();}
function allWords(){
 var out=[];
 sessions().forEach(function(sn){(sn.words||[]).forEach(function(x){out.push(x);});});
 return out;
}
function renderBank(){
 var s=session();
 var shown=s?s.words||[]:[];
 el("banknote").textContent="Words from this session · "+shown.length+" words here · "+allWords().length+" words in the whole bank.";
 var html="";
 shown.forEach(function(w){
  html+='<div class="card"><b>'+esc(w.w)+'</b><span class="pos pos-'+w.pos+'">'+w.pos+'</span><p>'+esc(w.def)+'</p>'+(w.parts?'<p style="color:#6d28d9">Stem &amp; word parts: '+esc(w.parts)+'</p>':'')+'<p style="color:#64748b">“'+esc(w.ex)+'”</p></div>';
 });
 el("bank").innerHTML=html;
}
renderLanding();
</script>
