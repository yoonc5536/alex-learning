<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 NYS Grade 3 ELA Practice Test</title>
<style>
  :root{
    --ink:#1e293b; --muted:#64748b; --line:#e2e8f0; --bg:#f1f5f9;
    --brand:#1d4ed8; --brand-d:#1e40af; --ok:#15803d; --okbg:#f0fdf4;
    --bad:#b91c1c; --badbg:#fef2f2; --warn:#b45309; --warnbg:#fffbeb;
    --card:#ffffff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.6}
  .wrap{max-width:1100px;margin:0 auto;padding:20px 20px 120px}
  header.hero{background:linear-gradient(135deg,#1e3a8a,#3b82f6);color:#fff;
    border-radius:16px;padding:28px 28px;margin-bottom:20px}
  header.hero h1{margin:0 0 6px;font-size:26px}
  header.hero p{margin:4px 0;opacity:.92}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:20px 22px;margin-bottom:16px}
  .card h2{margin:0 0 10px;font-size:20px}
  .card h3{margin:18px 0 8px;font-size:17px}
  .muted{color:var(--muted)}
  .btn{display:inline-block;border:0;border-radius:10px;padding:12px 22px;
    font-size:16px;font-weight:700;cursor:pointer;background:var(--brand);color:#fff}
  .btn:hover{background:var(--brand-d)}
  .btn.ghost{background:#fff;color:var(--brand);border:2px solid var(--brand)}
  .btn.ghost:hover{background:#eff6ff}
  .btn.small{padding:8px 14px;font-size:14px}
  .btn:disabled{opacity:.5;cursor:default}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:760px){.grid2{grid-template-columns:1fr}}
  .session-card{border:2px solid var(--line);border-radius:14px;padding:20px;background:#fff}
  .session-card h3{margin-top:0}
  .tag{display:inline-block;background:#dbeafe;color:#1e40af;font-weight:700;
    border-radius:999px;padding:2px 12px;font-size:13px;margin-right:6px}
  /* passage */
  .passage{background:#fffdf5;border:1px solid #fde68a;border-radius:12px;
    padding:18px 22px;margin:22px 0 8px}
  .passage .ptitle{font-weight:800;font-size:18px;margin-bottom:2px}
  .passage .pby{color:var(--muted);font-size:14px;margin-bottom:10px}
  .passage p{margin:10px 0}
  /* questions */
  .q{background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:16px 18px;margin:12px 0}
  .q .qnum{font-weight:800;color:var(--brand);margin-bottom:6px}
  .q .stem{font-weight:600;margin-bottom:10px}
  .q .stem .qtext{font-weight:400;font-style:italic;display:block;margin-top:6px;
    background:#f8fafc;border-left:4px solid var(--brand);padding:8px 12px}
  .choices{display:grid;gap:8px;margin-top:6px}
  .choice{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;
    background:#f8fafc;border:2px solid var(--line);border-radius:10px;
    padding:10px 12px;font-size:15px;cursor:pointer}
  .choice:hover{border-color:#93c5fd}
  .choice.sel{border-color:var(--brand);background:#eff6ff}
  .choice .letter{font-weight:800;min-width:22px;color:var(--brand)}
  .choice.correct{border-color:var(--ok);background:var(--okbg)}
  .choice.correct .letter{color:var(--ok)}
  .choice.wrongpick{border-color:var(--bad);background:var(--badbg)}
  .choice.wrongpick .letter{color:var(--bad)}
  .choice.disabled{cursor:default}
  textarea.wr{width:100%;min-height:130px;border:2px solid var(--line);
    border-radius:10px;padding:10px 12px;font-size:15px;font-family:inherit;
    line-height:1.6;resize:vertical}
  textarea.wr:focus{outline:none;border-color:var(--brand)}
  .wrans{background:#f8fafc;border:1px dashed var(--line);border-radius:10px;
    padding:10px 14px;margin:8px 0;white-space:pre-wrap}
  /* footer bar */
  .footbar{position:fixed;left:0;right:0;bottom:0;background:#fff;
    border-top:1px solid var(--line);padding:12px 20px;
    display:flex;align-items:center;gap:14px;z-index:50}
  .footbar .prog{font-weight:700}
  .footbar .spacer{flex:1}
  .confirm{background:#fffbeb;border:2px solid #f59e0b;border-radius:12px;
    padding:14px 18px;margin:14px 0}
  /* results */
  .score-big{font-size:34px;font-weight:800}
  .pill{display:inline-block;border-radius:999px;padding:3px 14px;font-weight:700;font-size:14px}
  .pill.ok{background:var(--okbg);color:var(--ok)}
  .pill.bad{background:var(--badbg);color:var(--bad)}
  .pill.warn{background:var(--warnbg);color:var(--warn)}
  details.rubric{margin:10px 0;border:1px solid var(--line);border-radius:10px;
    background:#f8fafc;padding:8px 14px}
  details.rubric summary{cursor:pointer;font-weight:700;color:var(--brand)}
  .scorebtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .scorebtns button{border:2px solid var(--line);background:#fff;border-radius:10px;
    padding:8px 16px;font-size:15px;font-weight:700;cursor:pointer}
  .scorebtns button.sel{background:var(--brand);color:#fff;border-color:var(--brand)}
  .att{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0;
    background:#fff;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .att .grow{flex:1;min-width:200px}
  pre.copybox{background:#0f172a;color:#e2e8f0;border-radius:10px;padding:14px;
    white-space:pre-wrap;font-size:13px;max-height:300px;overflow:auto}
  .hidden{display:none!important}
  .backlink{color:var(--brand);cursor:pointer;font-weight:700;background:none;border:0;
    font-size:15px;padding:0;margin-bottom:12px}
  .credit-tag{font-size:13px;color:var(--warn);font-weight:700}
  kbd{background:#f1f5f9;border:1px solid var(--line);border-radius:6px;padding:1px 7px;
    font-family:inherit}
</style>
</head>

<script>
"use strict";
/* ============================== data ============================== */
const DATA = JSON.parse(document.getElementById('quiz-data').textContent || '{}');
const LS_KEY = 'nysg3ela2026_attempts';

/* ============================== helpers ============================== */
const $ = s => document.querySelector(s);
const app = () => $('#app');
const footbar = () => $('#footbar');
function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}
function loadAttempts(){
  try{ return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); }
  catch(e){ return []; }
}
function saveAttempts(a){ localStorage.setItem(LS_KEY, JSON.stringify(a)); }
function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
}
function sessionById(id){ return (DATA.sessions||[]).find(s=>s.id===id); }
function mcQuestions(sess){ return sess.questions.filter(q=>q.kind==='mc'); }
function writtenQuestions(sess){ return sess.questions.filter(q=>q.kind!=='mc'); }

/* ============================== landing ============================== */
function renderLanding(){
  footbar().classList.add('hidden');
  const sess = DATA.sessions || [];
  const attempts = loadAttempts().slice().reverse();
  let h = '';

  h += `<div class="card"><h2>How this works</h2>
    <p>This practice test uses the <b>released questions</b> from the actual Spring 2026
    New York State Grade 3 ELA test — the same test you took last spring.</p>
    <ul>
      <li>There are <b>two sessions</b>. Take them on different days, just like the real test.</li>
      <li><b>Session 1</b> is multiple-choice only. <b>Session 2</b> has multiple-choice plus written answers.</li>
      <li>Answer every question, then press <b>Submit</b>. Your multiple-choice answers are checked right away.</li>
      <li>Written answers are scored by a parent with the official rubric, then everything is saved.</li>
    </ul>
    <p class="muted" style="font-size:13px">Note: questions 7–12 were field-test items and were not released,
    so the numbering jumps from 6 to 13 — that matches the official released booklet.</p>
    ${DATA.tips ? `<h3>Tips for taking the test</h3><p class="muted">${esc(DATA.tips)}</p>` : ''}
  </div>`;

  h += `<div class="grid2">`;
  for(const s of sess){
    const mc = mcQuestions(s).length, wr = writtenQuestions(s).length;
    h += `<div class="session-card">
      <h3>${esc(s.name)}</h3>
      <p><span class="tag">${mc} multiple-choice</span>${wr?`<span class="tag">${wr} written</span>`:''}</p>
      <p class="muted">${esc((s.passages||[]).map(p=>p.title).join(' · '))}</p>
      <button class="btn" data-start="${esc(s.id)}">Start ${esc(s.name)}</button>
    </div>`;
  }
  h += `</div>`;

  h += `<div class="card"><h2>My results</h2>`;
  if(!attempts.length){
    h += `<p class="muted">No attempts yet. Your scores will appear here after you submit a session.</p>`;
  }else{
    for(const a of attempts){
      const s = sessionById(a.sessionId);
      const mcScore = a.mc.filter(m=>m.ok).length;
      const mcTotal = a.mc.length;
      const wScored = a.written.filter(w=>w.score!=null);
      const wPts = wScored.reduce((t,w)=>t+w.score,0);
      const wMax = a.written.reduce((t,w)=>t+w.max,0);
      const wNote = a.written.length
        ? (wScored.length===a.written.length ? ` · Written ${wPts}/${wMax}` : ` · Written ${wScored.length}/${a.written.length} scored`)
        : '';
      h += `<div class="att">
        <div class="grow"><b>${esc(s?s.name:a.sessionId)}</b>
          <span class="muted"> · ${fmtDate(a.ts)}</span><br>
          <span>Multiple-choice: <b>${mcScore}/${mcTotal}</b>${wNote}</span>
        </div>
        <button class="btn small ghost" data-view="${a.id}">Review</button>
        <button class="btn small ghost" data-del="${a.id}">Delete</button>
      </div>`;
    }
  }
  h += `</div>`;

  app().innerHTML = h;

  app().querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>renderSession(b.dataset.start));
  app().querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>renderResults(b.dataset.view));
  app().querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    if(!confirm('Delete this attempt?')) return;
    saveAttempts(loadAttempts().filter(a=>String(a.id)!==b.dataset.del));
    renderLanding();
  });
}

/* ============================== session ============================== */
let cur = null; // {sessionId, answers:{qid: idx|string}, confirm:false}

function renderSession(sessionId){
  const s = sessionById(sessionId);
  if(!s) return;
  cur = {sessionId, answers:{}, confirm:false};
  drawSession();
  window.scrollTo(0,0);
}

function drawSession(){
  const s = sessionById(cur.sessionId);
  const qs = s.questions || [];
  let h = `<button class="backlink" id="backBtn">← Back to start</button>`;
  h += `<div class="card"><h2>${esc(s.name)}</h2>
    <p class="muted">${mcQuestions(s).length} multiple-choice${writtenQuestions(s).length?` · ${writtenQuestions(s).length} written`:''} · Answer every question, then press Submit.</p></div>`;

  for(const p of (s.passages||[])){
    h += `<div class="passage"><div class="ptitle">${esc(p.title)}</div>
      ${p.byline?`<div class="pby">${esc(p.byline)}</div>`:''}
      ${(p.paragraphs||[]).map(t=>`<p>${esc(t)}</p>`).join('')}</div>`;
    for(const q of qs.filter(q=>q.passage===p.id)) h += questionHTML(q, false, null);
  }
  const orphans = qs.filter(q=>!(s.passages||[]).some(p=>p.id===q.passage));
  for(const q of orphans) h += questionHTML(q, false, null);

  if(cur.confirm){
    h += `<div class="confirm" id="confirmBox"><b>Submit ${esc(s.name)}?</b><br>
      <span class="muted">Once submitted, multiple-choice answers are checked and the attempt is saved.</span><br><br>
      <button class="btn" id="yesSubmit">Yes, submit</button>
      <button class="btn ghost" id="keepWorking">Keep working</button></div>`;
  }

  app().innerHTML = h;
  $('#backBtn').onclick = ()=>{ if(confirm('Leave without submitting? Your answers will be lost.')) renderLanding(); };
  wireQuestions();
  const yb = $('#yesSubmit'); if(yb) yb.onclick = doSubmit;
  const kw = $('#keepWorking'); if(kw) kw.onclick = ()=>{cur.confirm=false; drawSession();};
  drawFootbar();
}

function stemHTML(stem){
  return String(stem==null?'':stem).split('\n').map(line=>{
    const t = line.trim();
    if(t.startsWith('>')) return `<span class="qtext">${esc(t.replace(/^>\s?/,''))}</span>`;
    return esc(line);
  }).join('<br>');
}

function questionHTML(q, review, attempt){
  const letters = ['A','B','C','D','E','F'];
  let h = `<div class="q" id="q-${esc(q.id)}">`;
  h += `<div class="qnum">Question ${q.n}${q.kind!=='mc'?` <span class="credit-tag">(${q.credits||'?'} credits — written)</span>`:''}</div>`;
  h += `<div class="stem">${stemHTML(q.stem)}</div>`;
  if(q.kind==='mc'){
    const att = review ? attempt.mc.find(m=>m.qid===q.id) : null;
    const yours = review ? att.yours : cur.answers[q.id];
    h += `<div class="choices">`;
    (q.choices||[]).forEach((c,i)=>{
      let cls = 'choice';
      if(review){
        if(i===q.answer) cls += ' correct';
        else if(i===yours) cls += ' wrongpick';
        if(i===yours) cls += ' sel';
      }else if(cur.answers[q.id]===i){ cls += ' sel'; }
      h += `<button class="${cls}" data-q="${esc(q.id)}" data-i="${i}"${review?' disabled':''}>
        <span class="letter">${letters[i]||''}</span><span>${esc(c)}</span></button>`;
    });
    h += `</div>`;
    if(review){
      if(q.answer==null) h += `<p><span class="pill warn">Answer key not available — check the scoring materials</span></p>`;
      else if(att.ok) h += `<p><span class="pill ok">Correct</span></p>`;
      else h += `<p><span class="pill bad">Your answer: ${letters[yours]||'—'} · Correct answer: ${letters[q.answer]}</span></p>`;
    }
  }else{
    if(review){
      const w = attempt.written.find(x=>x.qid===q.id);
      h += `<div class="wrans">${esc(w&&w.yours?w.yours:'(no answer written)')}</div>`;
    }else{
      const v = cur.answers[q.id]||'';
      h += `<textarea class="wr" data-wq="${esc(q.id)}" placeholder="Write your answer in complete sentences. Use details from the text.">${esc(v)}</textarea>`;
    }
  }
  h += `</div>`;
  return h;
}

function wireQuestions(){
  app().querySelectorAll('.choice[data-q]').forEach(b=>{
    b.onclick = ()=>{
      const qid = b.dataset.q;
      cur.answers[qid] = +b.dataset.i;
      const box = b.closest('.q');
      box.querySelectorAll('.choice').forEach(c=>c.classList.remove('sel'));
      b.classList.add('sel');
      drawFootbar();
    };
  });
  app().querySelectorAll('textarea.wr').forEach(t=>{
    t.oninput = ()=>{ cur.answers[t.dataset.wq] = t.value; drawFootbar(); };
  });
}

function drawFootbar(){
  const s = sessionById(cur.sessionId);
  const mcs = mcQuestions(s);
  const answered = mcs.filter(q=>cur.answers[q.id]!=null).length;
  const wrs = writtenQuestions(s);
  const wDraft = wrs.filter(q=>(cur.answers[q.id]||'').trim()).length;
  const fb = footbar();
  fb.classList.remove('hidden');
  fb.innerHTML = `<span class="prog" id="progText">Answered ${answered} of ${mcs.length} multiple-choice${wrs.length?` · ${wDraft}/${wrs.length} written drafted`:''}</span>
    <span class="pill warn hidden" id="footWarn"></span>
    <span class="spacer"></span>
    <button class="btn" id="submitBtn" style="margin-left:auto">Submit answers</button>`;
  $('#submitBtn').onclick = ()=>{
    const un = mcs.filter(q=>cur.answers[q.id]==null);
    if(un.length){
      const f = document.getElementById('q-'+un[0].id);
      const w = $('#footWarn');
      w.textContent = `Question ${un[0].n} is not answered yet`;
      w.classList.remove('hidden');
      if(f){
        f.scrollIntoView({behavior:'smooth',block:'center'});
        f.style.outline = '3px solid #f59e0b';
        setTimeout(()=>{ f.style.outline=''; }, 2500);
      }
      return;
    }
    cur.confirm = true;
    drawSession();
    setTimeout(()=>{ const el=$('#confirmBox'); if(el) el.scrollIntoView({behavior:'smooth',block:'center'}); }, 60);
  };
}

function doSubmit(){
  const s = sessionById(cur.sessionId);
  const mc = mcQuestions(s).map(q=>{
    const yours = cur.answers[q.id];
    return {qid:q.id, n:q.n, yours: yours==null?null:yours,
            correct: q.answer==null?null:q.answer,
            ok: q.answer!=null && yours===q.answer,
            keyMissing: q.answer==null};
  });
  const written = writtenQuestions(s).map(q=>({
    qid:q.id, n:q.n, yours:(cur.answers[q.id]||'').trim(),
    score:null, max:q.credits||2
  }));
  const att = {id:Date.now(), ts:Date.now(), sessionId:s.id, mc, written};
  const all = loadAttempts(); all.push(att); saveAttempts(all);
  cur = null;
  renderResults(att.id);
  window.scrollTo(0,0);
}

/* ============================== results ============================== */
function getAttempt(id){ return loadAttempts().find(a=>String(a.id)===String(id)); }

function renderResults(attemptId){
  footbar().classList.add('hidden');
  const a = getAttempt(attemptId);
  if(!a){ renderLanding(); return; }
  const s = sessionById(a.sessionId);
  if(!s){ renderLanding(); return; }
  const mcScore = a.mc.filter(m=>m.ok).length;
  const mcTotal = a.mc.length;
  const keyMissing = a.mc.filter(m=>m.keyMissing).length;
  const wScored = a.written.filter(w=>w.score!=null);
  const wPts = wScored.reduce((t,w)=>t+(+w.score||0),0);
  const wMax = a.written.reduce((t,w)=>t+(+w.max||0),0);
  const wDone = a.written.length && wScored.length===a.written.length;

  let h = `<button class="backlink" id="backBtn2">← Back to results</button>`;
  h += `<div class="card"><h2>${esc(s.name)} — Results</h2>
    <p class="muted">${fmtDate(a.ts)}</p>
    <div class="score-big">${mcScore + wPts}<span class="muted" style="font-size:18px"> / ${mcTotal + wMax}</span></div>
    <p>Multiple-choice: <b>${mcScore}/${mcTotal}</b>${keyMissing?` <span class="pill warn">${keyMissing} key missing</span>`:''}<br>
    ${a.written.length ? `Written: <b>${wDone ? wPts+'/'+wMax : wScored.length+'/'+a.written.length+' scored'}</b>` : 'No written questions in this session.'}</p>
    <button class="btn small" id="copyBtn">Copy results for analysis</button>
    <p class="muted" style="font-size:13px">Copies a text summary you can paste in chat — Lux will analyze Alex's current level from it.</p>
    <pre class="copybox hidden" id="copyBox"></pre>
  </div>`;

  h += `<div class="card"><h2>Multiple-choice review</h2>`;
  for(const q of mcQuestions(s)) h += questionHTML(q, true, a);
  h += `</div>`;

  if(a.written.length){
    h += `<div class="card"><h2>Written answers — parent scoring</h2>
      <p class="muted">Read Alex's answer, check the official rubric and the exemplary response,
      then tap the score. Scores save automatically and update the total above.</p>
      <p class="muted" style="font-size:13px"><b>How the 2-credit scoring works</b> (from the state's official guide papers):
      <b>2</b> = a valid inference or claim supported by <b>two</b> text details ·
      <b>1</b> = text details without a clear claim, or a claim with only one detail ·
      <b>0</b> = off-prompt or no valid text support.</p>`;
    for(const q of writtenQuestions(s)){
      const w = a.written.find(x=>x.qid===q.id);
      h += `<div class="q"><div class="qnum">Question ${q.n} <span class="credit-tag">(${w.max} credits)</span></div>
        <div class="stem">${stemHTML(q.stem)}</div>
        <h3>Alex's answer</h3><div class="wrans">${esc(w.yours||'(no answer written)')}</div>
        <details class="rubric"><summary>Official rubric (${w.max} credits)</summary>
          <p>${esc(q.rubric||'Rubric was not available in the transcript.').replace(/\n/g,'<br>')}</p></details>
        <details class="rubric"><summary>Exemplary response</summary>
          <p>${esc(q.exemplar||'Not available.').replace(/\n/g,'<br>')}</p></details>
        ${q.details?`<details class="rubric"><summary>Possible details to include</summary>
          <p>${esc(q.details).replace(/\n/g,'<br>')}</p></details>`:''}
        <h3>Score</h3><div class="scorebtns" data-wscore="${esc(q.id)}">`;
      for(let i=0;i<=w.max;i++) h += `<button data-v="${i}" class="${w.score===i?'sel':''}">${i}</button>`;
      h += `</div></div>`;
    }
    h += `</div>`;
  }

  app().innerHTML = h;
  $('#backBtn2').onclick = renderLanding;

  app().querySelectorAll('[data-wscore]').forEach(box=>{
    box.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      const qid = box.dataset.wscore;
      const all = loadAttempts();
      const att = all.find(x=>String(x.id)===String(attemptId));
      if(!att) return;
      const w = att.written.find(x=>x.qid===qid);
      w.score = +b.dataset.v;
      saveAttempts(all);
      renderResults(attemptId);
    });
  });

  $('#copyBtn').onclick = ()=>{
    const txt = buildCopyText(a, s);
    const box = $('#copyBox');
    box.textContent = txt;
    box.classList.remove('hidden');
    const done = ok => {
      $('#copyBtn').textContent = ok ? 'Copied! Paste it in chat for analysis.' : 'Select the text below and copy it manually.';
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(()=>done(true), ()=>done(false));
    }else{ done(false); }
    box.scrollIntoView({behavior:'smooth',block:'center'});
  };
}

function buildCopyText(a, s){
  const L = ['A','B','C','D','E','F'];
  const mcScore = a.mc.filter(m=>m.ok).length;
  const lines = [];
  lines.push(`${DATA.testTitle||'2026 NYS Grade 3 ELA practice'} — ${s.name}`);
  lines.push(`Date: ${fmtDate(a.ts)}`);
  lines.push(`Multiple-choice: ${mcScore}/${a.mc.length}`);
  for(const m of a.mc){
    const mark = m.keyMissing ? '?' : (m.ok ? 'OK' : 'X');
    lines.push(`  Q${m.n}: ${mark} (yours: ${m.yours==null?'-':L[m.yours]}${m.correct==null?'':' | key: '+L[m.correct]})`);
  }
  for(const w of a.written){
    lines.push(`  Q${w.n} (written, ${w.max} credits): ${w.score==null?'not scored yet':w.score+'/'+w.max}`);
    if(w.yours) lines.push(`    Alex wrote: ${w.yours.length>300 ? w.yours.slice(0,300)+'…' : w.yours}`);
  }
  const wScored = a.written.filter(w=>w.score!=null);
  const total = mcScore + wScored.reduce((t,w)=>t+(+w.score||0),0);
  const totalMax = a.mc.length + a.written.reduce((t,w)=>t+(+w.max||0),0);
  lines.push(`TOTAL: ${total}/${totalMax}${wScored.length<a.written.length?' (written partly unscored)':''}`);
  return lines.join('\n');
}

/* ============================== boot ============================== */
(function boot(){
  if(!DATA.sessions || !DATA.sessions.length){
    footbar().classList.add('hidden');
    app().innerHTML = `<div class="card"><h2>Quiz data is being prepared</h2>
      <p class="muted">If you see this on the published page, the question data did not load. Please tell Lux.</p></div>`;
    return;
  }
  renderLanding();
})();
</script>
