<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lesson 10 Quiz | Word Roots Beginning</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         margin: 0; background: #f6f9f4; color: #1e293b; line-height: 1.6; }
  header { background: linear-gradient(135deg, #15803d, #4ade80); color: #fff;
         padding: 30px 20px; text-align: center; }
  header h1 { margin: 6px 0 4px; font-size: 1.8rem; }
  header p { margin: 0; opacity: .92; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 24px 22px 60px; }
  .hud { background: #fff; border: 1px solid #bbf7d0; border-radius: 14px; padding: 12px 18px;
         margin: -24px auto 20px; max-width: 1000px; display: flex; justify-content: space-between;
         align-items: center; box-shadow: 0 4px 14px rgba(22,163,74,.10); font-weight: 700; flex-wrap: wrap; gap: 8px; }
  .hud .links { display: flex; gap: 8px; }
  .dots { display: flex; flex-wrap: wrap; gap: 5px; margin: 0 0 20px; }
  .dot { width: 22px; height: 22px; border-radius: 50%; background: #e2e8f0; font-size: .7rem;
         display: flex; align-items: center; justify-content: center; color: #94a3b8; font-weight: 700; }
  .dot.right { background: #16a34a; color: #fff; }
  .dot.wrong { background: #ef4444; color: #fff; }
  .dot.now { outline: 3px solid #86efac; }
  .qcard { background: #fff; border: 1px solid #e2e8f0; border-radius: 18px; padding: 26px;
         box-shadow: 0 2px 10px rgba(30,41,59,.06); }
  .qcard .qn { font-size: .85rem; color: #94a3b8; font-weight: 700; text-transform: uppercase;
         letter-spacing: .05em; }
  .qcard h2 { margin: 6px 0 18px; font-size: 1.3rem; }
  .opt { display: block; width: 100%; text-align: left; border: 2px solid #e2e8f0; background: #fff;
         border-radius: 12px; padding: 13px 16px; margin: 0 0 10px; font-size: 1rem; font-weight: 600;
         cursor: pointer; transition: all .15s; }
  .opt:hover:not(:disabled) { border-color: #86efac; background: #f0fdf4; }
  .opt.right { border-color: #16a34a; background: #dcfce7; color: #14532d; }
  .opt.wrong { border-color: #ef4444; background: #fef2f2; color: #991b1b; }
  .opt:disabled { cursor: default; }
  .why { display: none; margin-top: 14px; background: #f0fdf4; border-left: 5px solid #16a34a;
         border-radius: 0 12px 12px 0; padding: 12px 16px; font-size: .94rem; }
  .why.show { display: block; }
  .why b { color: #166534; }
  .navrow { display: flex; justify-content: space-between; margin-top: 20px; }
  .bigbtn { background: #16a34a; color: #fff; border: none; border-radius: 12px; padding: 12px 28px;
         font-size: 1rem; font-weight: 800; cursor: pointer; }
  .bigbtn:hover { background: #15803d; }
  .bigbtn:disabled { background: #cbd5e1; cursor: default; }
  .ghostbtn { background: #fff; color: #475569; border: 2px solid #cbd5e1; border-radius: 12px;
         padding: 10px 22px; font-size: .95rem; font-weight: 700; cursor: pointer; text-decoration: none; }
  .final { text-align: center; background: #fff; border-radius: 18px; padding: 36px 24px;
         border: 1px solid #e2e8f0; }
  .final .score { font-size: 3.4rem; font-weight: 900; color: #16a34a; margin: 8px 0; }
  .hidden { display: none; }
  footer { text-align: center; color: #94a3b8; font-size: .82rem; margin-top: 24px; }
  footer a { color: #16a34a; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<header>
  <div style="font-size:2.2rem">🎯</div>
  <h1>Lesson 10 Quiz</h1>
  <p>Guess each meaning from the word parts &middot; 20 questions</p>
</header>

<div class="wrap">
  <div class="hud">
    <span>Score: <span id="score">0</span> / 20</span>
    <span>Best: <span id="best">–</span></span>
    <span class="links">
      <a href="index.html" class="ghostbtn" style="padding:6px 14px;font-size:.82rem">← Lesson</a>
      <a href="../index.html" class="ghostbtn" style="padding:6px 14px;font-size:.82rem">🏠 Home</a>
    </span>
  </div>
  <div class="dots" id="dots"></div>

  <div class="qcard" id="qcard">
    <div class="qn" id="qn"></div>
    <h2 id="qq"></h2>
    <div id="opts"></div>
    <div class="why" id="why"></div>
    <div class="navrow">
      <span></span>
      <button class="bigbtn" id="nextBtn" disabled>Next →</button>
    </div>
  </div>

  <div class="final hidden" id="final">
    <div style="font-size:3rem" id="femoji">🌟</div>
    <h2 style="margin:6px 0">Quiz finished!</h2>
    <div class="score"><span id="fscore">0</span> / 20</div>
    <p id="fmsg" style="color:#64748b"></p>
    <p style="color:#94a3b8;font-size:.9rem">Best score: <b id="fbest">–</b></p>
    <button class="bigbtn" onclick="restart()">Try Again (shuffled)</button>
    <a href="index.html" class="ghostbtn" style="margin-left:8px">Back to Lesson 10</a>
  </div>

  <footer>Based on <i>Word Roots Beginning</i> &copy; 2012 The Critical Thinking Co. &middot; Made for Alex 🌱<br/><a href="../index.html">🏠 Word Roots Home</a></footer>
</div>

<script>

const QS = [{"q": "His ___ in math rose from a C to an A.", "o": ["grade", "desk", "book", "teacher"], "a": 0, "why": "<b>grad</b> means <i>step</i>. A <b>grade</b> marks which <i>step</i> you're on — his math step rose from C to A."}, {"q": "The oven must reach 350 ___ before we bake the bread.", "o": ["degree", "minutes", "inches", "pounds"], "a": 0, "why": "<b>grad</b> means <i>step</i>. A <b>degree</b> is one <i>step</i> on a scale — the oven climbs 350 steps of heat."}, {"q": "We got an ___ to bigger seats on the plane.", "o": ["upgrade", "invitation", "ticket", "map"], "a": 0, "why": "<b>up</b> + <b>grad</b> (<i>step</i>) = a <i>step up</i>. An <b>upgrade</b> moves you a step up — to bigger seats."}, {"q": "The builders made good ___ on the new school.", "o": ["progress", "noise", "mess", "shadows"], "a": 0, "why": "<b>pro-</b> means <i>forward</i> and <b>gress</b> means <i>step</i>. <b>Progress</b> is <i>stepping forward</i> — the builders advanced on the school."}, {"q": "The hotel lost a star, a ___ from five stars to four.", "o": ["downgrade", "jump", "climb", "gift"], "a": 0, "why": "<b>down</b> + <b>grad</b> (<i>step</i>) = a <i>step down</i>. A <b>downgrade</b> moves a step down — from five stars to four."}, {"q": "___ meets in Washington, D.C. to make laws.", "o": ["congress", "circus", "orchestra", "team"], "a": 0, "why": "<b>con-</b> means <i>together</i> and <b>gress</b> means <i>step</i>. <b>Congress</b> is the assembly that <i>steps together</i> to make laws in Washington, D.C."}, {"q": "Litter will ___ the beauty of the park.", "o": ["degrade", "improve", "protect", "praise"], "a": 0, "why": "<b>de-</b> means <i>down</i> and <b>grad</b> means <i>step</i>. To <b>degrade</b> is to take a <i>step down</i> in quality — litter lowers the park's beauty."}, {"q": "The ___ dog barked and stepped toward the mail carrier.", "o": ["aggressive", "sleepy", "friendly", "shy"], "a": 0, "why": "<b>ag-</b> means <i>toward</i> and <b>gress</b> means <i>step</i>. <b>Aggressive</b> means tending to <i>step toward</i> others to attack — the dog stepped toward the mail carrier barking."}, {"q": "The ___ mayor wants to build bike lanes and plant more trees.", "o": ["progressive", "lazy", "grumpy", "sleepy"], "a": 0, "why": "<b>pro-</b> means <i>forward</i>. <b>Progressive</b> means tending to <i>step forward</i> — the mayor moves the city forward with new ideas."}, {"q": "The sunset's colors changed in smooth ___ from pink to purple.", "o": ["gradation", "jumps", "stops", "breaks"], "a": 0, "why": "<b>grad</b> means <i>step</i>. <b>Gradation</b> is change by small <i>steps</i> — the colors move step by step from pink to purple."}, {"q": "The new law needs ___ approval before the president signs it.", "o": ["congressional", "royal", "magic", "parental"], "a": 0, "why": "<b>Congressional</b> means relating to <b>Congress</b> — the body that <i>steps together</i> (<b>con-</b> + <b>gress</b>) to make laws. The law needs Congress's approval."}, {"q": "Mars sometimes looks like it is moving ___, stepping backward across the sky.", "o": ["retrograde", "forward", "faster", "higher"], "a": 0, "why": "<b>retro-</b> means <i>backward</i> and <b>grad</b> means <i>step</i>. <b>Retrograde</b> motion is <i>stepping backward</i> — Mars seems to step back across the sky."}, {"q": "When the baby brother arrived, the toddler began to ___ and ask for a bottle again.", "o": ["regress", "grow", "improve", "shine"], "a": 0, "why": "<b>re-</b> means <i>back</i> and <b>gress</b> means <i>step</i>. To <b>regress</b> is to <i>step back</i> — the toddler stepped back to baby behavior."}, {"q": "The teacher will ___ from the lesson to tell a funny story.", "o": ["digress", "rush", "hide", "escape"], "a": 0, "why": "<b>di-</b> means <i>aside</i> and <b>gress</b> means <i>step</i>. To <b>digress</b> is to <i>step aside</i> from the path — the teacher steps off the lesson to tell a story."}, {"q": "The knight was punished because he ___ the king's law.", "o": ["transgress", "obeyed", "praised", "painted"], "a": 0, "why": "<b>trans-</b> means <i>across</i> and <b>gress</b> means <i>step</i>. To <b>transgress</b> is to <i>step across</i> the line — he broke the king's law."}, {"q": "The theater has an emergency ___ at the back of the building.", "o": ["egress", "kitchen", "office", "stage"], "a": 0, "why": "<b>e-</b> means <i>out</i> and <b>gress</b> means <i>step</i>. An <b>egress</b> is a <i>stepping out</i> — the back exit you use in an emergency."}, {"q": "The ___ of the story moves from a small problem to a huge battle.", "o": ["progression", "ending", "title", "cover"], "a": 0, "why": "<b>pro-</b> means <i>forward</i>. <b>Progression</b> is a series of forward <i>steps</i> — the story steps forward from small problem to huge battle."}, {"q": "Water freezes at zero degrees ___ on the hundred-step scale.", "o": ["centigrade", "fahrenheit", "kelvin", "tall"], "a": 0, "why": "<b>centi-</b> means <i>hundred</i> and <b>grad</b> means <i>step</i>. <b>Centigrade</b> is the hundred-<i>step</i> scale — water freezes at its zero step."}, {"q": "The crew will ___ the bumpy road to make it level.", "o": ["regrade", "paint", "widen", "close"], "a": 0, "why": "<b>re-</b> means <i>again</i>. To <b>regrade</b> is to <i>grade</i> (level in <i>steps</i>) <i>again</i> — the crew levels the bumpy road."}, {"q": "My sister is an ___ studying biology in college.", "o": ["undergraduate", "professor", "janitor", "coach"], "a": 0, "why": "An <b>undergraduate</b> is <i>under</i> (not yet finished with) the <i>steps</i> (<b>grad</b>) of a degree — your sister is still climbing those steps in college."}];
const KEY = "wr10-quiz-best";
const ROOTW = "grad";
const EMOJI = "\ud83e\ude9c";
let order, idx, score, answered;
function best(){ try{ return JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){ return null; } }

function shuffle(a){
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function renderDots(){
  const d = document.getElementById("dots"); d.innerHTML = "";
  order.forEach((q,i)=>{
    const s = document.createElement("div"); s.className = "dot"; s.textContent = i+1;
    if(i < answered.length) s.classList.add(answered[i] ? "right" : "wrong");
    if(i === idx) s.classList.add("now");
    d.appendChild(s);
  });
}
function render(){
  renderDots();
  const q = QS[order[idx]];
  document.getElementById("qn").textContent = "Question " + (idx+1) + " of 20";
  document.getElementById("qq").textContent = q.q;
  const opts = document.getElementById("opts"); opts.innerHTML = "";
  const why = document.getElementById("why"); why.classList.remove("show"); why.innerHTML = "";
  const next = document.getElementById("nextBtn"); next.disabled = true;
  next.textContent = (idx === order.length-1) ? "See my score \u2192" : "Next \u2192";
  const oidx = shuffle(q.o.map((_,i)=>i));
  oidx.forEach((oi)=>{
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = q.o[oi];
    b.onclick = ()=>{
      const ok = (oi === q.a);
      [...opts.children].forEach((x,k)=>{
        x.disabled = true;
        if(oidx[k] === q.a) x.classList.add("right");
      });
      if(!ok) b.classList.add("wrong"); else score++;
      answered.push(ok);
      document.getElementById("score").textContent = score;
      why.innerHTML = (ok ? "\u2705 Correct! " : "\u274C Not quite. ") + q.why;
      why.classList.add("show");
      next.disabled = false;
      renderDots();
    };
    opts.appendChild(b);
  });
}
document.getElementById("nextBtn").onclick = ()=>{
  if(idx < order.length-1){ idx++; render(); window.scrollTo({top:0,behavior:"smooth"}); }
  else finish();
};
function finish(){
  document.getElementById("qcard").classList.add("hidden");
  document.getElementById("dots").classList.add("hidden");
  const f = document.getElementById("final"); f.classList.remove("hidden");
  document.getElementById("fscore").textContent = score;
  const b = best();
  const nb = (b===null || score > b) ? score : b;
  localStorage.setItem(KEY, JSON.stringify(nb));
  document.getElementById("fbest").textContent = nb + " / 20";
  const msg = score===20 ? "Perfect! You are a true word-root master! \U0001F3C6"
    : score>=16 ? "Excellent! The "+ROOTW+" words are really sticking! "+EMOJI
    : score>=12 ? "Good job! Review the ones you missed and try again."
    : "Good start! Go back to the lesson, then try again \u2014 you've got this! \U0001F4AA";
  document.getElementById("fmsg").textContent = msg;
  document.getElementById("femoji").textContent = score===20 ? "\U0001F3C6" : score>=12 ? "\U0001F31F" : "\U0001F331";
  window.scrollTo({top:0,behavior:"smooth"});
}
function restart(){
  order = shuffle(QS.map((_,i)=>i));
  idx = 0; score = 0; answered = [];
  document.getElementById("score").textContent = "0";
  document.getElementById("final").classList.add("hidden");
  document.getElementById("qcard").classList.remove("hidden");
  document.getElementById("dots").classList.remove("hidden");
  render();
}
(function init(){
  const b = best();
  document.getElementById("best").textContent = b===null ? "\u2013" : b + " / 20";
  restart();
})();

</script>
</body>
</html>
