<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lesson 7 Quiz | Word Roots Beginning</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         margin: 0; background: #fbf8f3; color: #1e293b; line-height: 1.6; }
  header { background: linear-gradient(135deg, #c2410c, #fb923c); color: #fff;
         padding: 30px 20px; text-align: center; }
  header h1 { margin: 6px 0 4px; font-size: 1.8rem; }
  header p { margin: 0; opacity: .92; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 24px 22px 60px; }
  .hud { background: #fff; border: 1px solid #fed7aa; border-radius: 14px; padding: 12px 18px;
         margin: -24px auto 20px; max-width: 1000px; display: flex; justify-content: space-between;
         align-items: center; box-shadow: 0 4px 14px rgba(234,88,12,.10); font-weight: 700; }
  .dots { display: flex; flex-wrap: wrap; gap: 5px; margin: 0 0 20px; }
  .dot { width: 22px; height: 22px; border-radius: 50%; background: #e2e8f0; font-size: .7rem;
         display: flex; align-items: center; justify-content: center; color: #94a3b8; font-weight: 700; }
  .dot.right { background: #ea580c; color: #fff; }
  .dot.wrong { background: #ef4444; color: #fff; }
  .dot.now { outline: 3px solid #fdba74; }
  .qcard { background: #fff; border: 1px solid #e2e8f0; border-radius: 18px; padding: 26px;
         box-shadow: 0 2px 10px rgba(30,41,59,.06); }
  .qcard .qn { font-size: .85rem; color: #94a3b8; font-weight: 700; text-transform: uppercase;
         letter-spacing: .05em; }
  .qcard h2 { margin: 6px 0 18px; font-size: 1.3rem; }
  .opt { display: block; width: 100%; text-align: left; border: 2px solid #e2e8f0; background: #fff;
         border-radius: 12px; padding: 13px 16px; margin: 0 0 10px; font-size: 1rem; font-weight: 600;
         cursor: pointer; transition: all .15s; }
  .opt:hover:not(:disabled) { border-color: #fdba74; background: #fff7ed; }
  .opt.right { border-color: #16a34a; background: #dcfce7; color: #14532d; }
  .opt.wrong { border-color: #ef4444; background: #fef2f2; color: #991b1b; }
  .opt:disabled { cursor: default; }
  .why { display: none; margin-top: 14px; background: #fff7ed; border-left: 5px solid #ea580c;
         border-radius: 0 12px 12px 0; padding: 12px 16px; font-size: .94rem; }
  .why.show { display: block; }
  .why b { color: #9a3412; }
  .navrow { display: flex; justify-content: space-between; margin-top: 20px; }
  .bigbtn { background: #ea580c; color: #fff; border: none; border-radius: 12px; padding: 12px 28px;
         font-size: 1rem; font-weight: 800; cursor: pointer; }
  .bigbtn:hover { background: #c2410c; }
  .bigbtn:disabled { background: #cbd5e1; cursor: default; }
  .ghostbtn { background: #fff; color: #475569; border: 2px solid #cbd5e1; border-radius: 12px;
         padding: 10px 22px; font-size: .95rem; font-weight: 700; cursor: pointer; text-decoration: none; }
  .final { text-align: center; background: #fff; border-radius: 18px; padding: 36px 24px;
         border: 1px solid #e2e8f0; }
  .final .score { font-size: 3.4rem; font-weight: 900; color: #ea580c; margin: 8px 0; }
  .hidden { display: none; }
  footer { text-align: center; color: #94a3b8; font-size: .82rem; margin-top: 24px; }
</style>
</head>
<body>
<header>
  <div style="font-size:2.2rem">🎯</div>
  <h1>Lesson 7 Quiz</h1>
  <p>Use the prefixes + <i>pose</i> to figure out each meaning &middot; 20 questions</p>
</header>

<div class="wrap">
  <div class="hud">
    <span>Score: <span id="score">0</span> / 20</span>
    <span>Best: <span id="best">–</span></span>
    <a href="index.html" class="ghostbtn" style="padding:6px 14px;font-size:.82rem">← Lesson</a>
  </div>
  <div class="dots" id="dots"></div>

  <div class="qcard" id="qcard">
    <div class="qn" id="qn"></div>
    <h2 id="qq"></h2>
    <div id="opts"></div>
    <div class="why" id="why"></div>
    <div class="navrow">
      <span></span>
      <button class="bigbtn" id="nextBtn" disabled>Next →</button>
    </div>
  </div>

  <div class="final hidden" id="final">
    <div style="font-size:3rem" id="femoji">🌟</div>
    <h2 style="margin:6px 0">Quiz finished!</h2>
    <div class="score"><span id="fscore">0</span> / 20</div>
    <p id="fmsg" style="color:#64748b"></p>
    <p style="color:#94a3b8;font-size:.9rem">Best score: <b id="fbest">–</b></p>
    <button class="bigbtn" onclick="restart()">Try Again (shuffled)</button>
    <a href="index.html" class="ghostbtn" style="margin-left:8px">Back to Lesson 7</a>
    <a href="../lesson-8/" class="bigbtn" style="margin-left:8px;text-decoration:none">Next: Lesson 8 →</a>
  </div>

  <footer>Based on <i>Word Roots Beginning</i> &copy; 2012 The Critical Thinking Co. &middot; Made for Alex 🌱</footer>
</div>

<script>
const QS = [
 {q:"What does the prefix “com-” mean?",
  o:["with, together","out, from, away","to, toward, against","for, before, forward"], a:0,
  why:"<b>com-</b> = with, together — as in <b>com</b>+<b>pose</b> = <b>compose</b> (to put together)."},
 {q:"What does the prefix “dis-” mean?",
  o:["in, into; not","apart, opposite of","with, together","for, before, forward"], a:1,
  why:"<b>dis-</b> = apart, opposite of — as in <b>dis</b>+<b>pose</b> = <b>dispose</b> (to place apart)."},
 {q:"What does the prefix “ex-” mean?",
  o:["with, together","in, into; not","out, from, away","to, toward, against"], a:2,
  why:"<b>ex-</b> = out, from, away — as in <b>ex</b>+<b>pose</b> = <b>expose</b> (to put out in the open)."},
 {q:"What does the prefix “im-” mean in this lesson?",
  o:["to, toward, against","in, into; not","with, together","apart, opposite of"], a:1,
  why:"<b>im-</b> = in, into; not — as in <b>im</b>+<b>pose</b> = <b>impose</b> (to place a burden <i>on</i> someone)."},
 {q:"What does the prefix “op-” mean?",
  o:["for, before, forward","out, from, away","to, toward, against","in, into; not"], a:2,
  why:"<b>op-</b> = to, toward, against — as in <b>op</b>+<b>pose</b> = <b>oppose</b> (to place opposite of)."},
 {q:"What does the prefix “pro-” mean?",
  o:["out, from, away","with, together","for, before, forward","to, toward, against"], a:2,
  why:"<b>pro-</b> = for, before, forward — as in <b>pro</b>+<b>pose</b> = <b>propose</b> (to put forward)."},
 {q:"What does the root “pose” mean?",
  o:["to break, burst","to place, to put","to look at","to go, to step"], a:1,
  why:"<b>pose</b> = to place, to put — it is the root in all six lesson words."},
 {q:"“ex-” + “pose” = “expose”. What does “expose” mean?",
  o:["to place a burden on someone","to put together a song","to put out in the open; to reveal or make known","to go against a plan"], a:2,
  why:"<b>ex-</b> (out) + <b>pose</b> (to put) = to put <i>out</i> in the open; to reveal or make known."},
 {q:"“op-” + “pose” = “oppose”. What does “oppose” mean?",
  o:["to place opposite of; to go against","to put forward as an offer","to place apart; to throw away","to put out in the open"], a:0,
  why:"<b>op-</b> (against) + <b>pose</b> (to place) = to place opposite of; to go against."},
 {q:"“com-” + “pose” = “compose”. What does “compose” mean?",
  o:["to throw away something","to put forward an offer","to put together, as in creating a musical or literary work","to place a punishment on someone"], a:2,
  why:"<b>com-</b> (together) + <b>pose</b> (to put) = to put together — like a composer putting notes together."},
 {q:"“pro-” + “pose” = “propose”. What does “propose” mean?",
  o:["to put forward as an offer for consideration","to place a burden on someone","to put together a song","to go against a plan"], a:0,
  why:"<b>pro-</b> (forward) + <b>pose</b> (to put) = to put <i>forward</i> as an offer for consideration."},
 {q:"“dis-” + “pose” = “dispose”. What does “dispose” mean?",
  o:["to reveal a secret","to place apart; to throw away or get rid of something","to make a toast","to place a tax on goods"], a:1,
  why:"<b>dis-</b> (apart) + <b>pose</b> (to place) = to place apart; to throw away or get rid of something."},
 {q:"“im-” + “pose” = “impose”. What does “impose” mean?",
  o:["to place a burden on someone; to legally place a punishment, fine, etc., on someone","to put together a poem","to put out in the open","to go against a plan"], a:0,
  why:"<b>im-</b> (in, into) + <b>pose</b> (to place) = to place a burden <i>on</i> someone — like a tax or a fine."},
 {q:"Complete the sentence: “The government had to ___ a tax on all imported goods.”",
  o:["expose","impose","oppose","compose"], a:1,
  why:"The government <b>imposed</b> a tax — it placed a burden on imported goods."},
 {q:"Complete the sentence: “Their main concern was how to ___ of the toxic waste.”",
  o:["dispose","propose","expose","compose"], a:0,
  why:"They had to <b>dispose</b> of the waste — to throw it away, or place it apart safely."},
 {q:"Complete the sentence: “They didn't want to ___ their small boat to the dangers of the open sea.”",
  o:["oppose","compose","expose","impose"], a:2,
  why:"They didn't want to <b>expose</b> their boat — to put it out in the open sea's danger."},
 {q:"Complete the sentence: “The poet was hoping to ___ two new sonnets.”",
  o:["impose","dispose","propose","compose"], a:3,
  why:"The poet wanted to <b>compose</b> — to put together two new poems."},
 {q:"Complete the sentence: “The local residents were planning to ___ the closing of their hospital.”",
  o:["propose","oppose","compose","dispose"], a:1,
  why:"The residents planned to <b>oppose</b> the closing — to go against it."},
 {q:"Complete the sentence: “Everyone wanted to ___ a toast to the bride and groom.”",
  o:["impose","propose","expose","oppose"], a:1,
  why:"Everyone wanted to <b>propose</b> a toast — to put forward an offer of celebration. 🥂"},
 {q:"Which word parts build the word “dispose”?",
  o:["dis- + pose","ex- + pose","com- + pose","pro- + pose"], a:0,
  why:"<b>dis-</b> (apart) + <b>pose</b> (to place) = <b>dispose</b> — to place apart."}
];

const KEY = "wr7-quiz-best";
let order, idx, score, answered;
function best(){ try{ return JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){ return null; } }

function shuffle(a){
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function renderDots(){
  const d = document.getElementById("dots"); d.innerHTML = "";
  order.forEach((q,i)=>{
    const s = document.createElement("div"); s.className = "dot"; s.textContent = i+1;
    if(i < answered.length) s.classList.add(answered[i] ? "right" : "wrong");
    if(i === idx) s.classList.add("now");
    d.appendChild(s);
  });
}
function render(){
  renderDots();
  const q = QS[order[idx]];
  document.getElementById("qn").textContent = "Question " + (idx+1) + " of 20";
  document.getElementById("qq").textContent = q.q;
  const opts = document.getElementById("opts"); opts.innerHTML = "";
  const why = document.getElementById("why"); why.classList.remove("show"); why.innerHTML = "";
  const next = document.getElementById("nextBtn"); next.disabled = true;
  next.textContent = (idx === order.length-1) ? "See my score →" : "Next →";
  const oidx = shuffle(q.o.map((_,i)=>i));
  oidx.forEach((oi)=>{
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = q.o[oi];
    b.onclick = ()=>{
      const ok = (oi === q.a);
      [...opts.children].forEach((x,k)=>{
        x.disabled = true;
        if(oidx[k] === q.a) x.classList.add("right");
      });
      if(!ok) b.classList.add("wrong"); else score++;
      answered.push(ok);
      document.getElementById("score").textContent = score;
      why.innerHTML = (ok ? "✅ Correct! " : "❌ Not quite. ") + q.why;
      why.classList.add("show");
      next.disabled = false;
      renderDots();
    };
    opts.appendChild(b);
  });
}
document.getElementById("nextBtn").onclick = ()=>{
  if(idx < order.length-1){ idx++; render(); window.scrollTo({top:0,behavior:"smooth"}); }
  else finish();
};
function finish(){
  document.getElementById("qcard").classList.add("hidden");
  document.getElementById("dots").classList.add("hidden");
  const f = document.getElementById("final"); f.classList.remove("hidden");
  document.getElementById("fscore").textContent = score;
  const b = best();
  const nb = (b===null || score > b) ? score : b;
  localStorage.setItem(KEY, JSON.stringify(nb));
  document.getElementById("fbest").textContent = nb + " / 20";
  const msg = score===20 ? "Perfect! You are a true prefix master! 🏆"
    : score>=16 ? "Excellent! The prefixes are really sticking! 📦"
    : score>=12 ? "Good job! Review the ones you missed and try again."
    : "Good start! Go back to the lesson, then try again — you've got this! 💪";
  document.getElementById("fmsg").textContent = msg;
  document.getElementById("femoji").textContent = score===20 ? "🏆" : score>=12 ? "🌟" : "🌱";
  window.scrollTo({top:0,behavior:"smooth"});
}
function restart(){
  order = shuffle(QS.map((_,i)=>i));
  idx = 0; score = 0; answered = [];
  document.getElementById("score").textContent = "0";
  document.getElementById("final").classList.add("hidden");
  document.getElementById("qcard").classList.remove("hidden");
  document.getElementById("dots").classList.remove("hidden");
  render();
}
(function init(){
  const b = best();
  document.getElementById("best").textContent = b===null ? "–" : b + " / 20";
  restart();
})();
</script>
</body>
</html>
