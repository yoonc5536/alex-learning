<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lesson 18 Quiz | Word Roots Beginning</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         margin: 0; background: #f6f9f4; color: #1e293b; line-height: 1.6; }
  header { background: linear-gradient(135deg, #15803d, #4ade80); color: #fff;
         padding: 30px 20px; text-align: center; }
  header h1 { margin: 6px 0 4px; font-size: 1.8rem; }
  header p { margin: 0; opacity: .92; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 24px 22px 60px; }
  .hud { background: #fff; border: 1px solid #bbf7d0; border-radius: 14px; padding: 12px 18px;
         margin: -24px auto 20px; max-width: 1000px; display: flex; justify-content: space-between;
         align-items: center; box-shadow: 0 4px 14px rgba(22,163,74,.10); font-weight: 700; flex-wrap: wrap; gap: 8px; }
  .hud .links { display: flex; gap: 8px; }
  .dots { display: flex; flex-wrap: wrap; gap: 5px; margin: 0 0 20px; }
  .dot { width: 22px; height: 22px; border-radius: 50%; background: #e2e8f0; font-size: .7rem;
         display: flex; align-items: center; justify-content: center; color: #94a3b8; font-weight: 700; }
  .dot.right { background: #16a34a; color: #fff; }
  .dot.wrong { background: #ef4444; color: #fff; }
  .dot.now { outline: 3px solid #86efac; }
  .qcard { background: #fff; border: 1px solid #e2e8f0; border-radius: 18px; padding: 26px;
         box-shadow: 0 2px 10px rgba(30,41,59,.06); }
  .qcard .qn { font-size: .85rem; color: #94a3b8; font-weight: 700; text-transform: uppercase;
         letter-spacing: .05em; }
  .qcard h2 { margin: 6px 0 18px; font-size: 1.3rem; }
  .opt { display: block; width: 100%; text-align: left; border: 2px solid #e2e8f0; background: #fff;
         border-radius: 12px; padding: 13px 16px; margin: 0 0 10px; font-size: 1rem; font-weight: 600;
         cursor: pointer; transition: all .15s; }
  .opt:hover:not(:disabled) { border-color: #86efac; background: #f0fdf4; }
  .opt.right { border-color: #16a34a; background: #dcfce7; color: #14532d; }
  .opt.wrong { border-color: #ef4444; background: #fef2f2; color: #991b1b; }
  .opt:disabled { cursor: default; }
  .why { display: none; margin-top: 14px; background: #f0fdf4; border-left: 5px solid #16a34a;
         border-radius: 0 12px 12px 0; padding: 12px 16px; font-size: .94rem; }
  .why.show { display: block; }
  .why b { color: #166534; }
  .navrow { display: flex; justify-content: space-between; margin-top: 20px; }
  .bigbtn { background: #16a34a; color: #fff; border: none; border-radius: 12px; padding: 12px 28px;
         font-size: 1rem; font-weight: 800; cursor: pointer; }
  .bigbtn:hover { background: #15803d; }
  .bigbtn:disabled { background: #cbd5e1; cursor: default; }
  .ghostbtn { background: #fff; color: #475569; border: 2px solid #cbd5e1; border-radius: 12px;
         padding: 10px 22px; font-size: .95rem; font-weight: 700; cursor: pointer; text-decoration: none; }
  .final { text-align: center; background: #fff; border-radius: 18px; padding: 36px 24px;
         border: 1px solid #e2e8f0; }
  .final .score { font-size: 3.4rem; font-weight: 900; color: #16a34a; margin: 8px 0; }
  .hidden { display: none; }
  footer { text-align: center; color: #94a3b8; font-size: .82rem; margin-top: 24px; }
  footer a { color: #16a34a; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<header>
  <div style="font-size:2.2rem">🎯</div>
  <h1>Lesson 18 Quiz</h1>
  <p>Guess each meaning from the word parts &middot; 20 questions</p>
</header>

<div class="wrap">
  <div class="hud">
    <span>Score: <span id="score">0</span> / 20</span>
    <span>Best: <span id="best">–</span></span>
    <span class="links">
      <a href="index.html" class="ghostbtn" style="padding:6px 14px;font-size:.82rem">← Lesson</a>
      <a href="../index.html" class="ghostbtn" style="padding:6px 14px;font-size:.82rem">🏠 Home</a>
    </span>
  </div>
  <div class="dots" id="dots"></div>

  <div class="qcard" id="qcard">
    <div class="qn" id="qn"></div>
    <h2 id="qq"></h2>
    <div id="opts"></div>
    <div class="why" id="why"></div>
    <div class="navrow">
      <span></span>
      <button class="bigbtn" id="nextBtn" disabled>Next →</button>
    </div>
  </div>

  <div class="final hidden" id="final">
    <div style="font-size:3rem" id="femoji">🌟</div>
    <h2 style="margin:6px 0">Quiz finished!</h2>
    <div class="score"><span id="fscore">0</span> / 20</div>
    <p id="fmsg" style="color:#64748b"></p>
    <p style="color:#94a3b8;font-size:.9rem">Best score: <b id="fbest">–</b></p>
    <button class="bigbtn" onclick="restart()">Try Again (shuffled)</button>
    <a href="index.html" class="ghostbtn" style="margin-left:8px">Back to Lesson 18</a>
  </div>

  <footer>Based on <i>Word Roots Beginning</i> &copy; 2012 The Critical Thinking Co. &middot; Made for Alex 🌱<br/><a href="../index.html">🏠 Word Roots Home</a></footer>
</div>

<script>

const QS = [{"q": "Dogs have a strong ___ of smell that helps them find things.", "o": ["sense", "nonsense", "consensus", "assent"], "a": 0, "why": "<b>sens</b> means <i>to feel, to perceive</i>. A <b>sense</b> of smell is the power to perceive odors."}, {"q": "'The moon is made of cheese' is pure ___.", "o": ["nonsense", "sense", "consensus", "assent"], "a": 0, "why": "<b>non-</b> means <i>not</i>. <b>Nonsense</b> is <i>not</i> sense — words you cannot feel or perceive any meaning in."}, {"q": "After much talk, the class reached a ___ that Friday is the best day for the party.", "o": ["consensus", "nonsense", "assent", "resentment"], "a": 0, "why": "<b>con-</b> means <i>together</i>. <b>Consensus</b> is feeling (<b>sens</b>) <i>together</i> — everyone agreeing on Friday."}, {"q": "He began to ___ his brother for always getting the bigger piece of cake.", "o": ["resent", "assent", "desensitize", "sensitize"], "a": 0, "why": "<b>re-</b> means <i>back</i>. To <b>resent</b> is to feel (<b>sent</b>) bitterness <i>back</i> toward someone."}, {"q": "Her ___ grew each time she was left out of the game.", "o": ["resentment", "assent", "consensus", "delight"], "a": 0, "why": "It comes from <b>resent</b> + <b>-ment</b> (a state). <b>Resentment</b> is the state of feeling (<b>sent</b>) bitterness <i>back</i> (<b>re-</b>) at being left out."}, {"q": "The ___ player glared at the referee after the bad call.", "o": ["resentful", "thankful", "cheerful", "hopeful"], "a": 0, "why": "<b>-ful</b> means <i>full of</i>. A <b>resentful</b> player is full of bitter feeling (<b>re-</b> + <b>sent</b>) — the glare proves it."}, {"q": "The museum's ___ room lets kids touch, smell, and listen to everything.", "o": ["sensory", "senseless", "nonsensical", "sensational"], "a": 0, "why": "<b>-ory</b> means <i>relating to</i>. A <b>sensory</b> room relates to the senses — what you feel and perceive (<b>sens</b>)."}, {"q": "The ___ news about the lost treasure spread quickly through town.", "o": ["sensational", "senseless", "nonsensical", "boring"], "a": 0, "why": "It comes from <b>sens</b> (to feel) + <b>-ation</b> + <b>-al</b>. <b>Sensational</b> news causes such strong feeling that everyone talks about it."}, {"q": "It would be ___ to go swimming during a thunderstorm.", "o": ["senseless", "sensory", "nonsense", "wise"], "a": 0, "why": "<b>-less</b> means <i>without</i>. <b>Senseless</b> is <i>without</i> sense — swimming in a thunderstorm would be foolish."}, {"q": "The ___ rule said students must hop on one foot in the hallway.", "o": ["nonsensical", "sensory", "sensational", "reasonable"], "a": 0, "why": "It comes from <b>nonsense</b> + <b>-ical</b> (relating to). A <b>nonsensical</b> rule is one you cannot feel or perceive any sense in."}, {"q": "The art class will ___ our eyes to notice small details in paintings.", "o": ["sensitize", "desensitize", "resent", "assent"], "a": 0, "why": "<b>-ize</b> means <i>to make</i>. To <b>sensitize</b> is to make someone able to feel (<b>sens</b>) more — like noticing small details."}, {"q": "Watching too many scary movies can ___ kids to real danger.", "o": ["desensitize", "sensitize", "resent", "assent"], "a": 0, "why": "<b>de-</b> means <i>away</i>. To <b>desensitize</b> is to carry feeling <i>away</i> — making kids feel less when danger is real."}, {"q": "The principal asked if the class agreed, and every student nodded in ___.", "o": ["assent", "nonsense", "resentment", "anger"], "a": 0, "why": "<b>as-</b> means <i>to</i>. <b>Assent</b> is feeling (<b>sent</b>) <i>toward</i> an idea — saying yes, as the nods show."}, {"q": "The ___ smoke alarm goes off every time we make toast.", "o": ["oversensitive", "undersensitive", "senseless", "silent"], "a": 0, "why": "<b>over-</b> means <i>too much</i>. An <b>oversensitive</b> alarm feels (<b>sens</b>) <i>too much</i> — even toast sets it off."}, {"q": "My ___ ears can hear the clock ticking from the next room.", "o": ["hypersensitive", "senseless", "numb", "deaf"], "a": 0, "why": "<b>hyper-</b> means <i>over, beyond</i>. <b>Hypersensitive</b> ears feel (<b>sens</b>) far <i>beyond</i> normal."}, {"q": "In the story, the ___ robots could feel happiness and sadness.", "o": ["sentient", "senseless", "nonsensical", "unfeeling"], "a": 0, "why": "It comes from <b>sent</b> (to feel) + <b>-ient</b>. <b>Sentient</b> beings can feel — the robots feel happiness and sadness."}, {"q": "The ___ of the puppy to loud noises took several weeks of training.", "o": ["desensitization", "sensitization", "resentment", "excitement"], "a": 0, "why": "<b>-ation</b> marks a process. <b>Desensitization</b> is the process of carrying fearful feeling <i>away</i> (<b>de-</b> + <b>sens</b>) through training."}, {"q": "Some shows ___ the news to make everything sound shocking.", "o": ["sensationalize", "sensitize", "desensitize", "calm"], "a": 0, "why": "<b>-ize</b> means <i>to make</i>. To <b>sensationalize</b> is to make news cause strong feeling (<b>sens</b>) — making everything sound shocking."}, {"q": "Grandma's ___ made her cry happy tears at the old family photos.", "o": ["sentimentality", "resentment", "nonsense", "anger"], "a": 0, "why": "It comes from <b>sent</b> (to feel) with <b>-ality</b> (a state). <b>Sentimentality</b> is the state of tender feeling — the happy tears prove it."}, {"q": "She had a strange ___ that it would rain, so she packed an umbrella.", "o": ["presentiment", "resentment", "nonsense", "certainty"], "a": 0, "why": "<b>pre-</b> means <i>before</i>. A <b>presentiment</b> is a feeling (<b>sent</b> + <b>-ment</b>) that comes <i>before</i> the event — she felt the rain coming."}];
const KEY = "wr18-quiz-best";
const ROOTW = "sens, sent";
const EMOJI = "\ud83d\udcad";
let order, idx, score, answered;
function best(){ try{ return JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){ return null; } }

function shuffle(a){
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function renderDots(){
  const d = document.getElementById("dots"); d.innerHTML = "";
  order.forEach((q,i)=>{
    const s = document.createElement("div"); s.className = "dot"; s.textContent = i+1;
    if(i < answered.length) s.classList.add(answered[i] ? "right" : "wrong");
    if(i === idx) s.classList.add("now");
    d.appendChild(s);
  });
}
function render(){
  renderDots();
  const q = QS[order[idx]];
  document.getElementById("qn").textContent = "Question " + (idx+1) + " of 20";
  document.getElementById("qq").textContent = q.q;
  const opts = document.getElementById("opts"); opts.innerHTML = "";
  const why = document.getElementById("why"); why.classList.remove("show"); why.innerHTML = "";
  const next = document.getElementById("nextBtn"); next.disabled = true;
  next.textContent = (idx === order.length-1) ? "See my score \u2192" : "Next \u2192";
  const oidx = shuffle(q.o.map((_,i)=>i));
  oidx.forEach((oi)=>{
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = q.o[oi];
    b.onclick = ()=>{
      const ok = (oi === q.a);
      [...opts.children].forEach((x,k)=>{
        x.disabled = true;
        if(oidx[k] === q.a) x.classList.add("right");
      });
      if(!ok) b.classList.add("wrong"); else score++;
      answered.push(ok);
      document.getElementById("score").textContent = score;
      why.innerHTML = (ok ? "\u2705 Correct! " : "\u274C Not quite. ") + q.why;
      why.classList.add("show");
      next.disabled = false;
      renderDots();
    };
    opts.appendChild(b);
  });
}
document.getElementById("nextBtn").onclick = ()=>{
  if(idx < order.length-1){ idx++; render(); window.scrollTo({top:0,behavior:"smooth"}); }
  else finish();
};
function finish(){
  document.getElementById("qcard").classList.add("hidden");
  document.getElementById("dots").classList.add("hidden");
  const f = document.getElementById("final"); f.classList.remove("hidden");
  document.getElementById("fscore").textContent = score;
  const b = best();
  const nb = (b===null || score > b) ? score : b;
  localStorage.setItem(KEY, JSON.stringify(nb));
  document.getElementById("fbest").textContent = nb + " / 20";
  const msg = score===20 ? "Perfect! You are a true word-root master! \U0001F3C6"
    : score>=16 ? "Excellent! The "+ROOTW+" words are really sticking! "+EMOJI
    : score>=12 ? "Good job! Review the ones you missed and try again."
    : "Good start! Go back to the lesson, then try again \u2014 you've got this! \U0001F4AA";
  document.getElementById("fmsg").textContent = msg;
  document.getElementById("femoji").textContent = score===20 ? "\U0001F3C6" : score>=12 ? "\U0001F31F" : "\U0001F331";
  window.scrollTo({top:0,behavior:"smooth"});
}
function restart(){
  order = shuffle(QS.map((_,i)=>i));
  idx = 0; score = 0; answered = [];
  document.getElementById("score").textContent = "0";
  document.getElementById("final").classList.add("hidden");
  document.getElementById("qcard").classList.remove("hidden");
  document.getElementById("dots").classList.remove("hidden");
  render();
}
(function init(){
  const b = best();
  document.getElementById("best").textContent = b===null ? "\u2013" : b + " / 20";
  restart();
})();

</script>
</body>
</html>
