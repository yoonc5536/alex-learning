<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lesson 9 Quiz | Word Roots Beginning</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         margin: 0; background: #f6f9f4; color: #1e293b; line-height: 1.6; }
  header { background: linear-gradient(135deg, #15803d, #4ade80); color: #fff;
         padding: 30px 20px; text-align: center; }
  header h1 { margin: 6px 0 4px; font-size: 1.8rem; }
  header p { margin: 0; opacity: .92; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 24px 22px 60px; }
  .hud { background: #fff; border: 1px solid #bbf7d0; border-radius: 14px; padding: 12px 18px;
         margin: -24px auto 20px; max-width: 1000px; display: flex; justify-content: space-between;
         align-items: center; box-shadow: 0 4px 14px rgba(22,163,74,.10); font-weight: 700; flex-wrap: wrap; gap: 8px; }
  .hud .links { display: flex; gap: 8px; }
  .dots { display: flex; flex-wrap: wrap; gap: 5px; margin: 0 0 20px; }
  .dot { width: 22px; height: 22px; border-radius: 50%; background: #e2e8f0; font-size: .7rem;
         display: flex; align-items: center; justify-content: center; color: #94a3b8; font-weight: 700; }
  .dot.right { background: #16a34a; color: #fff; }
  .dot.wrong { background: #ef4444; color: #fff; }
  .dot.now { outline: 3px solid #86efac; }
  .qcard { background: #fff; border: 1px solid #e2e8f0; border-radius: 18px; padding: 26px;
         box-shadow: 0 2px 10px rgba(30,41,59,.06); }
  .qcard .qn { font-size: .85rem; color: #94a3b8; font-weight: 700; text-transform: uppercase;
         letter-spacing: .05em; }
  .qcard h2 { margin: 6px 0 18px; font-size: 1.3rem; }
  .opt { display: block; width: 100%; text-align: left; border: 2px solid #e2e8f0; background: #fff;
         border-radius: 12px; padding: 13px 16px; margin: 0 0 10px; font-size: 1rem; font-weight: 600;
         cursor: pointer; transition: all .15s; }
  .opt:hover:not(:disabled) { border-color: #86efac; background: #f0fdf4; }
  .opt.right { border-color: #16a34a; background: #dcfce7; color: #14532d; }
  .opt.wrong { border-color: #ef4444; background: #fef2f2; color: #991b1b; }
  .opt:disabled { cursor: default; }
  .why { display: none; margin-top: 14px; background: #f0fdf4; border-left: 5px solid #16a34a;
         border-radius: 0 12px 12px 0; padding: 12px 16px; font-size: .94rem; }
  .why.show { display: block; }
  .why b { color: #166534; }
  .navrow { display: flex; justify-content: space-between; margin-top: 20px; }
  .bigbtn { background: #16a34a; color: #fff; border: none; border-radius: 12px; padding: 12px 28px;
         font-size: 1rem; font-weight: 800; cursor: pointer; }
  .bigbtn:hover { background: #15803d; }
  .bigbtn:disabled { background: #cbd5e1; cursor: default; }
  .ghostbtn { background: #fff; color: #475569; border: 2px solid #cbd5e1; border-radius: 12px;
         padding: 10px 22px; font-size: .95rem; font-weight: 700; cursor: pointer; text-decoration: none; }
  .final { text-align: center; background: #fff; border-radius: 18px; padding: 36px 24px;
         border: 1px solid #e2e8f0; }
  .final .score { font-size: 3.4rem; font-weight: 900; color: #16a34a; margin: 8px 0; }
  .hidden { display: none; }
  footer { text-align: center; color: #94a3b8; font-size: .82rem; margin-top: 24px; }
  footer a { color: #16a34a; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<header>
  <div style="font-size:2.2rem">🎯</div>
  <h1>Lesson 9 Quiz</h1>
  <p>Guess each meaning from the word parts &middot; 20 questions</p>
</header>

<div class="wrap">
  <div class="hud">
    <span>Score: <span id="score">0</span> / 20</span>
    <span>Best: <span id="best">–</span></span>
    <span class="links">
      <a href="index.html" class="ghostbtn" style="padding:6px 14px;font-size:.82rem">← Lesson</a>
      <a href="../index.html" class="ghostbtn" style="padding:6px 14px;font-size:.82rem">🏠 Home</a>
    </span>
  </div>
  <div class="dots" id="dots"></div>

  <div class="qcard" id="qcard">
    <div class="qn" id="qn"></div>
    <h2 id="qq"></h2>
    <div id="opts"></div>
    <div class="why" id="why"></div>
    <div class="navrow">
      <span></span>
      <button class="bigbtn" id="nextBtn" disabled>Next →</button>
    </div>
  </div>

  <div class="final hidden" id="final">
    <div style="font-size:3rem" id="femoji">🌟</div>
    <h2 style="margin:6px 0">Quiz finished!</h2>
    <div class="score"><span id="fscore">0</span> / 20</div>
    <p id="fmsg" style="color:#64748b"></p>
    <p style="color:#94a3b8;font-size:.9rem">Best score: <b id="fbest">–</b></p>
    <button class="bigbtn" onclick="restart()">Try Again (shuffled)</button>
    <a href="index.html" class="ghostbtn" style="margin-left:8px">Back to Lesson 9</a>
  </div>

  <footer>Based on <i>Word Roots Beginning</i> &copy; 2012 The Critical Thinking Co. &middot; Made for Alex 🌱<br/><a href="../index.html">🏠 Word Roots Home</a></footer>
</div>

<script>

const QS = [{"q": "He works in the ___, writing news stories for a website.", "o": ["media", "bank", "hospital", "factory"], "a": 0, "why": "<b>Media</b> comes from <i>medium</i>, the <i>middle</i> thing between an event and you. The <b>media</b> are the in-between channels — TV, papers, websites — that carry news to you, like the website he writes for."}, {"q": "The burn needed ___ attention, so we ran cold water on it.", "o": ["immediate", "delayed", "slow", "later"], "a": 0, "why": "<b>in-</b> means <i>not</i> and <b>medi</b> means <i>middle</i>. <b>Immediate</b> means with <i>nothing in the middle</i> — no waiting between the burn and the help."}, {"q": "Knights in armor lived in ___ times, also called the Middle Ages.", "o": ["medieval", "modern", "ancient", "future"], "a": 0, "why": "<b>medi</b> means <i>middle</i> and <b>evum</b> means <i>age</i>. <b>Medieval</b> means of the <i>Middle Ages</i> — the age of knights in armor."}, {"q": "After beginners' class, she joined the ___ swim group.", "o": ["intermediate", "tallest", "slowest", "newest"], "a": 0, "why": "<b>inter-</b> means <i>between</i> and <b>medi</b> means <i>middle</i>. <b>Intermediate</b> is <i>between</i> levels — in the <i>middle</i>, after beginners but before advanced."}, {"q": "When the fire alarm rang, we ___ lined up at the door.", "o": ["immediately", "later", "eventually", "tomorrow"], "a": 0, "why": "<b>Immediately</b> comes from <b>immediate</b> — with <i>nothing in the middle</i> (<b>in-</b> + <b>medi</b>). We lined up with no waiting in between."}, {"q": "The two sides could not agree, so they asked an ___ to help them talk.", "o": ["intermediary", "chef", "driver", "singer"], "a": 0, "why": "<b>inter-</b> means <i>between</i> and <b>-ary</b> means <i>one who</i>. An <b>intermediary</b> is one who stands in the <i>middle between</i> two sides to help them talk."}, {"q": "The ___ show used lights, music, and video all at once.", "o": ["multimedia", "quiet", "dark", "empty"], "a": 0, "why": "<b>multi-</b> means <i>many</i> and <b>media</b> are the <i>middle</i> channels that carry messages. A <b>multimedia</b> show uses <i>many</i> channels — lights, music, and video together."}, {"q": "The ___ helped the neighbors agree on where to build the fence.", "o": ["mediation", "argument", "fight", "lawsuit"], "a": 0, "why": "<b>medi</b> means <i>middle</i>. <b>Mediation</b> is the act of stepping into the <i>middle</i> to make peace — it helped the neighbors agree."}, {"q": "The ___ Sea lies in the middle of the lands of Europe and Africa.", "o": ["mediterranean", "atlantic", "pacific", "indian"], "a": 0, "why": "<b>medi</b> means <i>middle</i> and <b>terra</b> means <i>land</i>. The <b>Mediterranean</b> is the sea in the <i>middle</i> of the <i>lands</i> of Europe and Africa."}, {"q": "In the story, the ___ was half human and half god.", "o": ["demigod", "hero", "king", "giant"], "a": 0, "why": "<b>demi-</b> comes from <i>medius</i> (<i>middle</i>) and means <i>half</i> — the <i>middle</i> point. A <b>demigod</b> is <i>half</i> god: half human, half god."}, {"q": "The ___ of the storm surprised everyone — it hit within minutes.", "o": ["immediacy", "color", "taste", "smell"], "a": 0, "why": "<b>-cy</b> marks a <i>state</i>. <b>Immediacy</b> is the state of being <b>immediate</b> — with nothing in the <i>middle</i> — so the storm hit within minutes."}, {"q": "He was tired of ___, so he practiced until he was great.", "o": ["mediocrity", "riches", "fame", "luxury"], "a": 0, "why": "<b>Mediocrity</b> is the state of being <b>mediocre</b> — in the <i>middle</i>, just average. He didn't want to stay average, so he practiced."}, {"q": "Doctors call the inner side of the knee the ___ side because it faces the middle of the body.", "o": ["medial", "outer", "upper", "lower"], "a": 0, "why": "<b>medi</b> means <i>middle</i> and <b>-al</b> means <i>relating to</i>. <b>Medial</b> means relating to the <i>middle</i> — the inner knee faces the middle of the body."}, {"q": "Our seats in the ___ were on the middle floor of the theater.", "o": ["mezzanine", "balcony", "lobby", "stage"], "a": 0, "why": "<b>Mezzanine</b> comes from <i>medianus</i>, meaning <i>middle</i>. The <b>mezzanine</b> is the <i>middle</i> floor — between the main floor and the balcony."}, {"q": "The ___ castle was built to stand up to cannons.", "o": ["postmedieval", "medieval", "ancient", "modern"], "a": 0, "why": "<b>post-</b> means <i>after</i>. <b>Medieval</b> means <i>of the middle age</i>, so <b>postmedieval</b> is after those times — when cannons existed."}, {"q": "The opera singer is a ___, not a high soprano.", "o": ["mezzo", "painter", "writer", "pilot"], "a": 0, "why": "<b>Mezzo</b> means <i>middle</i> in Italian. A <b>mezzo</b> voice sits in the <i>middle</i> — lower than a soprano."}, {"q": "The ___ of the gray paint made it neither light nor dark.", "o": ["intermediacy", "beauty", "smell", "price"], "a": 0, "why": "<b>Intermediacy</b> is the state of being <b>intermediate</b> — <i>between</i> (<b>inter-</b>) and in the <i>middle</i> (<b>medi</b>) — neither light nor dark."}, {"q": "The ___ spent years reading old books about knights and castles.", "o": ["medievalist", "tourist", "chef", "pilot"], "a": 0, "why": "<b>-ist</b> means <i>one who studies</i>. A <b>medievalist</b> studies <b>medieval</b> times — the <i>Middle Ages</i> of knights and castles."}, {"q": "The fin sits ___ on the fish, right along its center line.", "o": ["medially", "brightly", "loudly", "sweetly"], "a": 0, "why": "<b>Medially</b> comes from <b>medial</b> (relating to the <i>middle</i>). The fin sits toward the <i>middle</i> — on the center line."}, {"q": "The ___ tribes lived in Europe before the Middle Ages began.", "o": ["premedieval", "modern", "future", "space"], "a": 0, "why": "<b>pre-</b> means <i>before</i>. <b>Premedieval</b> means <i>before</i> <b>medieval</b> (<i>Middle Ages</i>) times."}];
const KEY = "wr9-quiz-best";
const ROOTW = "medi";
const EMOJI = "\u2696\ufe0f";
let order, idx, score, answered;
function best(){ try{ return JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){ return null; } }

function shuffle(a){
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function renderDots(){
  const d = document.getElementById("dots"); d.innerHTML = "";
  order.forEach((q,i)=>{
    const s = document.createElement("div"); s.className = "dot"; s.textContent = i+1;
    if(i < answered.length) s.classList.add(answered[i] ? "right" : "wrong");
    if(i === idx) s.classList.add("now");
    d.appendChild(s);
  });
}
function render(){
  renderDots();
  const q = QS[order[idx]];
  document.getElementById("qn").textContent = "Question " + (idx+1) + " of 20";
  document.getElementById("qq").textContent = q.q;
  const opts = document.getElementById("opts"); opts.innerHTML = "";
  const why = document.getElementById("why"); why.classList.remove("show"); why.innerHTML = "";
  const next = document.getElementById("nextBtn"); next.disabled = true;
  next.textContent = (idx === order.length-1) ? "See my score \u2192" : "Next \u2192";
  const oidx = shuffle(q.o.map((_,i)=>i));
  oidx.forEach((oi)=>{
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = q.o[oi];
    b.onclick = ()=>{
      const ok = (oi === q.a);
      [...opts.children].forEach((x,k)=>{
        x.disabled = true;
        if(oidx[k] === q.a) x.classList.add("right");
      });
      if(!ok) b.classList.add("wrong"); else score++;
      answered.push(ok);
      document.getElementById("score").textContent = score;
      why.innerHTML = (ok ? "\u2705 Correct! " : "\u274C Not quite. ") + q.why;
      why.classList.add("show");
      next.disabled = false;
      renderDots();
    };
    opts.appendChild(b);
  });
}
document.getElementById("nextBtn").onclick = ()=>{
  if(idx < order.length-1){ idx++; render(); window.scrollTo({top:0,behavior:"smooth"}); }
  else finish();
};
function finish(){
  document.getElementById("qcard").classList.add("hidden");
  document.getElementById("dots").classList.add("hidden");
  const f = document.getElementById("final"); f.classList.remove("hidden");
  document.getElementById("fscore").textContent = score;
  const b = best();
  const nb = (b===null || score > b) ? score : b;
  localStorage.setItem(KEY, JSON.stringify(nb));
  document.getElementById("fbest").textContent = nb + " / 20";
  const msg = score===20 ? "Perfect! You are a true word-root master! \U0001F3C6"
    : score>=16 ? "Excellent! The "+ROOTW+" words are really sticking! "+EMOJI
    : score>=12 ? "Good job! Review the ones you missed and try again."
    : "Good start! Go back to the lesson, then try again \u2014 you've got this! \U0001F4AA";
  document.getElementById("fmsg").textContent = msg;
  document.getElementById("femoji").textContent = score===20 ? "\U0001F3C6" : score>=12 ? "\U0001F31F" : "\U0001F331";
  window.scrollTo({top:0,behavior:"smooth"});
}
function restart(){
  order = shuffle(QS.map((_,i)=>i));
  idx = 0; score = 0; answered = [];
  document.getElementById("score").textContent = "0";
  document.getElementById("final").classList.add("hidden");
  document.getElementById("qcard").classList.remove("hidden");
  document.getElementById("dots").classList.remove("hidden");
  render();
}
(function init(){
  const b = best();
  document.getElementById("best").textContent = b===null ? "\u2013" : b + " / 20";
  restart();
})();

</script>
</body>
</html>
