<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lesson 9 Quiz | Word Roots Beginning</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         margin: 0; background: #f6f9f4; color: #1e293b; line-height: 1.6; }
  header { background: linear-gradient(135deg, #1d4ed8, #60a5fa); color: #fff;
         padding: 30px 20px; text-align: center; }
  header h1 { margin: 6px 0 4px; font-size: 1.8rem; }
  header p { margin: 0; opacity: .92; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 24px 22px 60px; }
  .hud { background: #fff; border: 1px solid #bfdbfe; border-radius: 14px; padding: 12px 18px;
         margin: -24px auto 20px; max-width: 1000px; display: flex; justify-content: space-between;
         align-items: center; box-shadow: 0 4px 14px rgba(37,99,235,.10); font-weight: 700; }
  .dots { display: flex; flex-wrap: wrap; gap: 5px; margin: 0 0 20px; }
  .dot { width: 22px; height: 22px; border-radius: 50%; background: #e2e8f0; font-size: .7rem;
         display: flex; align-items: center; justify-content: center; color: #94a3b8; font-weight: 700; }
  .dot.right { background: #2563eb; color: #fff; }
  .dot.wrong { background: #ef4444; color: #fff; }
  .dot.now { outline: 3px solid #93c5fd; }
  .qcard { background: #fff; border: 1px solid #e2e8f0; border-radius: 18px; padding: 26px;
         box-shadow: 0 2px 10px rgba(30,41,59,.06); }
  .qcard .qn { font-size: .85rem; color: #94a3b8; font-weight: 700; text-transform: uppercase;
         letter-spacing: .05em; }
  .qcard h2 { margin: 6px 0 18px; font-size: 1.3rem; }
  .opt { display: block; width: 100%; text-align: left; border: 2px solid #e2e8f0; background: #fff;
         border-radius: 12px; padding: 13px 16px; margin: 0 0 10px; font-size: 1rem; font-weight: 600;
         cursor: pointer; transition: all .15s; }
  .opt:hover:not(:disabled) { border-color: #93c5fd; background: #eff6ff; }
  .opt.right { border-color: #16a34a; background: #dcfce7; color: #14532d; }
  .opt.wrong { border-color: #ef4444; background: #fef2f2; color: #991b1b; }
  .opt:disabled { cursor: default; }
  .why { display: none; margin-top: 14px; background: #eff6ff; border-left: 5px solid #2563eb;
         border-radius: 0 12px 12px 0; padding: 12px 16px; font-size: .94rem; }
  .why.show { display: block; }
  .why b { color: #1e40af; }
  .navrow { display: flex; justify-content: space-between; margin-top: 20px; }
  .bigbtn { background: #2563eb; color: #fff; border: none; border-radius: 12px; padding: 12px 28px;
         font-size: 1rem; font-weight: 800; cursor: pointer; }
  .bigbtn:hover { background: #1d4ed8; }
  .bigbtn:disabled { background: #cbd5e1; cursor: default; }
  .ghostbtn { background: #fff; color: #475569; border: 2px solid #cbd5e1; border-radius: 12px;
         padding: 10px 22px; font-size: .95rem; font-weight: 700; cursor: pointer; text-decoration: none; }
  .final { text-align: center; background: #fff; border-radius: 18px; padding: 36px 24px;
         border: 1px solid #e2e8f0; }
  .final .score { font-size: 3.4rem; font-weight: 900; color: #2563eb; margin: 8px 0; }
  .hidden { display: none; }
  footer { text-align: center; color: #94a3b8; font-size: .82rem; margin-top: 24px; }
</style>
</head>
<body>
<header>
  <div style="font-size:2.2rem">🎯</div>
  <h1>Lesson 9 Quiz</h1>
  <p>Use the root medi and its suffixes to figure out each meaning &middot; 20 questions</p>
</header>

<div class="wrap">
  <div class="hud">
    <span>Score: <span id="score">0</span> / 20</span>
    <span>Best: <span id="best">–</span></span>
    <a href="index.html" class="ghostbtn" style="padding:6px 14px;font-size:.82rem">← Lesson</a>
  </div>
  <div class="dots" id="dots"></div>

  <div class="qcard" id="qcard">
    <div class="qn" id="qn"></div>
    <h2 id="qq"></h2>
    <div id="opts"></div>
    <div class="why" id="why"></div>
    <div class="navrow">
      <span></span>
      <button class="bigbtn" id="nextBtn" disabled>Next →</button>
    </div>
  </div>

  <div class="final hidden" id="final">
    <div style="font-size:3rem" id="femoji">🌟</div>
    <h2 style="margin:6px 0">Quiz finished!</h2>
    <div class="score"><span id="fscore">0</span> / 20</div>
    <p id="fmsg" style="color:#64748b"></p>
    <p style="color:#94a3b8;font-size:.9rem">Best score: <b id="fbest">–</b></p>
    <button class="bigbtn" onclick="restart()">Try Again (shuffled)</button>
    <a href="index.html" class="ghostbtn" style="margin-left:8px">Back to Lesson 9</a>
    <a href="../lesson-10/" class="bigbtn" style="margin-left:8px;text-decoration:none">Next: Lesson 10 →</a>
  </div>

  <footer>Based on <i>Word Roots Beginning</i> &copy; 2012 The Critical Thinking Co. &middot; Made for Alex 🌱</footer>
</div>

<script>
const QS = [
 {q:"What does the root “medi” mean?",
  o:["place","half, middle, halfway between","step","to make, to act"], a:1,
  why:"<b>medi</b> = half, middle, halfway between — the root of mediate, medium, median, and mediator."},
 {q:"What does the suffix “-an” mean?",
  o:["like, related to","one who, that which","of or belonging to","in the manner of"], a:0,
  why:"<b>-an</b> = like, related to — as in medi + -an = <b>median</b> (something related to the middle)."},
 {q:"What does the suffix “-ate” mean?",
  o:["place where","to make, to act; one who, that which","like, related to","in the manner of"], a:1,
  why:"<b>-ate</b> = to make, to act; one who, that which — as in medi + -ate = <b>mediate</b>."},
 {q:"What does “at-or” mean?",
  o:["half, middle","like, related to","one who, that which, condition, state, activity","of or belonging to"], a:2,
  why:"<b>at-or</b> = one who, that which, condition, state, activity — as in medi + at + or = <b>mediator</b>."},
 {q:"What does the suffix “-um” mean?",
  o:["of or belonging to","like, related to","in the manner of","to make, to act"], a:0,
  why:"<b>-um</b> = of or belonging to — as in medi + -um = <b>medium</b>."},
 {q:"“medi” + “-ate” = “mediate”. What does “mediate” mean?",
  o:["to act or come between opposing sides to solve a problem","of a middle size","something in the middle","to plant flowers"], a:0,
  why:"<b>medi</b> (half, middle, halfway between) + <b>-ate</b> (to make, to act) = to act or come between opposing sides to solve a problem."},
 {q:"“medi” + “at” + “or” = “mediator”. What does “mediator” mean?",
  o:["something in the middle","a planted strip on a road","one who acts between opposing sides to solve a problem","of a middle size"], a:2,
  why:"<b>medi</b> (half, middle, halfway between) + <b>at-or</b> (one who) = one who acts between opposing sides to solve a problem."},
 {q:"“medi” + “-um” = “medium”. What does “medium” mean?",
  o:["something in the middle","of a middle size, amount, or quality; neither large nor small","one who solves problems","to come between sides"], a:1,
  why:"<b>medi</b> (half, middle, halfway between) + <b>-um</b> (of or belonging to) = of a middle size, amount, or quality."},
 {q:"“medi” + “-an” = “median”. What does “median” mean?",
  o:["something that is related to or in the middle","to act between opposing sides","one who solves problems","of a middle size"], a:0,
  why:"<b>medi</b> (half, middle, halfway between) + <b>-an</b> (like, related to) = something that is related to or in the middle."},
 {q:"Which word means “one who acts between opposing sides to solve a problem”?",
  o:["mediate","medium","median","mediator"], a:3,
  why:"<b>mediator</b> = medi + at + or — the “one who” does the mediating."},
 {q:"Which word means “of a middle size, amount, or quality; neither large nor small”?",
  o:["median","medium","mediate","mediator"], a:1,
  why:"<b>medium</b> = medi + um — the Gazette story says Mrs. Ringo kept up the medium-sized bushes."},
 {q:"Which word means “something that is related to or in the middle”?",
  o:["median","medium","mediate","mediator"], a:0,
  why:"<b>median</b> = medi + an — like the weedy median in the middle of Main Street."},
 {q:"Which word means “to act or come between opposing sides to solve a problem”?",
  o:["medium","mediator","mediate","median"], a:2,
  why:"<b>mediate</b> = medi + ate — to make a problem meet in the middle and get solved."},
 {q:"The word “mediocre” is from two roots. Which two?",
  o:["medi and ocris","medi and loc","medi and grad","medi and scope"], a:0,
  why:"<b>mediocre</b> = <b>medi</b> + <b>ocris</b> — the book's etymology tip."},
 {q:"What does the root “ocris” mean?",
  o:["half, middle","small","stony mountain","to make, to act"], a:2,
  why:"<b>ocris</b> = stony mountain — mediocre originally meant going only halfway up the mountain."},
 {q:"What did “mediocre” originally mean?",
  o:["something done half as well as is possible","going only halfway up the mountain","the middle of a road","to solve a problem"], a:1,
  why:"<b>medi</b> (half) + <b>ocris</b> (stony mountain) = going only halfway up the mountain. Over time it came to mean something done half as well as is possible."},
 {q:"In “An Article From the Gazette”, the weedy ___ goes right down the middle of Main Street.",
  o:["mediator","medium","mediate","median"], a:3,
  why:"The weedy <b>median</b> goes right down the middle of Main Street — median = something in the middle."},
 {q:"In the Gazette story, the council voted to have the garden club two towns over ___ the issue.",
  o:["median","mediate","medium","mediator"], a:1,
  why:"The council voted to have the garden club two towns over <b>mediate</b> the issue — to act between the three groups and solve the problem."},
 {q:"In the Gazette story, who spoke to the town council about the problem?",
  o:["Old Mrs. Ringo","Chu Ying","the garden club","the flowers"], a:1,
  why:"Our own <b>Chu Ying</b> spoke to the town council — and Chu is just nine years old!"},
 {q:"In Activity B, which word matches this picture: three pairs of jeans with an arrow pointing at the middle-sized pair?",
  o:["median","mediate","mediator","medium"], a:3,
  why:"The arrow points at the <b>middle-sized</b> pair — <b>medium</b> = neither large nor small."}
];

const KEY = "wr9-quiz-best";
let order, idx, score, answered;
function best(){ try{ return JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){ return null; } }

function shuffle(a){
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function renderDots(){
  const d = document.getElementById("dots"); d.innerHTML = "";
  order.forEach((q,i)=>{
    const s = document.createElement("div"); s.className = "dot"; s.textContent = i+1;
    if(i < answered.length) s.classList.add(answered[i] ? "right" : "wrong");
    if(i === idx) s.classList.add("now");
    d.appendChild(s);
  });
}
function render(){
  renderDots();
  const q = QS[order[idx]];
  document.getElementById("qn").textContent = "Question " + (idx+1) + " of 20";
  document.getElementById("qq").textContent = q.q;
  const opts = document.getElementById("opts"); opts.innerHTML = "";
  const why = document.getElementById("why"); why.classList.remove("show"); why.innerHTML = "";
  const next = document.getElementById("nextBtn"); next.disabled = true;
  next.textContent = (idx === order.length-1) ? "See my score →" : "Next →";
  const oidx = shuffle(q.o.map((_,i)=>i));
  oidx.forEach((oi)=>{
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = q.o[oi];
    b.onclick = ()=>{
      const ok = (oi === q.a);
      [...opts.children].forEach((x,k)=>{
        x.disabled = true;
        if(oidx[k] === q.a) x.classList.add("right");
      });
      if(!ok) b.classList.add("wrong"); else score++;
      answered.push(ok);
      document.getElementById("score").textContent = score;
      why.innerHTML = (ok ? "✅ Correct! " : "❌ Not quite. ") + q.why;
      why.classList.add("show");
      next.disabled = false;
      renderDots();
    };
    opts.appendChild(b);
  });
}
document.getElementById("nextBtn").onclick = ()=>{
  if(idx < order.length-1){ idx++; render(); window.scrollTo({top:0,behavior:"smooth"}); }
  else finish();
};
function finish(){
  document.getElementById("qcard").classList.add("hidden");
  document.getElementById("dots").classList.add("hidden");
  const f = document.getElementById("final"); f.classList.remove("hidden");
  document.getElementById("fscore").textContent = score;
  const b = best();
  const nb = (b===null || score > b) ? score : b;
  localStorage.setItem(KEY, JSON.stringify(nb));
  document.getElementById("fbest").textContent = nb + " / 20";
  const msg = score===20 ? "Perfect! You are a true middle master! 🏆"
    : score>=16 ? "Excellent! The root medi is really sticking! ⚖️"
    : score>=12 ? "Good job! Review the ones you missed and try again."
    : "Good start! Go back to the lesson, then try again — you've got this! 💪";
  document.getElementById("fmsg").textContent = msg;
  document.getElementById("femoji").textContent = score===20 ? "🏆" : score>=12 ? "🌟" : "🌱";
  window.scrollTo({top:0,behavior:"smooth"});
}
function restart(){
  order = shuffle(QS.map((_,i)=>i));
  idx = 0; score = 0; answered = [];
  document.getElementById("score").textContent = "0";
  document.getElementById("final").classList.add("hidden");
  document.getElementById("qcard").classList.remove("hidden");
  document.getElementById("dots").classList.remove("hidden");
  render();
}
(function init(){
  const b = best();
  document.getElementById("best").textContent = b===null ? "–" : b + " / 20";
  restart();
})();
</script>
</body>
</html>
