<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lesson 11 Quiz | Word Roots Beginning</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         margin: 0; background: #f8f6fd; color: #1e293b; line-height: 1.6; }
  header { background: linear-gradient(135deg, #4c1d95, #8b5cf6); color: #fff;
         padding: 30px 20px; text-align: center; }
  header h1 { margin: 6px 0 4px; font-size: 1.8rem; }
  header p { margin: 0; opacity: .92; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 24px 22px 60px; }
  .hud { background: #fff; border: 1px solid #ddd6fe; border-radius: 14px; padding: 12px 18px;
         margin: -24px auto 20px; max-width: 1000px; display: flex; justify-content: space-between;
         align-items: center; box-shadow: 0 4px 14px rgba(76,29,149,.10); font-weight: 700; }
  .dots { display: flex; flex-wrap: wrap; gap: 5px; margin: 0 0 20px; }
  .dot { width: 22px; height: 22px; border-radius: 50%; background: #e2e8f0; font-size: .7rem;
         display: flex; align-items: center; justify-content: center; color: #94a3b8; font-weight: 700; }
  .dot.right { background: #6d28d9; color: #fff; }
  .dot.wrong { background: #ef4444; color: #fff; }
  .dot.now { outline: 3px solid #a78bfa; }
  .qcard { background: #fff; border: 1px solid #e2e8f0; border-radius: 18px; padding: 26px;
         box-shadow: 0 2px 10px rgba(30,41,59,.06); }
  .qcard .qn { font-size: .85rem; color: #94a3b8; font-weight: 700; text-transform: uppercase;
         letter-spacing: .05em; }
  .qcard h2 { margin: 6px 0 18px; font-size: 1.3rem; }
  .opt { display: block; width: 100%; text-align: left; border: 2px solid #e2e8f0; background: #fff;
         border-radius: 12px; padding: 13px 16px; margin: 0 0 10px; font-size: 1rem; font-weight: 600;
         cursor: pointer; transition: all .15s; }
  .opt:hover:not(:disabled) { border-color: #a78bfa; background: #f5f3ff; }
  .opt.right { border-color: #16a34a; background: #dcfce7; color: #14532d; }
  .opt.wrong { border-color: #ef4444; background: #fef2f2; color: #991b1b; }
  .opt:disabled { cursor: default; }
  .why { display: none; margin-top: 14px; background: #f5f3ff; border-left: 5px solid #6d28d9;
         border-radius: 0 12px 12px 0; padding: 12px 16px; font-size: .94rem; }
  .why.show { display: block; }
  .why b { color: #4c1d95; }
  .navrow { display: flex; justify-content: space-between; margin-top: 20px; }
  .bigbtn { background: #6d28d9; color: #fff; border: none; border-radius: 12px; padding: 12px 28px;
         font-size: 1rem; font-weight: 800; cursor: pointer; }
  .bigbtn:hover { background: #5b21b6; }
  .bigbtn:disabled { background: #cbd5e1; cursor: default; }
  .ghostbtn { background: #fff; color: #475569; border: 2px solid #cbd5e1; border-radius: 12px;
         padding: 10px 22px; font-size: .95rem; font-weight: 700; cursor: pointer; text-decoration: none; }
  .final { text-align: center; background: #fff; border-radius: 18px; padding: 36px 24px;
         border: 1px solid #e2e8f0; }
  .final .score { font-size: 3.4rem; font-weight: 900; color: #6d28d9; margin: 8px 0; }
  .hidden { display: none; }
  footer { text-align: center; color: #94a3b8; font-size: .82rem; margin-top: 24px; }
</style>
</head>
<body>
<header>
  <div style="font-size:2.2rem">🎯</div>
  <h1>Lesson 11 Quiz</h1>
  <p>Use the root <i>audi</i> and the suffixes you learned to figure out each meaning &middot; 20 questions</p>
</header>

<div class="wrap">
  <div class="hud">
    <span>Score: <span id="score">0</span> / 20</span>
    <span>Best: <span id="best">–</span></span>
    <a href="index.html" class="ghostbtn" style="padding:6px 14px;font-size:.82rem">← Lesson</a>
  </div>
  <div class="dots" id="dots"></div>

  <div class="qcard" id="qcard">
    <div class="qn" id="qn"></div>
    <h2 id="qq"></h2>
    <div id="opts"></div>
    <div class="why" id="why"></div>
    <div class="navrow">
      <span></span>
      <button class="bigbtn" id="nextBtn" disabled>Next →</button>
    </div>
  </div>

  <div class="final hidden" id="final">
    <div style="font-size:3rem" id="femoji">🌟</div>
    <h2 style="margin:6px 0">Quiz finished!</h2>
    <div class="score"><span id="fscore">0</span> / 20</div>
    <p id="fmsg" style="color:#64748b"></p>
    <p style="color:#94a3b8;font-size:.9rem">Best score: <b id="fbest">–</b></p>
    <button class="bigbtn" onclick="restart()">Try Again (shuffled)</button>
    <a href="index.html" class="ghostbtn" style="margin-left:8px">Back to Lesson 11</a>
    <a href="../lesson-12/" class="bigbtn" style="margin-left:8px;text-decoration:none">Next: Lesson 12 →</a>
  </div>

  <footer>Based on <i>Word Roots Beginning</i> &copy; 2012 The Critical Thinking Co. &middot; Made for Alex 🌱</footer>
</div>

<script>
const QS = [
 {q:"What does the root “audi” mean?",
  o:["see","hear","step","walk"], a:1,
  why:"<b>audi</b> = hear — every word in Lesson 11 is about hearing."},
 {q:"Which suffix means “one who”?",
  o:["-ence","-ist","-tion","t-ory"], a:1,
  why:"<b>-ist</b> = one who — as in <b>audiologist</b>, one who treats hearing problems."},
 {q:"What does the suffix “-ology” mean?",
  o:["place where","one who","study of, science","state, quality, act"], a:2,
  why:"<b>-ology</b> = study of, science — as in <b>audiology</b>, the scientific study of hearing."},
 {q:"Which suffix means “place where”?",
  o:["-ist","t-orium","-ence","t-ory"], a:1,
  why:"<b>t-orium</b> = place where — as in <b>auditorium</b>, a place where concerts and lectures are held."},
 {q:"What does the suffix “t-ory” mean?",
  o:["one who","like, relating to","place where","study of, science"], a:1,
  why:"<b>t-ory</b> = like, relating to — as in <b>auditory</b>, relating to the process of hearing."},
 {q:"What does the suffix “-ence” mean?",
  o:["state, quality, act","one who","place where","like, relating to"], a:0,
  why:"<b>-ence</b> = state, quality, act — as in <b>audience</b>."},
 {q:"“auditorium” = audi + t + orium. What does “auditorium” mean?",
  o:["A place where lectures, concerts, and other events are held","One who treats hearing problems","A brief act of performing to get a role","The scientific study of hearing"], a:0,
  why:"<b>audi</b> (hear) + <b>t</b> + <b>orium</b> (place where) = a place where listening events are held."},
 {q:"“audiology” = audi + ology. What does “audiology” mean?",
  o:["A group of people listening","The scientific study of hearing","Relating to the process of hearing","An act of singing to get a role"], a:1,
  why:"<b>audi</b> (hear) + <b>ology</b> (study of, science) = the scientific study of hearing."},
 {q:"“audition” = audi + tion. What does “audition” mean?",
  o:["A place where concerts are held","One who treats ear problems","A brief act of singing or performing another skill when seeking a role in a movie or play","Relating to the process of hearing"], a:2,
  why:"<b>audi</b> (hear) + <b>tion</b> (state, quality, act) = a brief act of performing to get a role."},
 {q:"“audiologist” = audi + olog + ist. What does “audiologist” mean?",
  o:["A place where lectures are held","The scientific study of hearing","A group of people listening","One who is trained to treat hearing and ear problems"], a:3,
  why:"<b>audi</b> (hear) + <b>olog</b> (study of, science) + <b>ist</b> (one who) = one who treats hearing problems."},
 {q:"“audience” = audi + ence. What does “audience” mean?",
  o:["A group of people listening to a performance","A place where concerts are held","The scientific study of hearing","A brief act of performing to get a role"], a:0,
  why:"<b>audi</b> (hear) + <b>ence</b> (state, quality, act) = a group of people listening."},
 {q:"“auditory” = audi + t + ory. What does “auditory” mean?",
  o:["A place where concerts are held","One who treats ear problems","The scientific study of hearing","Of or relating to the process of hearing"], a:3,
  why:"<b>audi</b> (hear) + <b>t</b> + <b>ory</b> (like, relating to) = relating to hearing."},
 {q:"In the story “What? What Did You Say?”, students gathered in the school ___ to learn about noises.",
  o:["audience","auditorium","audiology","auditory"], a:1,
  why:"The students gathered in the school <b>auditorium</b> — a place where the whole school can listen."},
 {q:"In the story, the speaker was an ___ who said the sounds were over 100 decibels.",
  o:["auditorium","audition","audience","audiologist"], a:3,
  why:"The speaker was an <b>audiologist</b> — one who is trained to treat hearing and ear problems."},
 {q:"In the story, “People studying ___ are concerned about the noise in our lives—and in our ears.”",
  o:["audition","audiology","audience","auditorium"], a:1,
  why:"People studying <b>audiology</b> — the scientific study of hearing — care about noise."},
 {q:"In the story, “Even sounds coming through ear buds to an ___ of one person can be over 100 decibels!”",
  o:["audience","auditorium","audition","auditory"], a:0,
  why:"An <b>audience</b> of one person — one listener — can still hear sounds over 100 decibels."},
 {q:"In the story, “Hearing high ___ levels can cause permanent damage to our ears.”",
  o:["auditorium","audience","auditory","audiologist"], a:2,
  why:"High <b>auditory</b> levels — sound levels relating to hearing — can damage your ears."},
 {q:"The book's choice box for the story had 6 words. Which word was NOT used in the story?",
  o:["audiology","auditorium","audition","audience"], a:2,
  why:"<b>audition</b> was in the choice box but not used — the story needed 5 words, and this one didn't fit."},
 {q:"Which word is built as audi + olog + ist?",
  o:["audiology","auditorium","audience","audiologist"], a:3,
  why:"<b>audiologist</b> = <b>audi</b> (hear) + <b>olog</b> (study of, science) + <b>ist</b> (one who)."},
 {q:"What is the book's formula for building new words with suffixes?",
  o:["SUFFIX + ROOT = NEW WORD","ROOT + SUFFIX = NEW WORD","ROOT - SUFFIX = NEW WORD","SUFFIX - ROOT = NEW WORD"], a:1,
  why:"The book's formula is <b>ROOT + SUFFIX = NEW WORD</b> — as in audi + ology = audiology."}
];

const KEY = "wr11-quiz-best";
let order, idx, score, answered;
function best(){ try{ return JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){ return null; } }

function shuffle(a){
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function renderDots(){
  const d = document.getElementById("dots"); d.innerHTML = "";
  order.forEach((q,i)=>{
    const s = document.createElement("div"); s.className = "dot"; s.textContent = i+1;
    if(i < answered.length) s.classList.add(answered[i] ? "right" : "wrong");
    if(i === idx) s.classList.add("now");
    d.appendChild(s);
  });
}
function render(){
  renderDots();
  const q = QS[order[idx]];
  document.getElementById("qn").textContent = "Question " + (idx+1) + " of 20";
  document.getElementById("qq").textContent = q.q;
  const opts = document.getElementById("opts"); opts.innerHTML = "";
  const why = document.getElementById("why"); why.classList.remove("show"); why.innerHTML = "";
  const next = document.getElementById("nextBtn"); next.disabled = true;
  next.textContent = (idx === order.length-1) ? "See my score →" : "Next →";
  const oidx = shuffle(q.o.map((_,i)=>i));
  oidx.forEach((oi)=>{
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = q.o[oi];
    b.onclick = ()=>{
      const ok = (oi === q.a);
      [...opts.children].forEach((x,k)=>{
        x.disabled = true;
        if(oidx[k] === q.a) x.classList.add("right");
      });
      if(!ok) b.classList.add("wrong"); else score++;
      answered.push(ok);
      document.getElementById("score").textContent = score;
      why.innerHTML = (ok ? "✅ Correct! " : "❌ Not quite. ") + q.why;
      why.classList.add("show");
      next.disabled = false;
      renderDots();
    };
    opts.appendChild(b);
  });
}
document.getElementById("nextBtn").onclick = ()=>{
  if(idx < order.length-1){ idx++; render(); window.scrollTo({top:0,behavior:"smooth"}); }
  else finish();
};
function finish(){
  document.getElementById("qcard").classList.add("hidden");
  document.getElementById("dots").classList.add("hidden");
  const f = document.getElementById("final"); f.classList.remove("hidden");
  document.getElementById("fscore").textContent = score;
  const b = best();
  const nb = (b===null || score > b) ? score : b;
  localStorage.setItem(KEY, JSON.stringify(nb));
  document.getElementById("fbest").textContent = nb + " / 20";
  const msg = score===20 ? "Perfect! You are a true audi master! 🏆"
    : score>=16 ? "Excellent! The root and suffixes are really sticking! 👂"
    : score>=12 ? "Good job! Review the ones you missed and try again."
    : "Good start! Go back to the lesson, then try again — you've got this! 💪";
  document.getElementById("fmsg").textContent = msg;
  document.getElementById("femoji").textContent = score===20 ? "🏆" : score>=12 ? "🌟" : "🌱";
  window.scrollTo({top:0,behavior:"smooth"});
}
function restart(){
  order = shuffle(QS.map((_,i)=>i));
  idx = 0; score = 0; answered = [];
  document.getElementById("score").textContent = "0";
  document.getElementById("final").classList.add("hidden");
  document.getElementById("qcard").classList.remove("hidden");
  document.getElementById("dots").classList.remove("hidden");
  render();
}
(function init(){
  const b = best();
  document.getElementById("best").textContent = b===null ? "–" : b + " / 20";
  restart();
})();
</script>
</body>
</html>
