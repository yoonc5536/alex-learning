<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lesson 11 Quiz | Word Roots Beginning</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         margin: 0; background: #f6f9f4; color: #1e293b; line-height: 1.6; }
  header { background: linear-gradient(135deg, #15803d, #4ade80); color: #fff;
         padding: 30px 20px; text-align: center; }
  header h1 { margin: 6px 0 4px; font-size: 1.8rem; }
  header p { margin: 0; opacity: .92; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 24px 22px 60px; }
  .hud { background: #fff; border: 1px solid #bbf7d0; border-radius: 14px; padding: 12px 18px;
         margin: -24px auto 20px; max-width: 1000px; display: flex; justify-content: space-between;
         align-items: center; box-shadow: 0 4px 14px rgba(22,163,74,.10); font-weight: 700; flex-wrap: wrap; gap: 8px; }
  .hud .links { display: flex; gap: 8px; }
  .dots { display: flex; flex-wrap: wrap; gap: 5px; margin: 0 0 20px; }
  .dot { width: 22px; height: 22px; border-radius: 50%; background: #e2e8f0; font-size: .7rem;
         display: flex; align-items: center; justify-content: center; color: #94a3b8; font-weight: 700; }
  .dot.right { background: #16a34a; color: #fff; }
  .dot.wrong { background: #ef4444; color: #fff; }
  .dot.now { outline: 3px solid #86efac; }
  .qcard { background: #fff; border: 1px solid #e2e8f0; border-radius: 18px; padding: 26px;
         box-shadow: 0 2px 10px rgba(30,41,59,.06); }
  .qcard .qn { font-size: .85rem; color: #94a3b8; font-weight: 700; text-transform: uppercase;
         letter-spacing: .05em; }
  .qcard h2 { margin: 6px 0 18px; font-size: 1.3rem; }
  .opt { display: block; width: 100%; text-align: left; border: 2px solid #e2e8f0; background: #fff;
         border-radius: 12px; padding: 13px 16px; margin: 0 0 10px; font-size: 1rem; font-weight: 600;
         cursor: pointer; transition: all .15s; }
  .opt:hover:not(:disabled) { border-color: #86efac; background: #f0fdf4; }
  .opt.right { border-color: #16a34a; background: #dcfce7; color: #14532d; }
  .opt.wrong { border-color: #ef4444; background: #fef2f2; color: #991b1b; }
  .opt:disabled { cursor: default; }
  .why { display: none; margin-top: 14px; background: #f0fdf4; border-left: 5px solid #16a34a;
         border-radius: 0 12px 12px 0; padding: 12px 16px; font-size: .94rem; }
  .why.show { display: block; }
  .why b { color: #166534; }
  .navrow { display: flex; justify-content: space-between; margin-top: 20px; }
  .bigbtn { background: #16a34a; color: #fff; border: none; border-radius: 12px; padding: 12px 28px;
         font-size: 1rem; font-weight: 800; cursor: pointer; }
  .bigbtn:hover { background: #15803d; }
  .bigbtn:disabled { background: #cbd5e1; cursor: default; }
  .ghostbtn { background: #fff; color: #475569; border: 2px solid #cbd5e1; border-radius: 12px;
         padding: 10px 22px; font-size: .95rem; font-weight: 700; cursor: pointer; text-decoration: none; }
  .final { text-align: center; background: #fff; border-radius: 18px; padding: 36px 24px;
         border: 1px solid #e2e8f0; }
  .final .score { font-size: 3.4rem; font-weight: 900; color: #16a34a; margin: 8px 0; }
  .hidden { display: none; }
  footer { text-align: center; color: #94a3b8; font-size: .82rem; margin-top: 24px; }
  footer a { color: #16a34a; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<header>
  <div style="font-size:2.2rem">🎯</div>
  <h1>Lesson 11 Quiz</h1>
  <p>Guess each meaning from the word parts &middot; 20 questions</p>
</header>

<div class="wrap">
  <div class="hud">
    <span>Score: <span id="score">0</span> / 20</span>
    <span>Best: <span id="best">–</span></span>
    <span class="links">
      <a href="index.html" class="ghostbtn" style="padding:6px 14px;font-size:.82rem">← Lesson</a>
      <a href="../index.html" class="ghostbtn" style="padding:6px 14px;font-size:.82rem">🏠 Home</a>
    </span>
  </div>
  <div class="dots" id="dots"></div>

  <div class="qcard" id="qcard">
    <div class="qn" id="qn"></div>
    <h2 id="qq"></h2>
    <div id="opts"></div>
    <div class="why" id="why"></div>
    <div class="navrow">
      <span></span>
      <button class="bigbtn" id="nextBtn" disabled>Next →</button>
    </div>
  </div>

  <div class="final hidden" id="final">
    <div style="font-size:3rem" id="femoji">🌟</div>
    <h2 style="margin:6px 0">Quiz finished!</h2>
    <div class="score"><span id="fscore">0</span> / 20</div>
    <p id="fmsg" style="color:#64748b"></p>
    <p style="color:#94a3b8;font-size:.9rem">Best score: <b id="fbest">–</b></p>
    <button class="bigbtn" onclick="restart()">Try Again (shuffled)</button>
    <a href="index.html" class="ghostbtn" style="margin-left:8px">Back to Lesson 11</a>
  </div>

  <footer>Based on <i>Word Roots Beginning</i> &copy; 2012 The Critical Thinking Co. &middot; Made for Alex 🌱<br/><a href="../index.html">🏠 Word Roots Home</a></footer>
</div>

<script>

const QS = [{"q": "The video's ___ was too quiet, so we turned up the volume.", "o": ["audio", "picture", "colors", "title"], "a": 0, "why": "<b>audi</b> means <i>to hear</i>. The <b>audio</b> is the part you <i>hear</i> — it was too quiet, so they raised the volume."}, {"q": "Her whisper was barely ___ over the loud music.", "o": ["audible", "visible", "tasty", "soft"], "a": 0, "why": "<b>-ible</b> means <i>able to be</i>. <b>Audible</b> means able to be <i>heard</i> — the whisper could barely be heard over the music."}, {"q": "On the long drive, we listened to an ___ instead of reading.", "o": ["audiobook", "pillow", "lunch", "nap"], "a": 0, "why": "<b>Audio</b> means <i>heard</i>. An <b>audiobook</b> is a book you <i>hear</i> — you listen instead of reading."}, {"q": "The speaker's words were ___ from the back of the noisy gym.", "o": ["inaudible", "clear", "loud", "funny"], "a": 0, "why": "<b>in-</b> means <i>not</i>. <b>Inaudible</b> means <i>not</i> able to be <i>heard</i> — the noisy gym drowned out the words."}, {"q": "The company hired experts to ___ its money records.", "o": ["audit", "hide", "burn", "spend"], "a": 0, "why": "An <b>audit</b> comes from <i>auditus</i>, a formal <i>hearing</i>. To <b>audit</b> is to give the money records a careful hearing — experts check every dollar."}, {"q": "The ___ found a mistake in the school's lunch money count.", "o": ["auditor", "chef", "pilot", "actor"], "a": 0, "why": "<b>-or</b> means <i>one who</i>. An <b>auditor</b> is one who gives accounts a formal <i>hearing</i> — this one heard something wrong in the lunch money count."}, {"q": "The classroom's ___ cart holds a projector and speakers.", "o": ["audiovisual", "musical", "noisy", "silent"], "a": 0, "why": "<b>Audio</b> is what you <i>hear</i> and <b>visual</b> is what you see. <b>Audiovisual</b> gear covers both — the projector shows, the speakers sound."}, {"q": "She laughed ___ at the joke, and the whole room heard her.", "o": ["audibly", "quietly", "silently", "secretly"], "a": 0, "why": "<b>Audibly</b> comes from <b>audible</b> (able to be <i>heard</i>). She laughed in a way the whole room could <i>hear</i>."}, {"q": "The ___ owns six pairs of headphones and a huge speaker system.", "o": ["audiophile", "chef", "athlete", "pilot"], "a": 0, "why": "<b>-phile</b> means <i>lover</i>. An <b>audiophile</b> is a <i>lover</i> of <i>heard</i> sound — six headphones prove it."}, {"q": "The charity's books were ___ last year, and every dollar was accounted for.", "o": ["audited", "lost", "burned", "hidden"], "a": 0, "why": "To <b>audit</b> is to give records a formal <i>hearing</i>. The <b>audited</b> books were carefully heard and checked — every dollar accounted for."}, {"q": "___ a big company means giving its money records a formal hearing.", "o": ["auditing", "praising", "painting", "feeding"], "a": 0, "why": "An <b>audit</b> is a formal <i>hearing</i> of accounts. <b>Auditing</b> a company means <i>hearing</i> out its money records."}, {"q": "The ___ in the old hall was so poor that we missed half the play.", "o": ["audibility", "smell", "taste", "color"], "a": 0, "why": "<b>-ity</b> marks a <i>quality</i>. <b>Audibility</b> is the quality of being <i>heard</i> — poor hearing quality made them miss the play."}, {"q": "He muttered ___ under his breath so the teacher wouldn't hear.", "o": ["inaudibly", "loudly", "clearly", "proudly"], "a": 0, "why": "<b>in-</b> means <i>not</i>. He spoke <b>inaudibly</b> — <i>not</i> in a way to be <i>heard</i> — so the teacher wouldn't hear."}, {"q": "In an audit, the auditor asks the questions and the ___ answers them.", "o": ["auditee", "chef", "pilot", "actor"], "a": 0, "why": "<b>-ee</b> means <i>one who is</i> acted upon. The <b>auditee</b> is the one who <i>is heard</i> — the auditor asks, the auditee answers."}, {"q": "They had to ___ the votes when the first count looked wrong.", "o": ["reaudit", "celebrate", "ignore", "hide"], "a": 0, "why": "<b>re-</b> means <i>again</i>. To <b>reaudit</b> is to give the votes a formal <i>hearing again</i> — a second careful check."}, {"q": "The nurse showed Mom the ___ chart of my hearing test results.", "o": ["audiogram", "menu", "map", "ticket"], "a": 0, "why": "<b>-gram</b> means <i>something written</i>. An <b>audiogram</b> is the <i>written</i> record of what you <i>hear</i> — the nurse's hearing chart."}, {"q": "The ___ beeped at different pitches during my hearing test.", "o": ["audiometer", "stethoscope", "ruler", "scale"], "a": 0, "why": "<b>-meter</b> means <i>measurer</i>. An <b>audiometer</b> <i>measures</i> <i>hearing</i> — it beeps at pitches to test your ears."}, {"q": "An ___ learner remembers best by listening, not by reading.", "o": ["audile", "visual", "sleepy", "hungry"], "a": 0, "why": "<b>audi</b> means <i>to hear</i> and <b>-ile</b> means <i>relating to</i>. An <b>audile</b> learner relates to <i>hearing</i> — listening works best."}, {"q": "The dog whistle makes a ___ sound that humans cannot hear.", "o": ["subaudible", "loud", "pretty", "funny"], "a": 0, "why": "<b>sub-</b> means <i>under</i>. <b>Subaudible</b> is <i>under</i> what is <i>audible</i> — below human hearing, like the dog whistle."}, {"q": "Grandpa played an old ___ of his favorite radio show.", "o": ["audiotape", "photograph", "letter", "map"], "a": 0, "why": "<b>Audio</b> means <i>heard</i>. An <b>audiotape</b> holds <i>heard</i> sound on tape — Grandpa played the old recording."}];
const KEY = "wr11-quiz-best";
const ROOTW = "audi";
const EMOJI = "\ud83d\udc42";
let order, idx, score, answered;
function best(){ try{ return JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){ return null; } }

function shuffle(a){
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function renderDots(){
  const d = document.getElementById("dots"); d.innerHTML = "";
  order.forEach((q,i)=>{
    const s = document.createElement("div"); s.className = "dot"; s.textContent = i+1;
    if(i < answered.length) s.classList.add(answered[i] ? "right" : "wrong");
    if(i === idx) s.classList.add("now");
    d.appendChild(s);
  });
}
function render(){
  renderDots();
  const q = QS[order[idx]];
  document.getElementById("qn").textContent = "Question " + (idx+1) + " of 20";
  document.getElementById("qq").textContent = q.q;
  const opts = document.getElementById("opts"); opts.innerHTML = "";
  const why = document.getElementById("why"); why.classList.remove("show"); why.innerHTML = "";
  const next = document.getElementById("nextBtn"); next.disabled = true;
  next.textContent = (idx === order.length-1) ? "See my score \u2192" : "Next \u2192";
  const oidx = shuffle(q.o.map((_,i)=>i));
  oidx.forEach((oi)=>{
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = q.o[oi];
    b.onclick = ()=>{
      const ok = (oi === q.a);
      [...opts.children].forEach((x,k)=>{
        x.disabled = true;
        if(oidx[k] === q.a) x.classList.add("right");
      });
      if(!ok) b.classList.add("wrong"); else score++;
      answered.push(ok);
      document.getElementById("score").textContent = score;
      why.innerHTML = (ok ? "\u2705 Correct! " : "\u274C Not quite. ") + q.why;
      why.classList.add("show");
      next.disabled = false;
      renderDots();
    };
    opts.appendChild(b);
  });
}
document.getElementById("nextBtn").onclick = ()=>{
  if(idx < order.length-1){ idx++; render(); window.scrollTo({top:0,behavior:"smooth"}); }
  else finish();
};
function finish(){
  document.getElementById("qcard").classList.add("hidden");
  document.getElementById("dots").classList.add("hidden");
  const f = document.getElementById("final"); f.classList.remove("hidden");
  document.getElementById("fscore").textContent = score;
  const b = best();
  const nb = (b===null || score > b) ? score : b;
  localStorage.setItem(KEY, JSON.stringify(nb));
  document.getElementById("fbest").textContent = nb + " / 20";
  const msg = score===20 ? "Perfect! You are a true word-root master! \U0001F3C6"
    : score>=16 ? "Excellent! The "+ROOTW+" words are really sticking! "+EMOJI
    : score>=12 ? "Good job! Review the ones you missed and try again."
    : "Good start! Go back to the lesson, then try again \u2014 you've got this! \U0001F4AA";
  document.getElementById("fmsg").textContent = msg;
  document.getElementById("femoji").textContent = score===20 ? "\U0001F3C6" : score>=12 ? "\U0001F31F" : "\U0001F331";
  window.scrollTo({top:0,behavior:"smooth"});
}
function restart(){
  order = shuffle(QS.map((_,i)=>i));
  idx = 0; score = 0; answered = [];
  document.getElementById("score").textContent = "0";
  document.getElementById("final").classList.add("hidden");
  document.getElementById("qcard").classList.remove("hidden");
  document.getElementById("dots").classList.remove("hidden");
  render();
}
(function init(){
  const b = best();
  document.getElementById("best").textContent = b===null ? "\u2013" : b + " / 20";
  restart();
})();

</script>
</body>
</html>
