<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lesson 1 Quiz | Word Roots Beginning</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         margin: 0; background: #f6f9f4; color: #1e293b; line-height: 1.6; }
  header { background: linear-gradient(135deg, #15803d, #4ade80); color: #fff;
         padding: 30px 20px; text-align: center; }
  header h1 { margin: 6px 0 4px; font-size: 1.8rem; }
  header p { margin: 0; opacity: .92; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 24px 22px 60px; }
  .hud { background: #fff; border: 1px solid #bbf7d0; border-radius: 14px; padding: 12px 18px;
         margin: -24px auto 20px; max-width: 1000px; display: flex; justify-content: space-between;
         align-items: center; box-shadow: 0 4px 14px rgba(22,163,74,.10); font-weight: 700; flex-wrap: wrap; gap: 8px; }
  .hud .links { display: flex; gap: 8px; }
  .dots { display: flex; flex-wrap: wrap; gap: 5px; margin: 0 0 20px; }
  .dot { width: 22px; height: 22px; border-radius: 50%; background: #e2e8f0; font-size: .7rem;
         display: flex; align-items: center; justify-content: center; color: #94a3b8; font-weight: 700; }
  .dot.right { background: #16a34a; color: #fff; }
  .dot.wrong { background: #ef4444; color: #fff; }
  .dot.now { outline: 3px solid #86efac; }
  .qcard { background: #fff; border: 1px solid #e2e8f0; border-radius: 18px; padding: 26px;
         box-shadow: 0 2px 10px rgba(30,41,59,.06); }
  .qcard .qn { font-size: .85rem; color: #94a3b8; font-weight: 700; text-transform: uppercase;
         letter-spacing: .05em; }
  .qcard h2 { margin: 6px 0 18px; font-size: 1.3rem; }
  .opt { display: block; width: 100%; text-align: left; border: 2px solid #e2e8f0; background: #fff;
         border-radius: 12px; padding: 13px 16px; margin: 0 0 10px; font-size: 1rem; font-weight: 600;
         cursor: pointer; transition: all .15s; }
  .opt:hover:not(:disabled) { border-color: #86efac; background: #f0fdf4; }
  .opt.right { border-color: #16a34a; background: #dcfce7; color: #14532d; }
  .opt.wrong { border-color: #ef4444; background: #fef2f2; color: #991b1b; }
  .opt:disabled { cursor: default; }
  .why { display: none; margin-top: 14px; background: #f0fdf4; border-left: 5px solid #16a34a;
         border-radius: 0 12px 12px 0; padding: 12px 16px; font-size: .94rem; }
  .why.show { display: block; }
  .why b { color: #166534; }
  .navrow { display: flex; justify-content: space-between; margin-top: 20px; }
  .bigbtn { background: #16a34a; color: #fff; border: none; border-radius: 12px; padding: 12px 28px;
         font-size: 1rem; font-weight: 800; cursor: pointer; }
  .bigbtn:hover { background: #15803d; }
  .bigbtn:disabled { background: #cbd5e1; cursor: default; }
  .ghostbtn { background: #fff; color: #475569; border: 2px solid #cbd5e1; border-radius: 12px;
         padding: 10px 22px; font-size: .95rem; font-weight: 700; cursor: pointer; text-decoration: none; }
  .final { text-align: center; background: #fff; border-radius: 18px; padding: 36px 24px;
         border: 1px solid #e2e8f0; }
  .final .score { font-size: 3.4rem; font-weight: 900; color: #16a34a; margin: 8px 0; }
  .hidden { display: none; }
  footer { text-align: center; color: #94a3b8; font-size: .82rem; margin-top: 24px; }
  footer a { color: #16a34a; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<header>
  <div style="font-size:2.2rem">🎯</div>
  <h1>Lesson 1 Quiz</h1>
  <p>Guess each meaning from the word parts &middot; 20 questions</p>
</header>

<div class="wrap">
  <div class="hud">
    <span>Score: <span id="score">0</span> / 20</span>
    <span>Best: <span id="best">–</span></span>
    <span class="links">
      <a href="index.html" class="ghostbtn" style="padding:6px 14px;font-size:.82rem">← Lesson</a>
      <a href="../index.html" class="ghostbtn" style="padding:6px 14px;font-size:.82rem">🏠 Home</a>
    </span>
  </div>
  <div class="dots" id="dots"></div>

  <div class="qcard" id="qcard">
    <div class="qn" id="qn"></div>
    <h2 id="qq"></h2>
    <div id="opts"></div>
    <div class="why" id="why"></div>
    <div class="navrow">
      <span></span>
      <button class="bigbtn" id="nextBtn" disabled>Next →</button>
    </div>
  </div>

  <div class="final hidden" id="final">
    <div style="font-size:3rem" id="femoji">🌟</div>
    <h2 style="margin:6px 0">Quiz finished!</h2>
    <div class="score"><span id="fscore">0</span> / 20</div>
    <p id="fmsg" style="color:#64748b"></p>
    <p style="color:#94a3b8;font-size:.9rem">Best score: <b id="fbest">–</b></p>
    <button class="bigbtn" onclick="restart()">Try Again (shuffled)</button>
    <a href="index.html" class="ghostbtn" style="margin-left:8px">Back to Lesson 1</a>
  </div>

  <footer>Based on <i>Word Roots Beginning</i> &copy; 2012 The Critical Thinking Co. &middot; Made for Alex 🌱<br/><a href="../index.html">🏠 Word Roots Home</a></footer>
</div>

<script>

const QS = [{"q": "We watched the big game on ___ last night.", "o": ["television", "radio", "camera", "speaker"], "a": 0, "why": "tele- means 'far' - a television brings far-away pictures and sounds into your living room, which is why you can watch a game happening in another city."}, {"q": "Grandma keeps a ___ of our family picnic on her fridge.", "o": ["photograph", "painting", "drawing", "letter"], "a": 0, "why": "photo- means 'light' and -graph means 'to draw' - a camera literally draws with light, so the picture on the fridge is a photograph."}, {"q": "Mom heated my soup in the ___ for two minutes.", "o": ["microwave", "freezer", "toaster", "stove"], "a": 0, "why": "micro- means 'small' - a microwave cooks with very small waves, and the soup got hot in just two minutes, which is what this fast oven does."}, {"q": "The singer held the ___ close and sang into it.", "o": ["microphone", "guitar", "camera", "speaker"], "a": 0, "why": "micro- means 'small' and phone means 'sound' - it picks up even small sounds, and the singer sang into it, so it must be a microphone."}, {"q": "Start a new ___ every time a different person starts talking in your story.", "o": ["paragraph", "sentence", "chapter", "page"], "a": 0, "why": "para- means 'beside' and -graph means 'to write' - a paragraph is a block of writing set beside the others, and starting a new one when the speaker changes is exactly what writers do."}, {"q": "The baseball player signed an ___ on my cap after the game.", "o": ["autograph", "ticket", "poster", "photograph"], "a": 0, "why": "auto- means 'self' and -graph means 'to write' - the player wrote it himself, so his own signature is an autograph."}, {"q": "The race is five ___ long, so the runners train for months.", "o": ["kilometer", "meters", "grams", "liters"], "a": 0, "why": "kilo- means 'thousand' and meter means 'to measure' - a race measured in five thousand-meter units is five kilometers."}, {"q": "The beetle is only two ___ long - smaller than my fingernail.", "o": ["centimeter", "kilometers", "inches", "meters"], "a": 0, "why": "centi- means 'hundredth' and meter means 'to measure' - a beetle smaller than a fingernail needs a tiny unit, so centimeters fit."}, {"q": "The ant is just three ___ long; you need a magnifying glass to see it well.", "o": ["millimeter", "centimeters", "meters", "inches"], "a": 0, "why": "milli- means 'thousandth' and meter means 'to measure' - an ant needs an even tinier unit than centimeters, so millimeters fit."}, {"q": "In ___ class we learned how volcanoes and earthquakes happen.", "o": ["geology", "biology", "history", "math"], "a": 0, "why": "geo- means 'earth' and -logy means 'study of' - volcanoes and earthquakes are all about the earth, so this class is geology."}, {"q": "We walked the ___ of the soccer field to warm up.", "o": ["perimeter", "middle", "center", "corner"], "a": 0, "why": "peri- means 'around' and meter means 'to measure' - walking all the way around the field is walking its perimeter."}, {"q": "The ___ of the pizza is 16 inches, so it barely fits in the box.", "o": ["diameter", "crust", "topping", "slice"], "a": 0, "why": "dia- means 'across' and meter means 'to measure' - the straight line measured across the whole round pizza is its diameter."}, {"q": "In ___ we learned why planets orbit the sun.", "o": ["astronomy", "geology", "biology", "history"], "a": 0, "why": "astro- means 'star' - learning about planets and how they move around the sun is the study of stars and space, which is astronomy."}, {"q": "I read a ___ about Marie Curie and her amazing discoveries.", "o": ["biography", "novel", "comic", "diary"], "a": 0, "why": "bio- means 'life' and -graphy means 'to write' - a written story of Marie Curie's life is a biography."}, {"q": "Dad glanced at the ___ and slowed down - it said 75.", "o": ["speedometer", "radio", "mirror", "steering wheel"], "a": 0, "why": "meter means 'to measure' - the dial that measures speed is the speedometer, which is why Dad slowed down when it read 75."}, {"q": "The dinosaurs lived during a ___ that lasted millions of years.", "o": ["period", "second", "minute", "moment"], "a": 0, "why": "peri- means 'around' - a period is time going around in a full cycle, and the dinosaurs' time lasted millions of years, far longer than a second or a minute."}, {"q": "Long ago, people sent urgent news by ___, tapping out coded messages over wires.", "o": ["telegraph", "letter", "radio", "newspaper"], "a": 0, "why": "tele- means 'far' and -graph means 'to write' - writing messages that travel far over wires is exactly what the telegraph did long ago."}, {"q": "My ___ says this will be a lucky week for me.", "o": ["horoscope", "calendar", "clock", "map"], "a": 0, "why": "horo- means 'hour' and -scope means 'looker' - it 'looks at' the hour you were born to predict your luck, so it must be a horoscope."}, {"q": "The doctor put the ___ on my chest to listen to my heartbeat.", "o": ["stethoscope", "bandage", "syringe", "cotton swab"], "a": 0, "why": "stetho- means 'chest' and -scope means 'looker' - doctors use it to check what is happening inside your chest, and listening to a heartbeat is exactly that."}, {"q": "When I turn the ___, the colored glass makes new pretty patterns.", "o": ["kaleidoscope", "camera", "mirror", "flashlight"], "a": 0, "why": "-scope means 'looker' and the first parts mean 'beautiful forms' - turning it makes new pretty patterns you look at, so it is a kaleidoscope."}];
const KEY = "wr1-quiz-best";
const ROOTW = "peri-, micro, scope, tele, acro, astro, geo, thermo, bat, graphy, meter, naut";
const EMOJI = "\ud83c\udf31";
let order, idx, score, answered;
function best(){ try{ return JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){ return null; } }

function shuffle(a){
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function renderDots(){
  const d = document.getElementById("dots"); d.innerHTML = "";
  order.forEach((q,i)=>{
    const s = document.createElement("div"); s.className = "dot"; s.textContent = i+1;
    if(i < answered.length) s.classList.add(answered[i] ? "right" : "wrong");
    if(i === idx) s.classList.add("now");
    d.appendChild(s);
  });
}
function render(){
  renderDots();
  const q = QS[order[idx]];
  document.getElementById("qn").textContent = "Question " + (idx+1) + " of 20";
  document.getElementById("qq").textContent = q.q;
  const opts = document.getElementById("opts"); opts.innerHTML = "";
  const why = document.getElementById("why"); why.classList.remove("show"); why.innerHTML = "";
  const next = document.getElementById("nextBtn"); next.disabled = true;
  next.textContent = (idx === order.length-1) ? "See my score \u2192" : "Next \u2192";
  const oidx = shuffle(q.o.map((_,i)=>i));
  oidx.forEach((oi)=>{
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = q.o[oi];
    b.onclick = ()=>{
      const ok = (oi === q.a);
      [...opts.children].forEach((x,k)=>{
        x.disabled = true;
        if(oidx[k] === q.a) x.classList.add("right");
      });
      if(!ok) b.classList.add("wrong"); else score++;
      answered.push(ok);
      document.getElementById("score").textContent = score;
      why.innerHTML = (ok ? "\u2705 Correct! " : "\u274C Not quite. ") + q.why;
      why.classList.add("show");
      next.disabled = false;
      renderDots();
    };
    opts.appendChild(b);
  });
}
document.getElementById("nextBtn").onclick = ()=>{
  if(idx < order.length-1){ idx++; render(); window.scrollTo({top:0,behavior:"smooth"}); }
  else finish();
};
function finish(){
  document.getElementById("qcard").classList.add("hidden");
  document.getElementById("dots").classList.add("hidden");
  const f = document.getElementById("final"); f.classList.remove("hidden");
  document.getElementById("fscore").textContent = score;
  const b = best();
  const nb = (b===null || score > b) ? score : b;
  localStorage.setItem(KEY, JSON.stringify(nb));
  document.getElementById("fbest").textContent = nb + " / 20";
  const msg = score===20 ? "Perfect! You are a true word-root master! \U0001F3C6"
    : score>=16 ? "Excellent! The "+ROOTW+" words are really sticking! "+EMOJI
    : score>=12 ? "Good job! Review the ones you missed and try again."
    : "Good start! Go back to the lesson, then try again \u2014 you've got this! \U0001F4AA";
  document.getElementById("fmsg").textContent = msg;
  document.getElementById("femoji").textContent = score===20 ? "\U0001F3C6" : score>=12 ? "\U0001F31F" : "\U0001F331";
  window.scrollTo({top:0,behavior:"smooth"});
}
function restart(){
  order = shuffle(QS.map((_,i)=>i));
  idx = 0; score = 0; answered = [];
  document.getElementById("score").textContent = "0";
  document.getElementById("final").classList.add("hidden");
  document.getElementById("qcard").classList.remove("hidden");
  document.getElementById("dots").classList.remove("hidden");
  render();
}
(function init(){
  const b = best();
  document.getElementById("best").textContent = b===null ? "\u2013" : b + " / 20";
  restart();
})();

</script>
</body>
</html>
