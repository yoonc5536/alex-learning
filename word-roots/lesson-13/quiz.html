<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lesson 13 Quiz | Word Roots Beginning</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         margin: 0; background: #f6f9f4; color: #1e293b; line-height: 1.6; }
  header { background: linear-gradient(135deg, #15803d, #4ade80); color: #fff;
         padding: 30px 20px; text-align: center; }
  header h1 { margin: 6px 0 4px; font-size: 1.8rem; }
  header p { margin: 0; opacity: .92; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 24px 22px 60px; }
  .hud { background: #fff; border: 1px solid #bbf7d0; border-radius: 14px; padding: 12px 18px;
         margin: -24px auto 20px; max-width: 1000px; display: flex; justify-content: space-between;
         align-items: center; box-shadow: 0 4px 14px rgba(22,163,74,.10); font-weight: 700; flex-wrap: wrap; gap: 8px; }
  .hud .links { display: flex; gap: 8px; }
  .dots { display: flex; flex-wrap: wrap; gap: 5px; margin: 0 0 20px; }
  .dot { width: 22px; height: 22px; border-radius: 50%; background: #e2e8f0; font-size: .7rem;
         display: flex; align-items: center; justify-content: center; color: #94a3b8; font-weight: 700; }
  .dot.right { background: #16a34a; color: #fff; }
  .dot.wrong { background: #ef4444; color: #fff; }
  .dot.now { outline: 3px solid #86efac; }
  .qcard { background: #fff; border: 1px solid #e2e8f0; border-radius: 18px; padding: 26px;
         box-shadow: 0 2px 10px rgba(30,41,59,.06); }
  .qcard .qn { font-size: .85rem; color: #94a3b8; font-weight: 700; text-transform: uppercase;
         letter-spacing: .05em; }
  .qcard h2 { margin: 6px 0 18px; font-size: 1.3rem; }
  .opt { display: block; width: 100%; text-align: left; border: 2px solid #e2e8f0; background: #fff;
         border-radius: 12px; padding: 13px 16px; margin: 0 0 10px; font-size: 1rem; font-weight: 600;
         cursor: pointer; transition: all .15s; }
  .opt:hover:not(:disabled) { border-color: #86efac; background: #f0fdf4; }
  .opt.right { border-color: #16a34a; background: #dcfce7; color: #14532d; }
  .opt.wrong { border-color: #ef4444; background: #fef2f2; color: #991b1b; }
  .opt:disabled { cursor: default; }
  .why { display: none; margin-top: 14px; background: #f0fdf4; border-left: 5px solid #16a34a;
         border-radius: 0 12px 12px 0; padding: 12px 16px; font-size: .94rem; }
  .why.show { display: block; }
  .why b { color: #166534; }
  .navrow { display: flex; justify-content: space-between; margin-top: 20px; }
  .bigbtn { background: #16a34a; color: #fff; border: none; border-radius: 12px; padding: 12px 28px;
         font-size: 1rem; font-weight: 800; cursor: pointer; }
  .bigbtn:hover { background: #15803d; }
  .bigbtn:disabled { background: #cbd5e1; cursor: default; }
  .ghostbtn { background: #fff; color: #475569; border: 2px solid #cbd5e1; border-radius: 12px;
         padding: 10px 22px; font-size: .95rem; font-weight: 700; cursor: pointer; text-decoration: none; }
  .final { text-align: center; background: #fff; border-radius: 18px; padding: 36px 24px;
         border: 1px solid #e2e8f0; }
  .final .score { font-size: 3.4rem; font-weight: 900; color: #16a34a; margin: 8px 0; }
  .hidden { display: none; }
  footer { text-align: center; color: #94a3b8; font-size: .82rem; margin-top: 24px; }
  footer a { color: #16a34a; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<header>
  <div style="font-size:2.2rem">🎯</div>
  <h1>Lesson 13 Quiz</h1>
  <p>Guess each meaning from the word parts &middot; 20 questions</p>
</header>

<div class="wrap">
  <div class="hud">
    <span>Score: <span id="score">0</span> / 20</span>
    <span>Best: <span id="best">–</span></span>
    <span class="links">
      <a href="index.html" class="ghostbtn" style="padding:6px 14px;font-size:.82rem">← Lesson</a>
      <a href="../index.html" class="ghostbtn" style="padding:6px 14px;font-size:.82rem">🏠 Home</a>
    </span>
  </div>
  <div class="dots" id="dots"></div>

  <div class="qcard" id="qcard">
    <div class="qn" id="qn"></div>
    <h2 id="qq"></h2>
    <div id="opts"></div>
    <div class="why" id="why"></div>
    <div class="navrow">
      <span></span>
      <button class="bigbtn" id="nextBtn" disabled>Next →</button>
    </div>
  </div>

  <div class="final hidden" id="final">
    <div style="font-size:3rem" id="femoji">🌟</div>
    <h2 style="margin:6px 0">Quiz finished!</h2>
    <div class="score"><span id="fscore">0</span> / 20</div>
    <p id="fmsg" style="color:#64748b"></p>
    <p style="color:#94a3b8;font-size:.9rem">Best score: <b id="fbest">–</b></p>
    <button class="bigbtn" onclick="restart()">Try Again (shuffled)</button>
    <a href="index.html" class="ghostbtn" style="margin-left:8px">Back to Lesson 13</a>
  </div>

  <footer>Based on <i>Word Roots Beginning</i> &copy; 2012 The Critical Thinking Co. &middot; Made for Alex 🌱<br/><a href="../index.html">🏠 Word Roots Home</a></footer>
</div>

<script>

const QS = [{"q": "The neighbors will ___ to help us move the heavy boxes on Saturday.", "o": ["offer", "differ", "suffer", "infer"], "a": 0, "why": "<b>of-</b> means <i>toward</i>. To <b>offer</b> is to carry something <i>toward</i> someone — the neighbors carry their help toward us."}, {"q": "I ___ juice over soda because it is less sweet.", "o": ["prefer", "defer", "proffer", "refer"], "a": 0, "why": "<b>pre-</b> means <i>before</i>. To <b>prefer</b> juice is to carry it <i>before</i> soda in your heart — you put it first."}, {"q": "The teacher will ___ us to a fun website about volcanoes.", "o": ["refer", "defer", "infer", "proffer"], "a": 0, "why": "<b>re-</b> means <i>back</i>. To <b>refer</b> is to carry someone <i>back</i> to a source — the teacher sends us back to the website."}, {"q": "Twins may look alike, but their personalities often ___.", "o": ["differ", "suffer", "offer", "prefer"], "a": 0, "why": "<b>dis-</b> means <i>apart</i>. To <b>differ</b> is to carry <i>apart</i> — their personalities stand apart from each other."}, {"q": "The lost puppy will ___ in the cold if no one takes it inside.", "o": ["suffer", "differ", "offer", "defer"], "a": 0, "why": "<b>sub-</b> means <i>under</i>. To <b>suffer</b> is to bear something heavy <i>under</i> which you cannot escape — the puppy bears the cold."}, {"q": "Can you spot the ___ between these two pictures?", "o": ["difference", "suffering", "inference", "preference"], "a": 0, "why": "It comes from <b>differ</b> (to carry <i>apart</i>) + <b>-ence</b> (a state). The <b>difference</b> is the state of standing apart."}, {"q": "The wet ground and dark clouds helped us ___ that it had rained.", "o": ["infer", "refer", "defer", "proffer"], "a": 0, "why": "<b>in-</b> means <i>in</i>. To <b>infer</b> is to carry <i>in</i> clues — the wet ground and clouds — and figure out what happened."}, {"q": "We had to ___ our picnic because of the thunderstorm.", "o": ["defer", "prefer", "refer", "infer"], "a": 0, "why": "<b>de-</b> means <i>away</i>. To <b>defer</b> the picnic is to carry it <i>away</i> to another day."}, {"q": "The museum is ___ free tours every Sunday morning.", "o": ["offering", "suffering", "differing", "inferring"], "a": 0, "why": "It comes from <b>offer</b> + <b>-ing</b> (an act). The museum is in the act of carrying its tours <i>toward</i> visitors."}, {"q": "Her ___ seat is by the window, where she can see the clouds.", "o": ["preferred", "deferred", "referred", "suffered"], "a": 0, "why": "<b>pre-</b> means <i>before</i>. Her <b>preferred</b> seat is the one she carries <i>before</i> all others — her favorite."}, {"q": "The ___ blew the whistle when the player touched the ball with his hands.", "o": ["referee", "sufferer", "offering", "infer"], "a": 0, "why": "It comes from <b>refer</b> + <b>-ee</b> (one who is __ed). Players <b>refer</b> disputes <i>back</i> to the <b>referee</b>, who decides."}, {"q": "The vet worked quickly to ease the injured bird's ___.", "o": ["suffering", "offering", "difference", "deference"], "a": 0, "why": "It comes from <b>suffer</b> + <b>-ing</b> (an act). The bird's <b>suffering</b> is the pain it bears."}, {"q": "From the muddy footprints, my ___ was that the dog had been in the kitchen.", "o": ["inference", "preference", "difference", "deference"], "a": 0, "why": "<b>in-</b> means <i>in</i>. An <b>inference</b> is what you figure out after carrying clues <i>in</i> — the footprints carried the answer in."}, {"q": "Mom got a ___ from our dentist to see a tooth specialist.", "o": ["referral", "deferral", "offering", "suffering"], "a": 0, "why": "It comes from <b>refer</b> + <b>-al</b> (an act). A <b>referral</b> is the act of carrying you <i>back</i> (<b>re-</b>) to another doctor."}, {"q": "My ___ for reading is adventure books, not scary ones.", "o": ["preference", "difference", "indifference", "suffering"], "a": 0, "why": "It comes from <b>prefer</b> + <b>-ence</b> (a state). A <b>preference</b> is the state of carrying one thing <i>before</i> (<b>pre-</b>) another."}, {"q": "It is ___ to wear a helmet than to risk getting hurt.", "o": ["preferable", "sufferable", "deferrable", "inferable"], "a": 0, "why": "<b>-able</b> means <i>able to be</i>. The helmet is <b>preferable</b> because safety can be carried <i>before</i> (<b>pre-</b>) the risk."}, {"q": "Out of ___, the children let the elderly man board the bus first.", "o": ["deference", "indifference", "difference", "suffering"], "a": 0, "why": "<b>de-</b> means <i>away</i>. <b>Deference</b> is carrying your own wishes <i>away</i> so someone else can go first."}, {"q": "The ___ of a bad cold should drink lots of water and rest.", "o": ["sufferer", "referee", "offeror", "deferrer"], "a": 0, "why": "<b>-er</b> means <i>one who</i>. A <b>sufferer</b> is one who bears (<b>sub-</b> + <b>fer</b>) the pain of the cold."}, {"q": "The kind stranger would ___ his umbrella to anyone caught in the rain.", "o": ["proffer", "defer", "infer", "differ"], "a": 0, "why": "<b>pro-</b> means <i>forth</i>. To <b>proffer</b> is to carry something <i>forth</i> — the stranger carries his umbrella forth to share."}, {"q": "His ___ to the game was clear; he did not even look up from his book.", "o": ["indifference", "difference", "preference", "deference"], "a": 0, "why": "<b>in-</b> means <i>not</i>. <b>Indifference</b> is <i>not</i> seeing any <b>difference</b> worth caring about — he feels no pull toward the game."}];
const KEY = "wr13-quiz-best";
const ROOTW = "fer";
const EMOJI = "\ud83c\udf92";
let order, idx, score, answered;
function best(){ try{ return JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){ return null; } }

function shuffle(a){
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function renderDots(){
  const d = document.getElementById("dots"); d.innerHTML = "";
  order.forEach((q,i)=>{
    const s = document.createElement("div"); s.className = "dot"; s.textContent = i+1;
    if(i < answered.length) s.classList.add(answered[i] ? "right" : "wrong");
    if(i === idx) s.classList.add("now");
    d.appendChild(s);
  });
}
function render(){
  renderDots();
  const q = QS[order[idx]];
  document.getElementById("qn").textContent = "Question " + (idx+1) + " of 20";
  document.getElementById("qq").textContent = q.q;
  const opts = document.getElementById("opts"); opts.innerHTML = "";
  const why = document.getElementById("why"); why.classList.remove("show"); why.innerHTML = "";
  const next = document.getElementById("nextBtn"); next.disabled = true;
  next.textContent = (idx === order.length-1) ? "See my score \u2192" : "Next \u2192";
  const oidx = shuffle(q.o.map((_,i)=>i));
  oidx.forEach((oi)=>{
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = q.o[oi];
    b.onclick = ()=>{
      const ok = (oi === q.a);
      [...opts.children].forEach((x,k)=>{
        x.disabled = true;
        if(oidx[k] === q.a) x.classList.add("right");
      });
      if(!ok) b.classList.add("wrong"); else score++;
      answered.push(ok);
      document.getElementById("score").textContent = score;
      why.innerHTML = (ok ? "\u2705 Correct! " : "\u274C Not quite. ") + q.why;
      why.classList.add("show");
      next.disabled = false;
      renderDots();
    };
    opts.appendChild(b);
  });
}
document.getElementById("nextBtn").onclick = ()=>{
  if(idx < order.length-1){ idx++; render(); window.scrollTo({top:0,behavior:"smooth"}); }
  else finish();
};
function finish(){
  document.getElementById("qcard").classList.add("hidden");
  document.getElementById("dots").classList.add("hidden");
  const f = document.getElementById("final"); f.classList.remove("hidden");
  document.getElementById("fscore").textContent = score;
  const b = best();
  const nb = (b===null || score > b) ? score : b;
  localStorage.setItem(KEY, JSON.stringify(nb));
  document.getElementById("fbest").textContent = nb + " / 20";
  const msg = score===20 ? "Perfect! You are a true word-root master! \U0001F3C6"
    : score>=16 ? "Excellent! The "+ROOTW+" words are really sticking! "+EMOJI
    : score>=12 ? "Good job! Review the ones you missed and try again."
    : "Good start! Go back to the lesson, then try again \u2014 you've got this! \U0001F4AA";
  document.getElementById("fmsg").textContent = msg;
  document.getElementById("femoji").textContent = score===20 ? "\U0001F3C6" : score>=12 ? "\U0001F31F" : "\U0001F331";
  window.scrollTo({top:0,behavior:"smooth"});
}
function restart(){
  order = shuffle(QS.map((_,i)=>i));
  idx = 0; score = 0; answered = [];
  document.getElementById("score").textContent = "0";
  document.getElementById("final").classList.add("hidden");
  document.getElementById("qcard").classList.remove("hidden");
  document.getElementById("dots").classList.remove("hidden");
  render();
}
(function init(){
  const b = best();
  document.getElementById("best").textContent = b===null ? "\u2013" : b + " / 20";
  restart();
})();

</script>
</body>
</html>
