<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lesson 13 Quiz | Word Roots Beginning</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         margin: 0; background: #f6f9f4; color: #1e293b; line-height: 1.6; }
  header { background: linear-gradient(135deg, #15803d, #4ade80); color: #fff;
         padding: 30px 20px; text-align: center; }
  header h1 { margin: 6px 0 4px; font-size: 1.8rem; }
  header p { margin: 0; opacity: .92; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 24px 22px 60px; }
  .hud { background: #fff; border: 1px solid #bbf7d0; border-radius: 14px; padding: 12px 18px;
         margin: -24px auto 20px; max-width: 1000px; display: flex; justify-content: space-between;
         align-items: center; box-shadow: 0 4px 14px rgba(22,163,74,.10); font-weight: 700; }
  .dots { display: flex; flex-wrap: wrap; gap: 5px; margin: 0 0 20px; }
  .dot { width: 22px; height: 22px; border-radius: 50%; background: #e2e8f0; font-size: .7rem;
         display: flex; align-items: center; justify-content: center; color: #94a3b8; font-weight: 700; }
  .dot.right { background: #16a34a; color: #fff; }
  .dot.wrong { background: #ef4444; color: #fff; }
  .dot.now { outline: 3px solid #86efac; }
  .qcard { background: #fff; border: 1px solid #e2e8f0; border-radius: 18px; padding: 26px;
         box-shadow: 0 2px 10px rgba(30,41,59,.06); }
  .qcard .qn { font-size: .85rem; color: #94a3b8; font-weight: 700; text-transform: uppercase;
         letter-spacing: .05em; }
  .qcard h2 { margin: 6px 0 18px; font-size: 1.3rem; }
  .opt { display: block; width: 100%; text-align: left; border: 2px solid #e2e8f0; background: #fff;
         border-radius: 12px; padding: 13px 16px; margin: 0 0 10px; font-size: 1rem; font-weight: 600;
         cursor: pointer; transition: all .15s; }
  .opt:hover:not(:disabled) { border-color: #86efac; background: #f0fdf4; }
  .opt.right { border-color: #16a34a; background: #dcfce7; color: #14532d; }
  .opt.wrong { border-color: #ef4444; background: #fef2f2; color: #991b1b; }
  .opt:disabled { cursor: default; }
  .why { display: none; margin-top: 14px; background: #f0fdf4; border-left: 5px solid #16a34a;
         border-radius: 0 12px 12px 0; padding: 12px 16px; font-size: .94rem; }
  .why.show { display: block; }
  .why b { color: #166534; }
  .navrow { display: flex; justify-content: space-between; margin-top: 20px; }
  .bigbtn { background: #16a34a; color: #fff; border: none; border-radius: 12px; padding: 12px 28px;
         font-size: 1rem; font-weight: 800; cursor: pointer; }
  .bigbtn:hover { background: #15803d; }
  .bigbtn:disabled { background: #cbd5e1; cursor: default; }
  .ghostbtn { background: #fff; color: #475569; border: 2px solid #cbd5e1; border-radius: 12px;
         padding: 10px 22px; font-size: .95rem; font-weight: 700; cursor: pointer; text-decoration: none; }
  .final { text-align: center; background: #fff; border-radius: 18px; padding: 36px 24px;
         border: 1px solid #e2e8f0; }
  .final .score { font-size: 3.4rem; font-weight: 900; color: #16a34a; margin: 8px 0; }
  .hidden { display: none; }
  footer a { color: #16a34a; font-weight: 700; text-decoration: none; }
  footer { text-align: center; color: #94a3b8; font-size: .82rem; margin-top: 24px; }
</style>
</head>
<body>
<header>
  <div style="font-size:2.2rem">🎯</div>
  <h1>Lesson 13 Quiz</h1>
  <p>Use the prefixes, root, and suffixes to figure out each meaning &middot; 20 questions</p>
</header>

<div class="wrap">
  <div class="hud">
    <span>Score: <span id="score">0</span> / 20</span>
    <span>Best: <span id="best">–</span></span>
    <a href="index.html" class="ghostbtn" style="padding:6px 14px;font-size:.82rem">← Lesson</a>
      <a href="../index.html" class="ghostbtn" style="padding:6px 14px;font-size:.82rem">🏠 Home</a>
  </div>
  <div class="dots" id="dots"></div>

  <div class="qcard" id="qcard">
    <div class="qn" id="qn"></div>
    <h2 id="qq"></h2>
    <div id="opts"></div>
    <div class="why" id="why"></div>
    <div class="navrow">
      <span></span>
      <button class="bigbtn" id="nextBtn" disabled>Next →</button>
    </div>
  </div>

  <div class="final hidden" id="final">
    <div style="font-size:3rem" id="femoji">🌟</div>
    <h2 style="margin:6px 0">Quiz finished!</h2>
    <div class="score"><span id="fscore">0</span> / 20</div>
    <p id="fmsg" style="color:#64748b"></p>
    <p style="color:#94a3b8;font-size:.9rem">Best score: <b id="fbest">–</b></p>
    <button class="bigbtn" onclick="restart()">Try Again (shuffled)</button>
    <a href="index.html" class="ghostbtn" style="margin-left:8px">Back to Lesson 13</a>
  </div>

  <footer>Based on <i>Word Roots Beginning</i> &copy; 2012 The Critical Thinking Co. &middot; Made for Alex 🌱<br/><a href="../index.html">🏠 Word Roots Home</a></footer>
</div>

<script>
const QS = [
 {q:"What does the root “fer” mean?",
  o:["to say, speak","through, across, beyond","to carry, bear, produce","like, relating to"], a:2,
  why:"<b>fer</b> = to carry, bear, produce — it carries all six words in this lesson."},
 {q:"What does the prefix “con-” mean?",
  o:["with, together","not","back, again","through, across, beyond"], a:0,
  why:"<b>con-</b> = with, together — as in confer: talk WITH another person to produce a decision."},
 {q:"What does the prefix “in-” mean?",
  o:["with, together","in, into; not","able to be","back, again"], a:1,
  why:"<b>in-</b> = in, into; not — in infertile it means NOT."},
 {q:"What does the prefix “re-” mean?",
  o:["not","with, together","through, across, beyond","back, again"], a:3,
  why:"<b>re-</b> = back, again — as in reference: a source to back up or produce facts."},
 {q:"What does the prefix “trans-” mean?",
  o:["through, across, beyond","with, together","in, into","to carry, bear, produce"], a:0,
  why:"<b>trans-</b> = through, across, beyond — as in transfer: carry ACROSS."},
 {q:"What does the suffix “-able” mean?",
  o:["state, quality, act","able to be","like, relating to","to carry, bear, produce"], a:1,
  why:"<b>-able</b> = able to be — transferable = ABLE TO BE carried across."},
 {q:"What does the suffix “-ence” mean?",
  o:["like, relating to","able to be","back, again","state, quality, act"], a:3,
  why:"<b>-ence</b> = state, quality, act — as in reference."},
 {q:"What does the suffix “t-ile” mean?",
  o:["like, relating to","with, together","in, into; not","state, quality, act"], a:0,
  why:"<b>t-ile</b> = like, relating to — fertile = RELATING TO being able to produce."},
 {q:"“con-” + “fer” = “confer”. What does “confer” mean?",
  o:["to carry across from one place to another","to talk with another person or persons in order to produce a decision","a source to back up or produce authoritative facts","relating to not able to produce crops or offspring"], a:1,
  why:"<b>con-</b> (with, together) + <b>fer</b> (to carry, bear, produce) = talk together to produce a decision."},
 {q:"“trans-” + “fer” = “transfer”. What does “transfer” mean?",
  o:["a source to back up or produce authoritative facts","to talk with another person","to carry across from one place to another","relating to being able to produce crops"], a:2,
  why:"<b>trans-</b> (across) + <b>fer</b> (to carry) = carry across from one place to another."},
 {q:"“fer” + “t-ile” = “fertile”. What does “fertile” mean?",
  o:["relating to not able to produce crops or offspring","a source to back up facts","relating to being able to produce crops or offspring","able to be carried across"], a:2,
  why:"<b>fer</b> (to carry, bear, produce) + <b>t-ile</b> (like, relating to) = relating to being able to produce."},
 {q:"“re-” + “fer” + “-ence” = “reference”. What does “reference” mean?",
  o:["a source to back up or produce authoritative facts","to carry across from one place to another","to talk together to make a decision","able to be carried across"], a:0,
  why:"<b>re-</b> (back, again) + <b>fer</b> (to carry, bear, produce) + <b>-ence</b> (state, quality, act) = a source to back up or produce authoritative facts."},
 {q:"“in-” + “fer” + “t-ile” = “infertile”. What does “infertile” mean?",
  o:["relating to being able to produce crops or offspring","able to be carried across from one place to another","to talk together to make a decision","relating to NOT able to produce crops or offspring"], a:3,
  why:"<b>in-</b> (not) + <b>fer</b> (to carry, bear, produce) + <b>t-ile</b> (like, relating to) = relating to NOT being able to produce."},
 {q:"“trans-” + “fer” + “-able” = “transferable”. What does “transferable” mean?",
  o:["able to be carried across from one place to another","to carry across right this minute","a source to back up or produce facts","relating to not able to produce crops"], a:0,
  why:"<b>trans-</b> (across) + <b>fer</b> (to carry) + <b>-able</b> (able to be) = able to be carried across."},
 {q:"The airline ticket was not ___ to another individual.",
  o:["fertile","transferable","confer","reference"], a:1,
  why:"The ticket was not <b>transferable</b> — it could not be carried across to another person."},
 {q:"The prisoner wanted to ___ with his lawyer before pleading guilty.",
  o:["transfer","reference","confer","infertile"], a:2,
  why:"He wanted to <b>confer</b> — talk with his lawyer to produce a decision."},
 {q:"Our library has an entire floor of ___ materials.",
  o:["reference","fertile","transfer","infertile"], a:0,
  why:"A <b>reference</b> floor — sources to back up or produce authoritative facts."},
 {q:"The garden soil was dry and ___.",
  o:["fertile","infertile","transferable","confer"], a:1,
  why:"Dry soil that cannot produce crops is <b>infertile</b>."},
 {q:"Let’s ___ these files to the new cabinets.",
  o:["confer","transfer","fertile","reference"], a:1,
  why:"Carry the files across to the new cabinets = <b>transfer</b>."},
 {q:"We were surprised that the old mare was still ___.",
  o:["infertile","transferable","fertile","confer"], a:2,
  why:"Still able to produce offspring = <b>fertile</b>."}
];

const KEY = "wr13-quiz-best";
let order, idx, score, answered;
function best(){ try{ return JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){ return null; } }

function shuffle(a){
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function renderDots(){
  const d = document.getElementById("dots"); d.innerHTML = "";
  order.forEach((q,i)=>{
    const s = document.createElement("div"); s.className = "dot"; s.textContent = i+1;
    if(i < answered.length) s.classList.add(answered[i] ? "right" : "wrong");
    if(i === idx) s.classList.add("now");
    d.appendChild(s);
  });
}
function render(){
  renderDots();
  const q = QS[order[idx]];
  document.getElementById("qn").textContent = "Question " + (idx+1) + " of 20";
  document.getElementById("qq").textContent = q.q;
  const opts = document.getElementById("opts"); opts.innerHTML = "";
  const why = document.getElementById("why"); why.classList.remove("show"); why.innerHTML = "";
  const next = document.getElementById("nextBtn"); next.disabled = true;
  next.textContent = (idx === order.length-1) ? "See my score →" : "Next →";
  const oidx = shuffle(q.o.map((_,i)=>i));
  oidx.forEach((oi)=>{
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = q.o[oi];
    b.onclick = ()=>{
      const ok = (oi === q.a);
      [...opts.children].forEach((x,k)=>{
        x.disabled = true;
        if(oidx[k] === q.a) x.classList.add("right");
      });
      if(!ok) b.classList.add("wrong"); else score++;
      answered.push(ok);
      document.getElementById("score").textContent = score;
      why.innerHTML = (ok ? "✅ Correct! " : "❌ Not quite. ") + q.why;
      why.classList.add("show");
      next.disabled = false;
      renderDots();
    };
    opts.appendChild(b);
  });
}
document.getElementById("nextBtn").onclick = ()=>{
  if(idx < order.length-1){ idx++; render(); window.scrollTo({top:0,behavior:"smooth"}); }
  else finish();
};
function finish(){
  document.getElementById("qcard").classList.add("hidden");
  document.getElementById("dots").classList.add("hidden");
  const f = document.getElementById("final"); f.classList.remove("hidden");
  document.getElementById("fscore").textContent = score;
  const b = best();
  const nb = (b===null || score > b) ? score : b;
  localStorage.setItem(KEY, JSON.stringify(nb));
  document.getElementById("fbest").textContent = nb + " / 20";
  const msg = score===20 ? "Perfect! You are a true carry-master! 🏆"
    : score>=16 ? "Excellent! The fer words are really sticking! 🚚"
    : score>=12 ? "Good job! Review the ones you missed and try again."
    : "Good start! Go back to the lesson, then try again — you've got this! 💪";
  document.getElementById("fmsg").textContent = msg;
  document.getElementById("femoji").textContent = score===20 ? "🏆" : score>=12 ? "🌟" : "🌱";
  window.scrollTo({top:0,behavior:"smooth"});
}
function restart(){
  order = shuffle(QS.map((_,i)=>i));
  idx = 0; score = 0; answered = [];
  document.getElementById("score").textContent = "0";
  document.getElementById("final").classList.add("hidden");
  document.getElementById("qcard").classList.remove("hidden");
  document.getElementById("dots").classList.remove("hidden");
  render();
}
(function init(){
  const b = best();
  document.getElementById("best").textContent = b===null ? "–" : b + " / 20";
  restart();
})();
</script>
</body>
</html>
