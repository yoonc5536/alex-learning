<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lesson 2 Quiz | Word Roots Beginning</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         margin: 0; background: #f6f9f4; color: #1e293b; line-height: 1.6; }
  header { background: linear-gradient(135deg, #7c3aed, #a78bfa); color: #fff;
         padding: 30px 20px; text-align: center; }
  header h1 { margin: 6px 0 4px; font-size: 1.8rem; }
  header p { margin: 0; opacity: .92; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 24px 22px 60px; }
  .hud { background: #fff; border: 1px solid #ddd6fe; border-radius: 14px; padding: 12px 18px;
         margin: -24px auto 20px; max-width: 1000px; display: flex; justify-content: space-between;
         align-items: center; box-shadow: 0 4px 14px rgba(124,58,237,.10); font-weight: 700; }
  .dots { display: flex; flex-wrap: wrap; gap: 5px; margin: 0 0 20px; }
  .dot { width: 22px; height: 22px; border-radius: 50%; background: #e2e8f0; font-size: .7rem;
         display: flex; align-items: center; justify-content: center; color: #94a3b8; font-weight: 700; }
  .dot.right { background: #7c3aed; color: #fff; }
  .dot.wrong { background: #ef4444; color: #fff; }
  .dot.now { outline: 3px solid #c4b5fd; }
  .qcard { background: #fff; border: 1px solid #e2e8f0; border-radius: 18px; padding: 26px;
         box-shadow: 0 2px 10px rgba(30,41,59,.06); }
  .qcard .qn { font-size: .85rem; color: #94a3b8; font-weight: 700; text-transform: uppercase;
         letter-spacing: .05em; }
  .qcard h2 { margin: 6px 0 18px; font-size: 1.3rem; }
  .opt { display: block; width: 100%; text-align: left; border: 2px solid #e2e8f0; background: #fff;
         border-radius: 12px; padding: 13px 16px; margin: 0 0 10px; font-size: 1rem; font-weight: 600;
         cursor: pointer; transition: all .15s; }
  .opt:hover:not(:disabled) { border-color: #c4b5fd; background: #f5f3ff; }
  .opt.right { border-color: #16a34a; background: #dcfce7; color: #14532d; }
  .opt.wrong { border-color: #ef4444; background: #fef2f2; color: #991b1b; }
  .opt:disabled { cursor: default; }
  .why { display: none; margin-top: 14px; background: #f5f3ff; border-left: 5px solid #7c3aed;
         border-radius: 0 12px 12px 0; padding: 12px 16px; font-size: .94rem; }
  .why.show { display: block; }
  .why b { color: #5b21b6; }
  .navrow { display: flex; justify-content: space-between; margin-top: 20px; }
  .bigbtn { background: #7c3aed; color: #fff; border: none; border-radius: 12px; padding: 12px 28px;
         font-size: 1rem; font-weight: 800; cursor: pointer; }
  .bigbtn:hover { background: #6d28d9; }
  .bigbtn:disabled { background: #cbd5e1; cursor: default; }
  .ghostbtn { background: #fff; color: #475569; border: 2px solid #cbd5e1; border-radius: 12px;
         padding: 10px 22px; font-size: .95rem; font-weight: 700; cursor: pointer; text-decoration: none; }
  .final { text-align: center; background: #fff; border-radius: 18px; padding: 36px 24px;
         border: 1px solid #e2e8f0; }
  .final .score { font-size: 3.4rem; font-weight: 900; color: #7c3aed; margin: 8px 0; }
  .hidden { display: none; }
  footer { text-align: center; color: #94a3b8; font-size: .82rem; margin-top: 24px; }
</style>
</head>
<body>
<header>
  <div style="font-size:2.2rem">🎯</div>
  <h1>Lesson 2 Quiz</h1>
  <p>Use the prefixes you learned to figure out each meaning &middot; 20 questions</p>
</header>

<div class="wrap">
  <div class="hud">
    <span>Score: <span id="score">0</span> / 20</span>
    <span>Best: <span id="best">–</span></span>
    <a href="index.html" class="ghostbtn" style="padding:6px 14px;font-size:.82rem">← Lesson</a>
  </div>
  <div class="dots" id="dots"></div>

  <div class="qcard" id="qcard">
    <div class="qn" id="qn"></div>
    <h2 id="qq"></h2>
    <div id="opts"></div>
    <div class="why" id="why"></div>
    <div class="navrow">
      <span></span>
      <button class="bigbtn" id="nextBtn" disabled>Next →</button>
    </div>
  </div>

  <div class="final hidden" id="final">
    <div style="font-size:3rem" id="femoji">🌟</div>
    <h2 style="margin:6px 0">Quiz finished!</h2>
    <div class="score"><span id="fscore">0</span> / 20</div>
    <p id="fmsg" style="color:#64748b"></p>
    <p style="color:#94a3b8;font-size:.9rem">Best score: <b id="fbest">–</b></p>
    <button class="bigbtn" onclick="restart()">Try Again (shuffled)</button>
    <a href="index.html" class="ghostbtn" style="margin-left:8px">Back to Lesson 2</a>
    <a href="../lesson-3/" class="bigbtn" style="margin-left:8px;text-decoration:none">Next: Lesson 3 →</a>
  </div>

  <footer>Based on <i>Word Roots Beginning</i> &copy; 2012 The Critical Thinking Co. &middot; Made for Alex 🌱</footer>
</div>

<script>
const QS = [
 {q:"What does the prefix “dis-” mean?",
  o:["again, back","apart, opposite of","not","one"], a:1,
  why:"<b>dis-</b> = apart, opposite of — as in disappear and disagree."},
 {q:"What does the prefix “re-” mean?",
  o:["not","apart, opposite of","one","again, back"], a:3,
  why:"<b>re-</b> = again, back — as in recycle and repaint."},
 {q:"What does the prefix “un-” mean?",
  o:["not","again, back","apart, opposite of","before"], a:0,
  why:"<b>un-</b> = not — as in unhappy and unlock."},
 {q:"“dis-” + “appear” = “disappear”. What does “disappear” mean?",
  o:["to appear again","not there anymore; gone","to appear happy","to look around"], a:1,
  why:"<b>dis-</b> (opposite of) + <b>appear</b> = the opposite of appear — the book's own example!"},
 {q:"“re-” + “cycle” = “recycle”. What does “recycle” mean?",
  o:["to ride a bicycle","to use something again","to not use something","to paint again"], a:1,
  why:"<b>re-</b> (again) + <b>cycle</b> = to use again."},
 {q:"“dis-” + “agree” = “disagree”. What does “disagree” mean?",
  o:["to agree again","to not agree","to agree happily","to paint again"], a:1,
  why:"<b>dis-</b> (opposite of) + <b>agree</b> = the opposite of agree."},
 {q:"“un-” + “happy” = “unhappy”. What does “unhappy” mean?",
  o:["very happy","happy again","not happy","to open"], a:2,
  why:"<b>un-</b> (not) + <b>happy</b> = not happy."},
 {q:"“re-” + “paint” = “repaint”. What does “repaint” mean?",
  o:["to not paint","to paint again","to open paint","to paint the opposite"], a:1,
  why:"<b>re-</b> (again) + <b>paint</b> = to paint again."},
 {q:"“un-” + “lock” = “unlock”. What does “unlock” mean?",
  o:["to lock again","to not lock","to open a lock","to paint a lock"], a:2,
  why:"<b>un-</b> (not) + <b>lock</b> = to make something not locked — to open it."},
 {q:"The book says: “dis-” + “approve” = “disapprove”. What does “disapprove” mean?",
  o:["to approve again","the opposite of approve; not approve","to approve happily","to fry again"], a:1,
  why:"<b>dis-</b> means the opposite of — so disapprove is the opposite of approve."},
 {q:"The book says: “re-” + “fry” = “refry”. What does “refry” mean?",
  o:["to not fry","to fry again","to fry the opposite","to open"], a:1,
  why:"<b>re-</b> means again — so refry is to fry again."},
 {q:"The book says: “un-” + “hurt” = “unhurt”. What does “unhurt” mean?",
  o:["hurt again","not hurt","to hurt the opposite","very hurt"], a:1,
  why:"<b>un-</b> means not — so unhurt is not hurt."},
 {q:"In the story “The Snake That Chose the Paint”, John and his grandfather decided to ___ the tool shed.",
  o:["unlock","repaint","disagree","disappear"], a:1,
  why:"They found half-used gallons of paint and decided to <b>repaint</b> the shed."},
 {q:"In the story, they found the key to ___ the shed door and walked inside.",
  o:["repaint","recycle","unlock","disagree"], a:2,
  why:"They found the key to <b>unlock</b> the shed door."},
 {q:"In the story, the green snake seemed to ___ behind a paint can, then ___ again.",
  o:["disagree … unlock","disappear … reappear","recycle … repaint","unlock … disagree"], a:1,
  why:"The snake <b>disappeared</b> behind a can, then <b>reappeared</b> wrapped around the purple paint."},
 {q:"The book's tip lists SIX prefixes that mean NOT. Which of these is one of them?",
  o:["re-","dis-","im-","uni-"], a:2,
  why:"The six NOT prefixes are <b>un-, im-, il-, a-, in-, ir-</b> — as in impolite."},
 {q:"Which word uses the prefix “il-” (one of the NOT prefixes)?",
  o:["illegal","recycle","repaint","unicorn"], a:0,
  why:"<b>il-</b> + legal = <b>illegal</b> — not legal. It's one of the six NOT prefixes."},
 {q:"The book says each NOT prefix only goes with certain words. What is its example?",
  o:["“unfed can't be irfed, or afed, or imfed”","“disappear can't be undisappear”","“recycle can't be uncycle”","“repaint can't be dispaint”"], a:0,
  why:"The book says: <i>unfed</i> can't be <i>irfed</i>, or <i>afed</i>, or <i>imfed</i> — each prefix has its own words."},
 {q:"What is the book's formula for building new words with prefixes?",
  o:["ROOT + SUFFIX = NEW WORD","PREFIX- + ROOT = NEW WORD","PREFIX + PREFIX = NEW WORD","ROOT - PREFIX = NEW WORD"], a:1,
  why:"The book's formula is <b>PREFIX- + ROOT = NEW WORD</b> — as in uni- + corn = unicorn."},
 {q:"“uni-” + “corn” (horn) = “unicorn”. What does the book say about a unicorn?",
  o:["It has two horns","It has just a single horn","It has no horns","It is not a horse"], a:1,
  why:"<b>uni-</b> means one, so a unicorn has just a single horn. 🦄"}
];

const KEY = "wr2-quiz-best";
let order, idx, score, answered;
function best(){ try{ return JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){ return null; } }

function shuffle(a){
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function renderDots(){
  const d = document.getElementById("dots"); d.innerHTML = "";
  order.forEach((q,i)=>{
    const s = document.createElement("div"); s.className = "dot"; s.textContent = i+1;
    if(i < answered.length) s.classList.add(answered[i] ? "right" : "wrong");
    if(i === idx) s.classList.add("now");
    d.appendChild(s);
  });
}
function render(){
  renderDots();
  const q = QS[order[idx]];
  document.getElementById("qn").textContent = "Question " + (idx+1) + " of 20";
  document.getElementById("qq").textContent = q.q;
  const opts = document.getElementById("opts"); opts.innerHTML = "";
  const why = document.getElementById("why"); why.classList.remove("show"); why.innerHTML = "";
  const next = document.getElementById("nextBtn"); next.disabled = true;
  next.textContent = (idx === order.length-1) ? "See my score →" : "Next →";
  const oidx = shuffle(q.o.map((_,i)=>i));
  oidx.forEach((oi)=>{
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = q.o[oi];
    b.onclick = ()=>{
      const ok = (oi === q.a);
      [...opts.children].forEach((x,k)=>{
        x.disabled = true;
        if(oidx[k] === q.a) x.classList.add("right");
      });
      if(!ok) b.classList.add("wrong"); else score++;
      answered.push(ok);
      document.getElementById("score").textContent = score;
      why.innerHTML = (ok ? "✅ Correct! " : "❌ Not quite. ") + q.why;
      why.classList.add("show");
      next.disabled = false;
      renderDots();
    };
    opts.appendChild(b);
  });
}
document.getElementById("nextBtn").onclick = ()=>{
  if(idx < order.length-1){ idx++; render(); window.scrollTo({top:0,behavior:"smooth"}); }
  else finish();
};
function finish(){
  document.getElementById("qcard").classList.add("hidden");
  document.getElementById("dots").classList.add("hidden");
  const f = document.getElementById("final"); f.classList.remove("hidden");
  document.getElementById("fscore").textContent = score;
  const b = best();
  const nb = (b===null || score > b) ? score : b;
  localStorage.setItem(KEY, JSON.stringify(nb));
  document.getElementById("fbest").textContent = nb + " / 20";
  const msg = score===20 ? "Perfect! You are a true prefix master! 🏆"
    : score>=16 ? "Excellent! The prefixes are really sticking! 🧲"
    : score>=12 ? "Good job! Review the ones you missed and try again."
    : "Good start! Go back to the lesson, then try again — you've got this! 💪";
  document.getElementById("fmsg").textContent = msg;
  document.getElementById("femoji").textContent = score===20 ? "🏆" : score>=12 ? "🌟" : "🌱";
  window.scrollTo({top:0,behavior:"smooth"});
}
function restart(){
  order = shuffle(QS.map((_,i)=>i));
  idx = 0; score = 0; answered = [];
  document.getElementById("score").textContent = "0";
  document.getElementById("final").classList.add("hidden");
  document.getElementById("qcard").classList.remove("hidden");
  document.getElementById("dots").classList.remove("hidden");
  render();
}
(function init(){
  const b = best();
  document.getElementById("best").textContent = b===null ? "–" : b + " / 20";
  restart();
})();
</script>
</body>
</html>
