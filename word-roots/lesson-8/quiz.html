<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lesson 8 Quiz | Word Roots Beginning</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         margin: 0; background: #f2faf8; color: #1e293b; line-height: 1.6; }
  header { background: linear-gradient(135deg, #0f766e, #2dd4bf); color: #fff;
         padding: 30px 20px; text-align: center; }
  header h1 { margin: 6px 0 4px; font-size: 1.8rem; }
  header p { margin: 0; opacity: .92; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 24px 22px 60px; }
  .hud { background: #fff; border: 1px solid #99f6e4; border-radius: 14px; padding: 12px 18px;
         margin: -24px auto 20px; max-width: 1000px; display: flex; justify-content: space-between;
         align-items: center; box-shadow: 0 4px 14px rgba(13,148,136,.10); font-weight: 700; }
  .dots { display: flex; flex-wrap: wrap; gap: 5px; margin: 0 0 20px; }
  .dot { width: 22px; height: 22px; border-radius: 50%; background: #e2e8f0; font-size: .7rem;
         display: flex; align-items: center; justify-content: center; color: #94a3b8; font-weight: 700; }
  .dot.right { background: #0d9488; color: #fff; }
  .dot.wrong { background: #ef4444; color: #fff; }
  .dot.now { outline: 3px solid #5eead4; }
  .qcard { background: #fff; border: 1px solid #e2e8f0; border-radius: 18px; padding: 26px;
         box-shadow: 0 2px 10px rgba(30,41,59,.06); }
  .qcard .qn { font-size: .85rem; color: #94a3b8; font-weight: 700; text-transform: uppercase;
         letter-spacing: .05em; }
  .qcard h2 { margin: 6px 0 18px; font-size: 1.3rem; }
  .opt { display: block; width: 100%; text-align: left; border: 2px solid #e2e8f0; background: #fff;
         border-radius: 12px; padding: 13px 16px; margin: 0 0 10px; font-size: 1rem; font-weight: 600;
         cursor: pointer; transition: all .15s; }
  .opt:hover:not(:disabled) { border-color: #5eead4; background: #f0fdfa; }
  .opt.right { border-color: #16a34a; background: #dcfce7; color: #14532d; }
  .opt.wrong { border-color: #ef4444; background: #fef2f2; color: #991b1b; }
  .opt:disabled { cursor: default; }
  .why { display: none; margin-top: 14px; background: #f0fdfa; border-left: 5px solid #0d9488;
         border-radius: 0 12px 12px 0; padding: 12px 16px; font-size: .94rem; }
  .why.show { display: block; }
  .why b { color: #0f766e; }
  .navrow { display: flex; justify-content: space-between; margin-top: 20px; }
  .bigbtn { background: #0d9488; color: #fff; border: none; border-radius: 12px; padding: 12px 28px;
         font-size: 1rem; font-weight: 800; cursor: pointer; }
  .bigbtn:hover { background: #0b7c74; }
  .bigbtn:disabled { background: #cbd5e1; cursor: default; }
  .ghostbtn { background: #fff; color: #475569; border: 2px solid #cbd5e1; border-radius: 12px;
         padding: 10px 22px; font-size: .95rem; font-weight: 700; cursor: pointer; text-decoration: none; }
  .final { text-align: center; background: #fff; border-radius: 18px; padding: 36px 24px;
         border: 1px solid #e2e8f0; }
  .final .score { font-size: 3.4rem; font-weight: 900; color: #0d9488; margin: 8px 0; }
  .hidden { display: none; }
  footer { text-align: center; color: #94a3b8; font-size: .82rem; margin-top: 24px; }
</style>
</head>
<body>
<header>
  <div style="font-size:2.2rem">🎯</div>
  <h1>Lesson 8 Quiz</h1>
  <p>Use the root <b>loc</b> and the suffixes to figure out each meaning &middot; 20 questions</p>
</header>

<div class="wrap">
  <div class="hud">
    <span>Score: <span id="score">0</span> / 20</span>
    <span>Best: <span id="best">–</span></span>
    <a href="index.html" class="ghostbtn" style="padding:6px 14px;font-size:.82rem">← Lesson</a>
  </div>
  <div class="dots" id="dots"></div>

  <div class="qcard" id="qcard">
    <div class="qn" id="qn"></div>
    <h2 id="qq"></h2>
    <div id="opts"></div>
    <div class="why" id="why"></div>
    <div class="navrow">
      <span></span>
      <button class="bigbtn" id="nextBtn" disabled>Next →</button>
    </div>
  </div>

  <div class="final hidden" id="final">
    <div style="font-size:3rem" id="femoji">🌟</div>
    <h2 style="margin:6px 0">Quiz finished!</h2>
    <div class="score"><span id="fscore">0</span> / 20</div>
    <p id="fmsg" style="color:#64748b"></p>
    <p style="color:#94a3b8;font-size:.9rem">Best score: <b id="fbest">–</b></p>
    <button class="bigbtn" onclick="restart()">Try Again (shuffled)</button>
    <a href="index.html" class="ghostbtn" style="margin-left:8px">Back to Lesson 8</a>
    <a href="../lesson-9/" class="bigbtn" style="margin-left:8px;text-decoration:none">Next: Lesson 9 →</a>
  </div>

  <footer>Based on <i>Word Roots Beginning</i> &copy; 2012 The Critical Thinking Co. &middot; Made for Alex 🌱</footer>
</div>

<script>
const QS = [
 {q:"What does the root \u201cloc\u201d mean?",
  o:["place","to make, to act","in the manner of","like, related to"], a:0,
  why:"<b>loc</b> = place — the root of every word in this lesson."},
 {q:"What does the suffix \u201c-ale\u201d mean?",
  o:["to make, to act","like, related to","place where","in the manner of"], a:2,
  why:"<b>-ale</b> = place where — loc + -ale = <b>locale</b>."},
 {q:"What does the suffix \u201c-ate\u201d mean?",
  o:["place where","in the manner of","like, related to","to make, to act; one who, that which"], a:3,
  why:"<b>-ate</b> = to make, to act; one who, that which — loc + -ate = <b>locate</b>."},
 {q:"What does the suffix \u201c-al\u201d mean?",
  o:["like, related to; an action or process","place where","in the manner of","to make, to act"], a:0,
  why:"<b>-al</b> = like, related to; an action or process — loc + -al = <b>local</b>."},
 {q:"What does the suffix \u201c-ly\u201d mean?",
  o:["place where","to make, to act","in the manner of","like, related to"], a:2,
  why:"<b>-ly</b> = in the manner of — loc + -al + -ly = <b>locally</b>."},
 {q:"\u201cloc\u201d + \u201c-ate\u201d = \u201clocate\u201d. What does \u201clocate\u201d mean?",
  o:["like or related to a particular place","to find where something is","a place where something special happened","in the manner of being local"], a:1,
  why:"<b>loc</b> (place) + <b>-ate</b> (to make, to act) = <b>locate</b> — to find where something is."},
 {q:"\u201cloc\u201d + \u201c-al\u201d = \u201clocal\u201d. What does \u201clocal\u201d mean?",
  o:["to find where something is","in the manner of being local","like or related to a particular place","a place where something special happened"], a:2,
  why:"<b>loc</b> (place) + <b>-al</b> (like, related to) = <b>local</b> — like or related to a particular place."},
 {q:"\u201cloc\u201d + \u201c-ale\u201d = \u201clocale\u201d. What does \u201clocale\u201d mean?",
  o:["to find where something is","in the manner of being local","like or related to a particular place","a place or area where something special was, is, or happened"], a:3,
  why:"<b>loc</b> (place) + <b>-ale</b> (place where) = <b>locale</b> — a place or area where something special was, is, or happened."},
 {q:"\u201cloc\u201d + \u201c-al\u201d + \u201c-ly\u201d = \u201clocally\u201d. What does \u201clocally\u201d mean?",
  o:["to find where something is","a place where something special happened","in the manner of being local (in a particular place or area)","like or related to a particular place"], a:2,
  why:"<b>loc</b> + <b>-al</b> + <b>-ly</b> (in the manner of) = <b>locally</b> — in the manner of being local."},
 {q:"Which Lesson 8 word has TWO suffixes?",
  o:["locate","local","locale","locally"], a:3,
  why:"<b>locally</b> = loc + <b>-al</b> + <b>-ly</b>. The book's footnote says: a word can have more than one suffix!"},
 {q:"\u201cA place or area where something special was, is, or happened\u201d is which word?",
  o:["locale","locate","local","locally"], a:0,
  why:"That's <b>locale</b> — the <b>-ale</b> suffix means \u201cplace where.\u201d"},
 {q:"\u201cTo find where something is\u201d is which word?",
  o:["locale","local","locate","locally"], a:2,
  why:"That's <b>locate</b> — loc + <b>-ate</b> (to make, to act)."},
 {q:"\u201cLike or related to a particular place\u201d is which word?",
  o:["local","locate","locale","locally"], a:0,
  why:"That's <b>local</b> — loc + <b>-al</b> (like, related to)."},
 {q:"\u201cIn the manner of being local\u201d is which word?",
  o:["locate","local","locally","locale"], a:2,
  why:"That's <b>locally</b> — loc + -al + <b>-ly</b> (in the manner of)."},
 {q:"Activity B: Circle each item that would help you locate a place. Which item should NOT be circled?",
  o:["globe","compass","microscope","country map"], a:2,
  why:"A <b>microscope</b> looks at tiny things — it won't help you <b>locate</b> a place. Globe, compass, and country map all help."},
 {q:"Activity B: Which item should NOT be circled?",
  o:["drill","eyes / glasses","local signs","map / signs"], a:0,
  why:"A <b>drill</b> makes holes — it won't help you <b>locate</b> a place."},
 {q:"In \u201cAn Animal Tour of India\u201d: \u201c\u2026and, in various ___, 60% of the world's tigers.\u201d",
  o:["locate","local","locally","locales"], a:3,
  why:"The tigers live in various <b>locales</b> — places where something special is. <b>-ale</b> = place where."},
 {q:"In the story: \u201cIf we keep our eyes open, we might ___ a mongoose hiding in the brush.\u201d",
  o:["locally","locate","local","locales"], a:1,
  why:"They might <b>locate</b> the mongoose — find where it is. loc + <b>-ate</b> (to make, to act)."},
 {q:"In the story: \u201cMany of the ___ people in town keep them as pets to keep away cobras!\u201d",
  o:["locate","local","locale","locally"], a:1,
  why:"The <b>local</b> people — people related to that particular place. loc + <b>-al</b> (like, related to)."},
 {q:"In the story: \u201cWe won't see cobras here ___.\u201d",
  o:["locally","locate","local","locale"], a:0,
  why:"<b>Locally</b> — in the manner of being local, in this particular place. loc + -al + <b>-ly</b>."}
];

const KEY = "wr8-quiz-best";
let order, idx, score, answered;
function best(){ try{ return JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){ return null; } }

function shuffle(a){
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function renderDots(){
  const d = document.getElementById("dots"); d.innerHTML = "";
  order.forEach((q,i)=>{
    const s = document.createElement("div"); s.className = "dot"; s.textContent = i+1;
    if(i < answered.length) s.classList.add(answered[i] ? "right" : "wrong");
    if(i === idx) s.classList.add("now");
    d.appendChild(s);
  });
}
function render(){
  renderDots();
  const q = QS[order[idx]];
  document.getElementById("qn").textContent = "Question " + (idx+1) + " of 20";
  document.getElementById("qq").textContent = q.q;
  const opts = document.getElementById("opts"); opts.innerHTML = "";
  const why = document.getElementById("why"); why.classList.remove("show"); why.innerHTML = "";
  const next = document.getElementById("nextBtn"); next.disabled = true;
  next.textContent = (idx === order.length-1) ? "See my score →" : "Next →";
  const oidx = shuffle(q.o.map((_,i)=>i));
  oidx.forEach((oi)=>{
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = q.o[oi];
    b.onclick = ()=>{
      const ok = (oi === q.a);
      [...opts.children].forEach((x,k)=>{
        x.disabled = true;
        if(oidx[k] === q.a) x.classList.add("right");
      });
      if(!ok) b.classList.add("wrong"); else score++;
      answered.push(ok);
      document.getElementById("score").textContent = score;
      why.innerHTML = (ok ? "✅ Correct! " : "❌ Not quite. ") + q.why;
      why.classList.add("show");
      next.disabled = false;
      renderDots();
    };
    opts.appendChild(b);
  });
}
document.getElementById("nextBtn").onclick = ()=>{
  if(idx < order.length-1){ idx++; render(); window.scrollTo({top:0,behavior:"smooth"}); }
  else finish();
};
function finish(){
  document.getElementById("qcard").classList.add("hidden");
  document.getElementById("dots").classList.add("hidden");
  const f = document.getElementById("final"); f.classList.remove("hidden");
  document.getElementById("fscore").textContent = score;
  const b = best();
  const nb = (b===null || score > b) ? score : b;
  localStorage.setItem(KEY, JSON.stringify(nb));
  document.getElementById("fbest").textContent = nb + " / 20";
  const msg = score===20 ? "Perfect! You are a true suffix master! 🏆"
    : score>=16 ? "Excellent! The root loc is really sticking! 📍"
    : score>=12 ? "Good job! Review the ones you missed and try again."
    : "Good start! Go back to the lesson, then try again — you've got this! 💪";
  document.getElementById("fmsg").textContent = msg;
  document.getElementById("femoji").textContent = score===20 ? "🏆" : score>=12 ? "🌟" : "🌱";
  window.scrollTo({top:0,behavior:"smooth"});
}
function restart(){
  order = shuffle(QS.map((_,i)=>i));
  idx = 0; score = 0; answered = [];
  document.getElementById("score").textContent = "0";
  document.getElementById("final").classList.add("hidden");
  document.getElementById("qcard").classList.remove("hidden");
  document.getElementById("dots").classList.remove("hidden");
  render();
}
(function init(){
  const b = best();
  document.getElementById("best").textContent = b===null ? "–" : b + " / 20";
  restart();
})();
</script>
</body>
</html>
